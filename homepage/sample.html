function vis(el, vw, vh) {
  var cs = el.ownerDocument.defaultView.getComputedStyle(el);
  if (cs.display === 'none' || cs.visibility === 'hidden' || parseFloat(cs.opacity) < 0.05) return null;
  var r = el.getBoundingClientRect();
  if (r.width < 30 || r.height < 20 || r.bottom < 20 || r.top > vh - 20 || r.right < 0 || r.left > vw) return null;
  return r;
}

function anyVis(d, sel, vw, vh) {
  var n = d.querySelectorAll(sel);
  for (var i = 0; i < n.length; i++) if (vis(n[i], vw, vh)) return true;
  return false;
}

function closeDiff(d) {

  backdrop.id = 'smk-diff-backdrop';

    if (e) { e.preventDefault(); e.stopPropagation(); }
    closeDiff(d);

  backdrop.addEventListener('click', onBackdropClose, { capture: true });

  layer.appendChild(backdrop);

  // 2) 팝업 박스 생성
  var box = d.createElement('div');
  box.id = 'smk-diff-box';
  box.setAttribute('role', 'dialog');
  box.setAttribute('aria-modal', 'true');
  box.innerHTML = '<div class="sdb-head"><span class="sdb-tag">★ 프로 vs ✦ 시그니처 차이점</span><button type="button" class="sdb-x" aria-label="닫기">✕</button></div>' +
    '<div class="sdb-title">' + m.name + '</div>' +
    '<div class="sdb-body">' +
      '<div class="sdb-p"><b>• ' + m.diff.pro + '</b></div>' +
      '<div class="sdb-p"><b>• ' + m.diff.sig + '</b></div>' +
    '</div>' +
    '<div class="sdb-foot">💡 ' + m.diff.cost + '</div>' +
    '<button type="button" class="sdb-close-btn" id="sdbCloseAction">확인 (닫기)</button>';

  function doClose(e) {
    if (e) {
      e.preventDefault();
      e.stopPropagation();
    }
    closeDiff(d);
  }

  // 상단 ✕ 버튼 이벤트 (click, touchend, pointerdown)
  var xBtn = box.querySelector('.sdb-x');
  if (xBtn) {
    xBtn.addEventListener('click', doClose, { capture: true });
    xBtn.addEventListener('touchend', doClose, { capture: true });
  }

  // 하단 '확인 (닫기)' 버튼 이벤트 (click, touchend, pointerdown)
  var cBtn = box.querySelector('.sdb-close-btn');
  if (cBtn) {
    cBtn.addEventListener('click', doClose, { capture: true });
    cBtn.addEventListener('touchend', doClose, { capture: true });
  }

  // 박스 내부 터치 시 백드롭으로의 이벤트 전파 차단
  box.addEventListener('click', function(e) {
    if (!e.target.closest('.sdb-close-btn') && !e.target.closest('.sdb-x')) {
      e.stopPropagation();
    }
  });
  box.addEventListener('touchend', function(e) {
    if (!e.target.closest('.sdb-close-btn') && !e.target.closest('.sdb-x')) {
      e.stopPropagation();
    }
  });

  layer.appendChild(box);

  // 3) 모바일 화면 중앙 또는 스마트 앵커 위치 계산
  var bw = box.offsetWidth || Math.min(330, vw * 0.92);
  var bh = box.offsetHeight || 220;
  var top, left;

  if (vw <= 640) {
    // 모바일 뷰: 화면 정중앙 수평 정렬, 상하는 앵커 근처 또는 중앙
    left = Math.max(8, Math.round((vw - bw) / 2));
    top = Math.max(56, Math.min(anchorR.top + anchorR.height + 8, vh - bh - 16));
    if (top + bh > vh - 10) {
      top = Math.max(56, Math.round((vh - bh) / 2));
    }
  } else {
    // 데스크탑: 앵커 아래/위
    top = anchorR.top + anchorR.height + 6;
    left = Math.min(Math.max(anchorR.left, 10), vw - bw - 12);
    if (top + bh > vh - 10) top = Math.max(anchorR.top - bh - 8, 60);
  }

  box.style.top = top + 'px';
  box.style.left = left + 'px';
}

function applySampleCustomizations(d) {
  if (!d || !d.body) return;
  // 0) 가로 런웨이 카드 내 이미지 지연 로딩 해제 (즉시 로드 보장)
  var lazyImgs = d.querySelectorAll('img[loading="lazy"]');
  for (var m = 0; m < lazyImgs.length; m++) {
    lazyImgs[m].loading = 'eager';
  }

  // 1) 3D 인체 모형: 근육/신경/관절/혈관 메뉴 탭 숨김
  var layerEls = d.querySelectorAll('.sys-mode-btn, .layer-btn, .organ-layer-btn, [data-sys="muscle"], [data-sys="nerve"], [data-sys="joint"], [data-sys="vessel"], [data-layer="muscle"], [data-layer="nerve"], [data-layer="joint"], [data-layer="vessel"], #vh-layer-selector, .vh-layer-selector');
  for (var i = 0; i < layerEls.length; i++) {
    layerEls[i].style.setProperty('display', 'none', 'important');
  }
  var topLbl = d.getElementById('stage-active-part-label');
  if (topLbl && topLbl.textContent.indexOf('근육·신경·관절·혈관') !== -1) {
    topLbl.textContent = '우측 진료 살펴보기 메뉴 또는 부위별 포인트를 선택해 보세요';
  }

  // 2) 오늘의 건강 글: 1, 2, 3 번 카드만 노출 (4번째 이후 숨김)
  var partChips = d.querySelectorAll('.vh-part-chip');
  if (partChips.length > 3) {
    for (var p = 3; p < partChips.length; p++) {
      partChips[p].style.setProperty('display', 'none', 'important');
    }
  }
  var archiveBtns = d.querySelectorAll('.archive-card-btn');
  if (archiveBtns.length > 3) {
    for (var a = 3; a < archiveBtns.length; a++) {
      archiveBtns[a].style.setProperty('display', 'none', 'important');
    }
  }
  var postCards = d.querySelectorAll('.health-post-card, .encyclopedia-card, .today-post-item, .health-article-card');
  if (postCards.length > 3) {
    for (var j = 3; j < postCards.length; j++) {
      postCards[j].style.setProperty('display', 'none', 'important');
    }
  }
}

function tick() {
  var d; try { d = frame.contentDocument; if (!d || !d.body || d.readyState === 'loading') return; } catch (e) { return; }
  var w = frame.contentWindow, vw = w.innerWidth, vh = w.innerHeight;

  applySampleCustomizations(d);

  var layer = d.getElementById('smk-layer');
  if (!layer) {
    var st = d.createElement('style'); st.textContent = STYLE; d.head.appendChild(st);
    layer = d.createElement('div'); layer.id = 'smk-layer'; d.body.appendChild(layer);
    function handleProClick(e) {
      var t = e.target.closest('.smk-pro-btn');
      if (t) {
        e.stopPropagation(); e.preventDefault();
        var idx = +t.getAttribute('data-idx');
        showDiff(d, idx, t.getBoundingClientRect(), vw, vh);
        return;
      }
      if (e.target.closest('.sdb-close-btn') || e.target.closest('.sdb-x')) {
        e.stopPropagation(); e.preventDefault();
        closeDiff(d);
        return;
      }
      if (e.target.closest('.smk') || e.target.closest('#smk-diff-box')) {
        e.stopPropagation();
        return;
      }
      closeDiff(d);
    }
    d.addEventListener('click', handleProClick, true);
    d.addEventListener('touchend', function(e) {
      if (e.target.closest('.sdb-close-btn') || e.target.closest('.sdb-x')) {
        e.stopPropagation(); e.preventDefault();
        closeDiff(d);
      }
    }, { capture: true, passive: false });
  }
  var placed = [];
  MARKS.forEach(function(m, i) {
    var pill = d.getElementById('smk-' + i), r = null;
    if (!(m.when && !anyVis(d, m.when, vw, vh)) && !(m.unless && anyVis(d, m.unless, vw, vh))) {
      m.sel.split(',').forEach(function(s) { if (r) return; var n = d.querySelectorAll(s); for (var k = 0; k < n.length && !r; k++) r = vis(n[k], vw, vh); });
    }
    if (!r) { if (pill) pill.style.display = 'none'; return; }
    if (!pill) {
      pill = d.createElement('div'); pill.id = 'smk-' + i; pill.className = 'smk';
      pill.innerHTML = markHtml(m, i); layer.appendChild(pill);
    }
    pill.style.display = 'flex';
    var pw = pill.offsetWidth, ph = pill.offsetHeight;
    var top, left;
    if (m.pos === 'left' && r.left - pw - 10 > 8) { top = r.top + 10; left = r.left - pw - 10; }
    else { top = r.top - ph / 2; left = r.left + 14; }
    if (top < 64) top = 70; top = Math.min(top, vh - ph - 8); left = Math.min(Math.max(left, 8), vw - pw - 8);
    for (var q = 0; q < placed.length; q++) { var o = placed[q]; if (left < o.l + o.w + 4 && left + pw + 4 > o.l && top < o.t + o.h + 4 && top + ph + 4 > o.t) top = o.t + o.h + 6; }
    pill.style.top = top + 'px'; pill.style.left = left + 'px'; placed.push({ l: left, t: top, w: pw, h: ph });
  });
}
setInterval(tick, 250);

function openDiff(idx) {
  var d; try { d = frame.contentDocument; } catch(e) { return false; }
  if (!d) return false;
  var btn = d.querySelector('.smk-pro-btn[data-idx="' + idx + '"]');
  if (btn) {
    showDiff(d, +idx, btn.getBoundingClientRect(), frame.contentWindow.innerWidth, frame.contentWindow.innerHeight);
    return true;
  }
  return false;
}

var qd = (location.search.match(/[?&]diff=(\d+)/) || [])[1];
if (qd !== undefined) {
  var diffTimer = setInterval(function() {
    if (openDiff(+qd)) clearInterval(diffTimer);
  }, 200);
  setTimeout(function() { clearInterval(diffTimer); }, 6000);
}

var tt;
window.addEventListener('message', function(e) {
  if (e.data && e.data.bareunSample === 'blocked') {
    var t = document.getElementById('toast');
    t.textContent = '샘플이라 저장·전송되지 않습니다. 실제 홈페이지에서는 정상 등록됩니다.';
    t.hidden = false; clearTimeout(tt); tt = setTimeout(function() { t.hidden = true; }, 2600);
  }
});
</script>
</body>
</html>
