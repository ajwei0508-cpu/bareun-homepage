<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>3D 인체모형 & 바른한의원 진료 모션 탐색기 | 바른한의원 대전본점</title>
  <meta name="description" content="전체화면 3D 인체모형과 함께 바른한의원 대전본점 9대 진료 분야를 인터랙티브 그래픽모션으로 탐색하고, 연관 클리닉·부위별 생활꿀팁·해외 의학 논문 근거·질환별 비공개 Q&A를 한눈에 확인하세요." />
  <link rel="canonical" href="https://www.bareunhaniwon.com/body-explorer/" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700;800&family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --sky-a: #95AEF8;
      --sky-b: #BCCBFA;
      --sky-c: #E4E0FB;
      --accent-active: #2563EB;
      --ink-900: #0F172A;
      --ink-700: #334155;
      --ink-500: #64748B;
      --glass-dock: rgba(235, 241, 255, 0.56);
      --glass-border: rgba(255, 255, 255, 0.78);
      --pill-bg: rgba(255, 255, 255, 0.88);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--ink-900);
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    /* FULL-SCREEN VIBRANT WELLNESS ATMOSPHERIC STAGE */
    .vibrant-fullscreen-app {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background:
        radial-gradient(circle at 22% 24%, var(--sky-a) 0%, transparent 52%),
        radial-gradient(circle at 68% 36%, var(--sky-c) 0%, transparent 58%),
        linear-gradient(135deg, var(--sky-a) 0%, var(--sky-b) 44%, var(--sky-c) 78%, #F2F5FF 100%);
      transition: background 0.8s ease;
      overflow: hidden;
    }

    /* Architectural subtle left vertical hairline (from Vibrant reference) */
    .vibrant-left-hairline {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 28px;
      width: 1px;
      background: linear-gradient(180deg, rgba(255,255,255,0.65) 0%, rgba(255,255,255,0.32) 50%, rgba(255,255,255,0.65) 100%);
      z-index: 15;
      pointer-events: none;
    }

    /* FULL-SCREEN WEBGL CANVAS */
    #vibrant-body-canvas {
      position: absolute;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
      display: block;
      z-index: 5;
      cursor: grab;
    }
    #vibrant-body-canvas:active { cursor: grabbing; }

    /* TOP FLOATING NAVIGATION & GENDER PILL */
    .vibrant-top-bar {
      position: fixed;
      top: 18px;
      left: 44px;
      right: 28px;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
    }
    .vtb-left, .vtb-center, .vtb-right {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    @media (min-width: 981px) {
      .vtb-center {
        position: fixed;
        top: 18px;
        left: 33.5%;
        transform: translateX(-50%);
      }
    }

    /* Vibrant Reference Top Gender Pill Toggle: 여성 ♀ | 남성 ♂ */
    .vibrant-gender-capsule {
      display: inline-flex;
      align-items: center;
      padding: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.34);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.68);
      box-shadow: 0 8px 24px rgba(59, 89, 182, 0.12);
    }
    .vg-btn {
      appearance: none;
      border: none;
      background: transparent;
      color: #334155;
      font-size: 0.82rem;
      font-weight: 700;
      padding: 7px 18px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
      letter-spacing: -0.01em;
    }
    .vg-btn.active {
      background: #0B6BCB;
      color: #FFFFFF;
      box-shadow: 0 4px 12px rgba(11, 107, 203, 0.36);
    }

    .vtb-brand-link {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 8px 15px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.52);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.75);
      color: #0F172A;
      text-decoration: none;
      font-weight: 800;
      font-size: 0.85rem;
      box-shadow: 0 6px 20px rgba(30, 58, 138, 0.08);
      transition: all 0.2s ease;
    }
    .vtb-brand-link:hover {
      background: rgba(255, 255, 255, 0.85);
      transform: translateY(-1px);
    }
    .brand-nodes-svg {
      color: #1E3A8A;
      display: flex;
    }

    .vtb-nav-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.62);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.82);
      color: #0F172A;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .vtb-nav-pill:hover {
      background: #FFFFFF;
      transform: translateY(-1px);
    }
    .vtb-nav-pill.dark {
      background: rgba(15, 23, 42, 0.88);
      border-color: rgba(15, 23, 42, 0.95);
      color: #FFFFFF;
    }

    /* BOTTOM-LEFT CAMERA QUICK CONTROLS */
    .vibrant-bottom-left-hud {
      position: fixed;
      left: 48px;
      bottom: 24px;
      z-index: 55;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .hud-chip-btn {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.78);
      background: rgba(255, 255, 255, 0.52);
      backdrop-filter: blur(14px);
      color: #1E293B;
      font-size: 0.78rem;
      font-weight: 800;
      padding: 8px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 6px 18px rgba(30, 58, 138, 0.08);
    }
    .hud-chip-btn:hover { background: rgba(255, 255, 255, 0.9); }

    /* 3D HOTSPOTS OVERLAY (Exact Vibrant Glowing Double-Ring White Dots) */
    #hotspot-overlay-layer, #sub-hotspot-overlay-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 25;
      overflow: hidden;
    }
    #sub-hotspot-overlay-layer { z-index: 30; }

    .vibrant-hotspot {
      position: absolute;
      width: 34px;
      height: 34px;
      transform: translate(-50%, -50%);
      pointer-events: auto;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.28s ease, transform 0.28s ease;
    }
    .vh-dot-outer {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.45) 0%, rgba(165,192,255,0.28) 70%);
      border: 1.5px solid rgba(255, 255, 255, 0.92);
      box-shadow: 0 0 18px rgba(255, 255, 255, 0.68), inset 0 0 8px rgba(255, 255, 255, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      animation: hotspotBreathe 3.2s ease-in-out infinite;
    }
    @keyframes hotspotBreathe {
      0%, 100% { transform: scale(1); box-shadow: 0 0 16px rgba(255,255,255,0.62); }
      50% { transform: scale(1.09); box-shadow: 0 0 26px rgba(255,255,255,0.92); }
    }
    .vh-dot-core {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #FFFFFF;
      box-shadow: 0 0 8px #FFFFFF;
    }
    .vh-hover-pill {
      position: absolute;
      left: calc(100% + 10px);
      top: 50%;
      padding: 5px 11px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.86);
      backdrop-filter: blur(8px);
      color: #FFFFFF;
      font-size: 0.75rem;
      font-weight: 700;
      white-space: nowrap;
      opacity: 0;
      transform: translate(-6px, -50%);
      pointer-events: none;
      transition: all 0.2s ease;
    }
    .vibrant-hotspot:hover .vh-hover-pill,
    .vibrant-hotspot.active .vh-hover-pill {
      opacity: 1;
      transform: translate(0, -50%);
    }
    .vibrant-hotspot.active .vh-dot-outer {
      background: var(--accent-active);
      border-color: #FFFFFF;
      transform: scale(1.18);
      box-shadow: 0 0 0 6px rgba(255, 255, 255, 0.38), 0 8px 22px rgba(37, 99, 235, 0.5);
      animation: none;
    }
    .vibrant-hotspot.dimmed {
      opacity: 0.36;
    }

    /* CASCADED SECONDARY 3D SUB-FOCUS CALLOUT PILLS */
    .sub-focus-3d-pill {
      position: absolute;
      transform: translate(-50%, -135%) scale(0.86);
      opacity: 0;
      pointer-events: auto;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      border: 1.5px solid var(--accent-active);
      color: #0F172A;
      font-size: 0.75rem;
      font-weight: 800;
      white-space: nowrap;
      box-shadow: 0 8px 22px rgba(15, 23, 42, 0.16);
      transition: opacity 0.36s ease, transform 0.36s cubic-bezier(0.22, 1, 0.36, 1), background 0.2s ease;
    }
    .sub-focus-3d-pill.visible {
      opacity: 1;
      transform: translate(-50%, -135%) scale(1);
    }
    .sub-focus-3d-pill:hover, .sub-focus-3d-pill.active {
      background: var(--accent-active);
      color: #FFFFFF;
    }
    .sf-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-active);
    }
    .sub-focus-3d-pill:hover .sf-dot, .sub-focus-3d-pill.active .sf-dot {
      background: #FFFFFF;
    }

    .vibrant-fullscreen-app p, .vibrant-menu-dock p { margin: 0 !important; }
    .vibrant-fullscreen-app button { text-transform: none; }

    /* ======================================================================
       RIGHT-SIDE FROSTED GLASS CLINIC MENU DOCK (Vibrant Wellness Layout!)
       ====================================================================== */
    .vibrant-menu-dock {
      position: fixed;
      right: 28px;
      bottom: 16px;
      width: min(390px, calc(100vw - 48px));
      max-height: calc(100vh - 76px);
      overflow-y: auto;
      scrollbar-width: thin;
      z-index: 65;
      padding: 15px 16px;
      border-radius: 26px;
      background: var(--glass-dock);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1.5px solid var(--glass-border);
      box-shadow: 0 24px 60px rgba(42, 67, 145, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.85);
      transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .vibrant-menu-dock.expanded-cascade {
      width: min(440px, calc(100vw - 48px));
    }
    .vibrant-menu-dock::-webkit-scrollbar { width: 5px; }
    .vibrant-menu-dock::-webkit-scrollbar-thumb { background: rgba(100, 116, 139, 0.28); border-radius: 999px; }

    .dock-header-title {
      text-align: center;
      font-size: 0.86rem;
      font-weight: 800;
      color: #1E293B;
      letter-spacing: -0.01em;
      margin-bottom: 12px;
    }

    .clinic-pill-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .vibrant-clinic-pill {
      width: 100%;
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.92);
      background: var(--pill-bg);
      border-radius: 18px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
      text-align: left;
      text-decoration: none;
      color: #0F172A;
      box-shadow: 0 4px 14px rgba(51, 78, 158, 0.06);
      transition: all 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .vibrant-clinic-pill:hover {
      background: #FFFFFF;
      transform: translateX(-3px);
      box-shadow: 0 10px 24px rgba(37, 99, 235, 0.14);
      border-color: #93C5FD;
    }
    .vcp-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .vcp-icon {
      width: 34px;
      height: 34px;
      border-radius: 11px;
      background: rgba(224, 231, 255, 0.72);
      color: #1E3A8A;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }
    .vibrant-clinic-pill:hover .vcp-icon {
      background: #2563EB;
      color: #FFFFFF;
    }
    .vcp-title {
      font-size: 0.9rem;
      font-weight: 800;
      color: #0F172A;
      line-height: 1.25;
    }
    .vcp-sub {
      font-size: 0.73rem;
      font-weight: 600;
      color: #64748B;
      margin-top: 2px;
    }
    .vcp-chevron {
      font-size: 1.1rem;
      font-weight: 700;
      color: #475569;
      flex-shrink: 0;
    }

    /* SEQUENTIAL CASCADING ANIMATION FOR RELATED SUB-MENUS */
    .cascade-stage {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .cascade-step {
      opacity: 0;
      transform: translateY(12px);
      animation: cascadeReveal 0.42s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .cascade-step.d1 { animation-delay: 0.04s; }
    .cascade-step.d2 { animation-delay: 0.12s; }
    .cascade-step.d3 { animation-delay: 0.21s; }
    .cascade-step.d4 { animation-delay: 0.30s; }
    @keyframes cascadeReveal {
      to { opacity: 1; transform: translateY(0); }
    }

    .cascade-back-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .cascade-back-btn {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.9);
      background: rgba(255, 255, 255, 0.78);
      color: #1E293B;
      font-size: 0.78rem;
      font-weight: 800;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
    }
    .cascade-back-btn:hover { background: #FFFFFF; }

    .active-motion-card {
      background: rgba(255, 255, 255, 0.92);
      border: 1.5px solid #BFDBFE;
      border-radius: 20px;
      padding: 12px 14px;
    }
    .amc-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.71rem;
      font-weight: 800;
      color: var(--accent-active);
      background: #EFF6FF;
      padding: 3px 10px;
      border-radius: 999px;
      margin-bottom: 6px;
    }
    .amc-live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-active);
      animation: pulseDot 1.4s infinite;
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.35); }
    }

    .cascade-group-label {
      font-size: 0.73rem;
      font-weight: 800;
      color: #334155;
      letter-spacing: 0.03em;
      margin: 2px 2px 5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .action-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }
    .cascade-action-btn {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.92) !important;
      background: rgba(255, 255, 255, 0.9) !important;
      border-radius: 14px;
      padding: 10px 12px;
      text-align: left;
      cursor: pointer;
      text-decoration: none;
      color: #0F172A !important;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .cascade-action-btn:hover {
      background: #FFFFFF !important;
      border-color: var(--accent-active) !important;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.14);
    }
    .cascade-action-btn.primary-qna {
      grid-column: span 2;
      background: linear-gradient(135deg, #0F172A 0%, #1E3A8A 100%) !important;
      border-color: #1E3A8A !important;
      color: #FFFFFF !important;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      padding: 11px 15px;
    }

    /* SLIDE-OVER KNOWLEDGE DRAWER (LIFESTYLE TIPS OR INTERNATIONAL SCI PAPERS) */
    .glass-drawer-backdrop {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(15, 23, 42, 0.36);
      backdrop-filter: blur(6px);
      display: none;
      justify-content: flex-end;
    }
    .glass-drawer-backdrop.open { display: flex; }
    .glass-drawer-panel {
      width: min(680px, 100vw);
      height: 100vh;
      overflow-y: auto;
      background: rgba(255, 255, 255, 0.97);
      padding: 30px 32px 60px;
      box-shadow: -20px 0 60px rgba(15, 23, 42, 0.22);
      user-select: text;
      animation: slideInRight 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes slideInRight {
      from { transform: translateX(40px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    .drawer-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 16px;
      border-bottom: 1px solid #E2E8F0;
      margin-bottom: 20px;
    }
    .drawer-close-btn {
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid #CBD5E1;
      background: #F8FAFC;
      font-weight: 800;
      font-size: 0.82rem;
      cursor: pointer;
    }
    .dodont-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 18px;
    }
    .tip-box-do { background: #F0FDF4; border: 1.5px solid #86EFAC; border-radius: 16px; padding: 16px; }
    .tip-box-dont { background: #FEF2F2; border: 1.5px solid #FECACA; border-radius: 16px; padding: 16px; }

    /* LOADER */
    #dongin-loader-overlay {
      position: fixed;
      inset: 0;
      z-index: 120;
      background: linear-gradient(135deg, #9BB2F8 0%, #DCE4FD 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: opacity 0.45s ease, visibility 0.45s ease;
    }
    #dongin-loader-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .loader-ring {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.45);
      border-top-color: #0B6BCB;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 980px) {
      .vibrant-left-hairline { display: none; }
      .vibrant-top-bar { left: 14px; right: 14px; top: 12px; flex-wrap: wrap; gap: 8px; }
      .vtb-right .hide-mobile { display: none; }
      .vibrant-menu-dock, .vibrant-menu-dock.expanded-cascade {
        left: 12px;
        right: 12px;
        bottom: 12px;
        width: auto;
        max-height: 44vh;
        padding: 16px 14px;
      }
      .vibrant-bottom-left-hud { bottom: auto; top: 64px; left: 14px; }
      .dodont-2col { grid-template-columns: 1fr; }
    }
  </style>

<body>

  <div class="vibrant-fullscreen-app" id="vibrant-3d-stage">
    <div class="vibrant-left-hairline"></div>

    <!-- LOADER -->
    <div id="dongin-loader-overlay">
      <div class="loader-ring"></div>
      <div style="font-size:0.88rem;font-weight:800;color:#1E3A8A;">3D 인체 장기 · 척추 · 신경 그래픽모션 로딩 중...</div>
    </div>

    <!-- TOP BAR: BRAND (LEFT) | GENDER PILL (CENTER — Vibrant Style!) | PORTAL LINKS (RIGHT) -->
    <header class="vibrant-top-bar">
      <div class="vtb-left">
        <a href="story-3d.html" class="vtb-brand-link">
          <span class="brand-nodes-svg">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="7" cy="6" r="2.6"/><circle cx="17" cy="6" r="2.6"/><circle cx="12" cy="12" r="2.8"/><circle cx="9" cy="18.5" r="2.3"/><circle cx="15" cy="18.5" r="2.3"/></svg>
          </span>
          <span>바른한의원 · 3D BODY EXPLORER</span>
        </a>

e":"밤에도 꺼지지 않는 뇌 각성과 상열감을 검사합니다","desc":"적외선 체열진단기(DITI)로 가슴과 머리에 몰린 열독을 확인하고 수면-각성 리듬이 무너진 원인을 진단합니다."}]},{"tabTitle":"둘째 · 원장 직접 시술","badge":"STEP 2 · 안정위 원장 직접 시술 & 물리치료","heading":"상부 경추·두개천골 추나 & 자율신경 한약으로 맑은 머리와 숙면을 회복합니다","summary":"과열된 교감신경은 식히고 미주신경·뇌혈류 탄력을 높여 두통·어지럼·불면·실신을 근본부터 회복합니다.","cards":[{"tag":"직접 처방 · 자율신경 조율 & 두풍·현훈·안신 맞춤 한약","title":"심박변이도(HRV)와 뇌·전정 혈류 탄력을 회복합니다","desc":"원내 직영 압력 탕전 한약으로 뇌혈류를 맑게 열고 심열(心熱)을 내려 두통·어지럼증 완화와 자연 숙면에 도움드립니다."},{"tag":"직접 시술 · 안정위 원장 상부 경추(C1-C2) & 흉곽 추나요법","title":"추골동맥과 미주신경 통로의 구조적 압박을 해소합니다","desc":"대표원장이 직접 후두골과 상부 경추, 흉추 자율신경절을 정밀 교정해 신경 전달 오류와 경추성 두통·어지럼을 회복합니다."},{"tag":"물리·이학 치료 · 자기장·소노(초음파)·ICT·IR·핫팩 케어","title":"후두하근 긴장 이완과 말초 혈관 순환을 회복합니다","desc":"심부 자기장, 소노(초음파), ICT, IR, 온열 핫팩 치료로 경직된 두경부 근막을 풀고 하체 정맥 환류를 강화해 도움드립니다."}]},{"tabTitle":"셋째 · 실전 대처·홈케어","badge":"STEP 3 · 실전 대처 가이드","heading":"두통·어지럼·실신 전조 증상 시 뇌혈류를 지키는 수칙","summary":"눈앞이 아찔하거나 어지러울 때 즉시 실천하면 실신 부상을 막고 빠르게 안정을 회복합니다.","cards":[{"tag":"응급 대처 · 즉시 쪼그려 앉기 & 다리 꼬아 힘주기(Leg Crossing)","title":"아찔한 전조 증상 시 참지 말고 자세를 낮추세요","desc":"식은땀·이명·현기증이 오면 즉시 앉거나 양다리를 교차해 허벅지·엉덩이에 힘을 주어 뇌혈류 유지에 도움드립니다."},{"tag":"두통·어지럼 케어 · 뒷목 온찜질 & 급격한 고개 회전 피하기","title":"상부 경추 보온으로 뇌·내이 혈류를 부드럽게 유지합니다","desc":"뒷목(풍지혈)을 따뜻하게 찜질하고 기상 시 천천히 일어나 기립성 어지럼증과 이석 자극을 예방하도록 도움드립니다."},{"tag":"수면 케어 · 취침 전 4-7-8 복식호흡 & 미온수 족욕","title":"부교감신경 스위치를 켜서 깊은 서파수면을 회복합니다","desc":"취침 1시간 전 스마트폰을 끄고 따뜻한 족욕과 복식호흡으로 머리의 열을 내려 숙면에 도움드립니다."}]},{"tabTitle":"넷째 · 추천 식단 · 루틴","badge":"STEP 4 · 식단 & 생활습관","heading":"뇌신경·혈관을 지키는 식단과 종아리 펌프 루틴","summary":"편두통 유발 식품과 탈수를 피하고 제2의 심장인 종아리 근육 운동으로 뇌혈류를 회복합니다.","cards":[{"tag":"추천 식단 · 뇌혈류 & 자율신경 안정 영양","title":"충분한 미온수 · 천마·국화·대추차 · 푸른잎채소·연어","desc":"마그네슘과 철분, 따뜻한 미온수를 충분히 섭취해 혈장 볼륨과 신경 안정 유지에 도움드립니다."},{"tag":"주의 요인 · 두통·어지럼·실신 유발 방아쇠 차단","title":"아침 공복 · 과도한 카페인·알코올 · 장시간 기립 주의","desc":"공복 저혈당과 카페인 과다 섭취는 뇌혈관 수축·확장 변동을 키워 편두통과 실신을 악화시킵니다."},{"tag":"매일 루틴 · 종아리 펌프(까치발 들기) 운동 50회","title":"하체 혈액을 심장과 뇌로 힘차게 올려보냅니다","desc":"매일 규칙적인 까치발 들기(Calf Raise) 운동으로 정맥 환     function createVibrantIridescentBodyMaterial() {
      return new THREE.ShaderMaterial({
        uniforms: {
          uHighlightCol:  { value: new THREE.Color('#F8FAFF') },
          uMidCol:        { value: new THREE.Color('#AEBEFA') },
          uDeepCol:       { value: new THREE.Color('#8396EB') },
          uRimCol:        { value: new THREE.Color('#5E72DB') },
          uIridescentCol: { value: new THREE.Color('#9BF6FF') },
          uAccentCol:     { value: new THREE.Color('#4F6EF7') },
          uXrayMix:       { value: 0.0 },
          uScanY:         { value: -2.0 },
          uFocusCenter:   { value: new THREE.Vector3(0.0, 3.2, 0.0) },
          uFocusRadius:   { value: 0.65 },
          uTime:          { value: 0.0 }
        },
        vertexShader: [
          'varying vec3 vNormal;',
          'varying vec3 vViewDir;',
          'varying vec3 vWorldPos;',
          'void main() {',
          '  vec4 worldPos = modelMatrix * vec4(position, 1.0);',
          '  vWorldPos = worldPos.xyz;',
          '  vec4 mvPos = viewMatrix * worldPos;',
          '  vViewDir = normalize(-mvPos.xyz);',
          '  vNormal = normalize(normalMatrix * normal);',
          '  gl_Position = projectionMatrix * mvPos;',
          '}'
        ].join(' '),
        fragmentShader: [
          'uniform vec3 uHighlightCol;',
          'uniform vec3 uMidCol;',
          'uniform vec3 uDeepCol;',
          'uniform vec3 uRimCol;',
          'uniform vec3 uIridescentCol;',
          'uniform vec3 uAccentCol;',
          'uniform float uXrayMix;',
          'uniform float uScanY;',
          'uniform vec3 uFocusCenter;',
          'uniform float uFocusRadius;',
          'uniform float uTime;',
          'varying vec3 vNormal;',
          'varying vec3 vViewDir;',
          'varying vec3 vWorldPos;',
          'void main() {',
          '  vec3 N = normalize(vNormal);',
          '  vec3 V = normalize(vViewDir);',
          '  vec3 L1 = normalize(vec3(0.28, 0.68, 0.86));',
          '  vec3 L2 = normalize(vec3(-0.62, 0.35, 0.48));',
          '  float NdotL1 = clamp(dot(N, L1) * 0.5 + 0.5, 0.0, 1.0);',
          '  float NdotL2 = clamp(dot(N, L2), 0.0, 1.0);',
          '  float NdotV = clamp(abs(dot(N, V)), 0.0, 1.0);',
          '  float fresnel = pow(1.0 - NdotV, 2.1);',
          '  vec3 H1 = normalize(L1 + V);',
          '  float spec = pow(max(0.0, dot(N, H1)), 26.0);',
          '  float iridMask = pow(max(0.0, dot(N, normalize(vec3(-0.45, 0.55, 0.70)))), 8.0) * (1.0 - NdotV * 0.55);',
          '  vec3 pearlCol = mix(uDeepCol, uMidCol, smoothstep(0.22, 0.68, NdotL1));',
          '  pearlCol = mix(pearlCol, uHighlightCol, smoothstep(0.66, 0.96, NdotL1) * 0.88 + spec * 0.55);',
          '  pearlCol = mix(pearlCol, uIridescentCol, clamp(iridMask * 0.52 + NdotL2 * 0.16, 0.0, 0.55));',
          '  pearlCol = mix(pearlCol, uRimCol, smoothstep(0.52, 0.94, fresnel) * 0.68);',
          '  float distFocus = length(vWorldPos - uFocusCenter);',
          '  float focusWindow = 1.0 - smoothstep(uFocusRadius * 0.45, uFocusRadius * 1.45, distFocus);',
          '  vec3 xrayCol = mix(pearlCol, uAccentCol, 0.32 + fresnel * 0.42);',
          '  vec3 finalCol = mix(pearlCol, xrayCol, uXrayMix);',
          '  float scanBand = exp(-pow((vWorldPos.y - uScanY) * 9.5, 2.0));',
          '  finalCol = mix(finalCol, mix(vec3(1.0), uIridescentCol, 0.35), clamp(scanBand * 0.92, 0.0, 1.0));',
          '  finalCol += uAccentCol * (focusWindow * uXrayMix * 0.18 * (0.65 + 0.35 * sin(uTime * 3.2)));',
          '  float idleAlpha = mix(0.88, 0.98, fresnel);',
          '  float xrayAlpha = mix(0.14, 0.74, fresnel) * (1.0 - focusWindow * 0.28);',
          '  float alpha = mix(idleAlpha, xrayAlpha, uXrayMix);',
          '  alpha = clamp(alpha + scanBand * 0.35, 0.10, 0.99);',
          '  gl_FragColor = vec4(finalCol, alpha);',
          '}'
        ].join(' '),
        transparent: true,
        depthWrite: false,
        side: THREE.FrontSide
      });
    }

    // 2.2 Smooth Lifelike Cel-Shaded Clay Shader for Internal Organs & Bones (Preserved 100%)
    function createToonClayMaterial(hiHex, midHex, shdHex, outHex, initialOpacity = 0.96, smoothFactor = 0.72) {
      return new THREE.ShaderMaterial({
        uniforms: {
          uHigh:    { value: new THREE.Color(hiHex) },
          uMid:     { value: new THREE.Color(midHex) },
          uShadow:  { value: new THREE.Color(shdHex) },
          uOutline: { value: new THREE.Color(outHex) },
          uOpacity: { value: initialOpacity },
          uCenter:  { value: new THREE.Vector3(0, 0, 0) },
          uSmooth:  { value: smoothFactor },
          uGlow:    { value: 0.0 }
        },
        vertexShader: [
          'uniform vec3 uCenter;',
          'varying vec3 vNormal;',
          'varying vec3 vRadial;',
          'varying vec3 vViewDir;',
          'void main() {',
          '  vec4 mvPos = modelViewMatrix * vec4(position, 1.0);',
          '  vViewDir = normalize(-mvPos.xyz);',
          '  vNormal = normalize(normalMatrix * normal);',
          '  vec3 radLocal = position - uCenter;',
          '  float rLen = length(radLocal);',
          '  vRadial = rLen > 0.0001 ? normalize(normalMatrix * (radLocal / rLen)) : vNormal;',
          '  gl_Position = projectionMatrix * mvPos;',
          '}'
        ].join(' '),
        fragmentShader: [
          'uniform vec3 uHigh;',
          'uniform vec3 uMid;',
          'uniform vec3 uShadow;',
          'uniform vec3 uOutline;',
          'uniform float uOpacity;',
          'uniform float uSmooth;',
          'uniform float uGlow;',
          'varying vec3 vNormal;',
          'varying vec3 vRadial;',
          'varying vec3 vViewDir;',
          'void main() {',
          '  if (uOpacity <= 0.01) discard;',
          '  vec3 N = normalize(mix(normalize(vNormal), normalize(vRadial), uSmooth));',
          '  vec3 V = normalize(vViewDir);',
          '  vec3 L = normalize(vec3(0.38, 0.72, 0.68));',
          '  float nl = dot(N, L) * 0.5 + 0.5;',
          '  float nv = clamp(abs(dot(N, V)), 0.0, 1.0);',
          '  float band1 = smoothstep(0.35, 0.42, nl);',
          '  float band2 = smoothstep(0.65, 0.72, nl);',
          '  vec3 col = mix(uShadow, uMid, band1);',
          '  col = mix(col, uHigh, band2);',
          '  vec3 H = normalize(L + V);',
          '  float spec = smoothstep(0.88, 0.95, max(0.0, dot(N, H)));',
          '  col = mix(col, vec3(0.99, 0.99, 1.0), spec * 0.48);',
          '  float ink = smoothstep(0.75, 0.88, 1.0 - nv);',
          '  col = mix(col, uOutline, ink * 0.62);',
          '  col += uHigh * (uGlow * (1.0 - nv) * 0.45);',
          '  gl_FragColor = vec4(col, uOpacity);',
          '}'
        ].join(' '),
        transparent: true,
        depthWrite: true
      });
    }

    function createVascularMaterial(highHex, midHex, shadowHex, outlineHex, opacity) {
      return new THREE.ShaderMaterial({
        uniforms: {
          uHigh:    { value: new THREE.Color(highHex) },
          uMid:     { value: new THREE.Color(midHex) },
          uShadow:  { value: new THREE.Color(shadowHex) },
          uOutline: { value: new THREE.Color(outlineHex) },
          uOpacity: { value: opacity }
        },
        vertexShader: [
          'varying vec3 vNormal;',
          'varying vec3 vViewDir;',
          'varying vec3 vLocalPos;',
          'void main() {',
          '  vLocalPos = position;',
          '  vec4 mvPos = modelViewMatrix * vec4(position, 1.0);',
          '  vViewDir = normalize(-mvPos.xyz);',
          '  vNormal = normalize(normalMatrix * normal);',
          '  gl_Position = projectionMatrix * mvPos;',
          '}'
        ].join(' '),
        fragmentShader: [
          'uniform vec3 uHigh;',
          'uniform vec3 uMid;',
          'uniform vec3 uShadow;',
          'uniform vec3 uOutline;',
          'uniform float uOpacity;',
          'varying vec3 vNormal;',
          'varying vec3 vViewDir;',
          'varying vec3 vLocalPos;',
          'void main() {',
          '  if (vLocalPos.y > 1.92 && vLocalPos.y < 2.38 && abs(vLocalPos.x) < 0.092) discard;',
          '  vec3 N = normalize(vNormal);',
          '  vec3 V = normalize(vViewDir);',
          '  vec3 L = normalize(vec3(0.38, 0.72, 0.68));',
          '  float nl = dot(N, L) * 0.5 + 0.5;',
          '  float nv = clamp(abs(dot(N, V)), 0.0, 1.0);',
          '  vec3 col = mix(uShadow, uMid, smoothstep(0.35, 0.44, nl));',
          '  col = mix(col, uHigh, smoothstep(0.65, 0.74, nl));',
          '  col = mix(col, uOutline, smoothstep(0.74, 0.86, 1.0 - nv) * 0.65);',
          '  gl_FragColor = vec4(col, uOpacity);',
          '}'
        ].join(' '),
        transparent: true,
        depthWrite: true
      });
    }

        lumbar:     ['LumbarSpine', 'Pelvis'],
        gongjindan: ['CervicalSpine'],
        syncope:    [],
        digest:     ['LumbarSpine'],
        gut:        ['LumbarSpine'],
        uterus:     ['Pelvis', 'LumbarSpine'],
        prostate:   ['Pelvis', 'LumbarSpine']
      };
      const activeBones = active ? (boneHighlightMap[currentPartId] || []) : [];

      Object.keys(boneIllustrationMap).forEach(gName => {
        const entry = boneIllustrationMap[gName];
        if (!active) {
          entry.mesh.visible = false;
          entry.mat.uniforms.uOpacity.value = 0.0;
          return;
        }
        const isMatched = activeBones.some(b => gName.includes(b)) || (currentPartId === 'knee' && entry.isGP);
        entry.mesh.visible = true;
        entry.mat.uniforms.uOpacity.value = isMatched ? 0.96 : 0.16;
        entry.mat.uniforms.uGlow.value = isMatched ? 1.0 : 0.0;
        entry.mat.depthWrite = isMatched;
      });

      if (spinalDiscs3D && spinalDiscs3D.group) {
        const showDiscs = active && ['lumbar', 'cervical', 'uterus', 'prostate'].includes(currentPartId);
        spinalDiscs3D.group.visible = showDiscs;
        const discAlpha = (currentPartId === 'lumbar' || currentPartId === 'cervical') ? 0.98 : 0.72;
        spinalDiscs3D.mats.forEach(m => {
          m.uniforms.uOpacity.value = showDiscs ? discAlpha : 0.0;
          m.uniforms.uGlow.value = (currentPartId === 'lumbar' || currentPartId === 'cervical') ? 1.0 : 0.2;
        });
      }

      Object.keys(loadedOrgans).forEach(key => {
        const entry = loadedOrgans[key];
        if (!active) {
          entry.scene.visible = false;
          entry.mat.uniforms.uOpacity.value = 0.0;
          return;
        }
        const isTarget = entry.cfg.parts.includes(currentPartId);
        entry.scene.visible = isTarget;
        entry.mat.uniforms.uOpacity.value = isTarget ? 0.97 : 0.0;
        entry.mat.uniforms.uGlow.value = isTarget ? 1.0 : 0.0;
        entry.mat.depthWrite = isTarget;
      });
    }


    // CORE INTERACTION: CLICK CLINIC MENU -> 3D GRAPHIC MOTION -> CASCADING RELATED MENUS!
    window.activateClinicMotion = function(partId) {
      const cfg = CLINIC_MENUS.find(m => m.id === partId) || CLINIC_MENUS[0];
      currentPartId = cfg.id;

      // Auto-switch gender model for female/male reproductive anatomy
      if (cfg.id === 'uterus') {
        window.setDonginGender('female');
      } else if (cfg.id === 'prostate') {
        window.setDonginGender('male');
      }

      // Highlight active 3D hotspot & softly dim others
      majorHotspotNodes.forEach(h => {
        h.dom.classList.toggle('active', h.id === cfg.id);
        h.dom.classList.toggle('dimmed', h.id !== cfg.id);
      });

      // 1) Trigger 3D Bio-Scan + X-Ray Organ Reveal + Orbital Gyro-Rings + Pathway Particles
      window.trigger3DGraphicMotion(cfg.id, cfg.preset, cfg.accent);

      // 2) Sequentially Activate Related 3D Sub-Focus Pills & Cascaded Right-Side Related Menus!
      window.spawnSubHotspots3D(cfg.subFocus3D || []);
      renderCascadedRelatedMenu(cfg);
    };

    window.clickDockSubChip = function(idx) {
      const cfg = CLINIC_MENUS.find(m => m.id === currentPartId);
      if (!cfg || !cfg.subFocus3D || !cfg.subFocus3D[idx]) return;
      const pills = document.querySelectorAll('.sub-focus-3d-pill');
      pills.forEach((el, i) => el.classList.toggle('active', i === idx));
      window.focusSubPoint3D(cfg.subFocus3D[idx]);
    };

    // Backward-compatible alias
    window.selectBodyPart = function(partId) {
      window.activateClinicMotion(partId);
    };


    window.setDonginGender = function(gender) {
      currentGender = (gender === 'male') ? 'male' : 'female';
      document.getElementById('btn-gender-female')?.classList.toggle('active', currentGender === 'female');
      document.getElementById('btn-gender-male')?.classList.toggle('active', currentGender === 'male');
      if (femaleBodyObj) femaleBodyObj.visible = (currentGender === 'female');
      if (maleBodyObj) maleBodyObj.visible = (currentGender === 'male');
    };

    window.trigger3DGraphicMotion = function(partId, preset, accentHex) {
      isOverviewMode = false;
      targetXrayMix = 1.0;
      scanWaveActive = true;
      scanWaveY = 4.72;

      const accentColor = new THREE.Color(accentHex || '#4F6EF7');
      allSkinMats.forEach(m => {
        m.uniforms.uAccentCol.value.copy(accentColor);
        m.uniforms.uFocusCenter.value.set(...preset.pos3D);
        m.uniforms.uFocusRadius.value = preset.focusRadius || 0.62;
      });

      ringMatOuter.color.copy(accentColor);
      haloDiscMat.color.copy(accentColor);
      photonMat.color.copy(accentColor).lerp(new THREE.Color('#FFFFFF'), 0.35);

      rigTargetPos.set(...preset.pos3D);
      rigTargetScale = preset.ringScale || 1.0;
      motionRigGroup.visible = true;

      activeMotionCurve = ANATOMY_MOTION_CURVES[partId] || null;
      pathwayParticles.visible = Boolean(activeMotionCurve);

      camGoalPos.set(...preset.camPos);
      camGoalTarget.set(...preset.camTarget);
      isCameraFlying = true;

      updateAnatomyHighlight();
    };

    window.focusSubPoint3D = function(sp) {
      if (!sp) return;
      rigTargetPos.set(...sp.pos3D);
      rigTargetScale = sp.ringScale || 0.72;
      allSkinMats.forEach(m => {
        m.uniforms.uFocusCenter.value.set(...sp.pos3D);
      });
      if (sp.camPos && sp.camTarget) {
        camGoalPos.set(...sp.camPos);
        camGoalTarget.set(...sp.camTarget);
        isCameraFlying = true;
      }
      if (sp.note && typeof window.updateSubFocusNote === 'function') {
        window.updateSubFocusNote(sp.label, sp.note);
      }
    };

    window.resetToVibrantOverview = function(fullBody = false) {
      isOverviewMode = true;
      currentPartId = null;
      targetXrayMix = 0.0;
      scanWaveActive = true;
      scanWaveY = 4.72;
      rigTargetScale = 0.001;
      activeMotionCurve = null;
      pathwayParticles.visible = false;

      if (subHotspotLayer) subHotspotLayer.innerHTML = '';
      activeSubHotspotNodes = [];

      majorHotspotNodes.forEach(h => {
        h.dom.classList.remove('active', 'dimmed');
      });

      camGoalPos.copy(fullBody ? FULLBODY_OVERVIEW_POS : HERO_OVERVIEW_POS);
      camGoalTarget.copy(fullBody ? FULLBODY_OVERVIEW_TARGET : HERO_OVERVIEW_TARGET);
      isCameraFlying = true;

      updateAnatomyHighlight();
      if (typeof window.onResetMenuDock === 'function') {
        window.onResetMenuDock();
      }
    };

    function resizeRenderer() {
      const w = Math.max(320, window.innerWidth);
      const h = Math.max(320, window.innerHeight);
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      // Frame the 3D body gracefully at ~33% from left on wide desktop so the right-side Clinic Menu Dock has clear breathing space!
      if (w > 980) {
        camera.setViewOffset(w, h, Math.round(w * 0.165), 0, w, h);
      } else {
        camera.clearViewOffset();
      }
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resizeRenderer);
    resizeRenderer();

    // ========================================================================
    // 5. 60FPS CINEMATIC RENDER & 3D GRAPHIC MOTION LOOP
    // ========================================================================
    const projVec = new THREE.Vector3();
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      const elapsed = clock.elapsedTime;

      // 1) Smooth Camera Fly-To
      if (isCameraFlying) {
        camera.position.lerp(camGoalPos, 0.075);
        controls.target.lerp(camGoalTarget, 0.085);
        if (camera.position.distanceTo(camGoalPos) < 0.012 && controls.target.distanceTo(camGoalTarget) < 0.012) {
          isCameraFlying = false;
        }
      } else if (isOverviewMode) {
        // Subtle living breathing sway in Vibrant idle overview
        camera.position.x = Math.sin(elapsed * 0.45) * 0.06;
      }
      controls.update();

      // 2) Update Iridescent / X-Ray Skin Uniforms & 3D Bio-Scan Wave
      currentXrayMix += (targetXrayMix - currentXrayMix) * 0.08;
      if (scanWaveActive) {
        scanWaveY -= dt * 3.4;
        if (scanWaveY < 0.1) {
          scanWaveActive = false;
          scanWaveY = -2.0;
        }
      }
      allSkinMats.forEach(m => {
        m.uniforms.uXrayMix.value = currentXrayMix;
        m.uniforms.uScanY.value = scanWaveY;
        m.uniforms.uTime.value = elapsed;
      });

      // 3) Animate Ambient Bokeh Motes
      const bArr = bokehGeo.attributes.position.array;
      for (let i = 0; i < BOKEH_COUNT; i++) {
        const phase = bokehSeeds[i * 3 + 0];
        const spd = bokehSeeds[i * 3 + 1];
        const baseY = bokehSeeds[i * 3 + 2];
        bArr[i * 3 + 1] = baseY + Math.sin(elapsed * spd + phase) * 0.14;
      }
      bokehGeo.attributes.position.needsUpdate = true;

      // 4) Animate 3D Orbital Gyro-Rings & Target Organ Pulse
      if (motionRigGroup.visible) {
        motionRigGroup.position.lerp(rigTargetPos, 0.10);
        const curS = motionRigGroup.scale.x;
        const nextS = curS + (rigTargetScale - curS) * 0.10;
        motionRigGroup.scale.setScalar(Math.max(0.001, nextS));
        gyroOuter.rotation.z = elapsed * 0.85;
        gyroOuter.rotation.y = Math.sin(elapsed * 0.6) * 0.35;
        gyroInner.rotation.z = -elapsed * 1.25;
        gyroInner.rotation.x = -Math.PI * 0.34 + Math.cos(elapsed * 0.8) * 0.22;
        gyroEquatorial.scale.setScalar(0.94 + Math.sin(elapsed * 2.8) * 0.06);
        if (rigTargetScale < 0.01 && nextS < 0.015) {
          motionRigGroup.visible = false;
        }
      }

      // Subtle physiological pulse on active internal organ
      if (!isOverviewMode && currentPartId) {
        const pulse = 1.0 + Math.sin(elapsed * 3.1) * 0.022;
        if (currentPartId === 'uterus') uterus3D.group.scale.setScalar(pulse);
        if (currentPartId === 'prostate') prostate3D.group.scale.setScalar(pulse);
        if (loadedOrgans.heart && loadedOrgans.heart.scene.visible) {
          loadedOrgans.heart.scene.scale.copy(loadedOrgans.heart.baseScale).multiplyScalar(pulse);
        }
      }

      // 5) Animate 3D Bio-Signal Pathway Photons
      if (pathwayParticles.visible && activeMotionCurve) {
        const pArr = photonGeo.attributes.position.array;
        const pt = projVec;
        for (let i = 0; i < PATH_PHOTON_COUNT; i++) {
          const t = (photonOffsets[i] + elapsed * 0.26) % 1.0;
          activeMotionCurve.getPointAt(t, pt);
          const spread = Math.sin(i * 12.7 + elapsed * 2.0) * 0.008;
          pArr[i * 3 + 0] = pt.x + spread;
          pArr[i * 3 + 1] = pt.y;
          pArr[i * 3 + 2] = pt.z + spread;
        }
        photonGeo.attributes.position.needsUpdate = true;
      }

      // 6) Project 3D Hotspots & Sub-Focus Callouts to Full-Screen Viewport
      // Note: camera.projectionMatrix already includes setViewOffset!
      const w = window.innerWidth;
      const h = window.innerHeight;

      majorHotspotNodes.forEach(item => {
        // Hide gender-specific reproductive dot when opposite gender is selected in idle overview
        if (isOverviewMode) {
          if (item.id === 'uterus' && currentGender === 'male') { item.dom.style.opacity = '0'; item.dom.style.pointerEvents = 'none'; return; }
          if (item.id === 'prostate' && currentGender === 'female') { item.dom.style.opacity = '0'; item.dom.style.pointerEvents = 'none'; return; }
        }
        projVec.copy(item.worldPos).project(camera);
        if (projVec.z > 1.0) {
          item.dom.style.opacity = '0';
          item.dom.style.pointerEvents = 'none';
          return;
        }
        const sx = (projVec.x * 0.5 + 0.5) * w;
        const sy = (-projVec.y * 0.5 + 0.5) * h;
        item.dom.style.left = sx.toFixed(1) + 'px';
        item.dom.style.top = sy.toFixed(1) + 'px';
        const inBounds = (sx > 24 && sx < w - 24 && sy > 52 && sy < h - 28);
        item.dom.style.opacity = inBounds ? '' : '0';
        item.dom.style.pointerEvents = inBounds ? 'auto' : 'none';
      });

      activeSubHotspotNodes.forEach(sub => {
        projVec.copy(sub.worldPos).project(camera);
        if (projVec.z > 1.0) {
          sub.dom.style.opacity = '0';
          return;
        }
        const sx = (projVec.x * 0.5 + 0.5) * w;
        const sy = (-projVec.y * 0.5 + 0.5) * h;
        sub.dom.style.left = sx.toFixed(1) + 'px';
        sub.dom.style.top = sy.toFixed(1) + 'px';
      });

      renderer.render(scene, camera);
    }


    const urlPart = earlyParams.get('part');
    if (urlPart && CLINIC_MENUS.some(m => m.id === urlPart)) {
      window.activateClinicMotion(urlPart);
    } else {
      window.resetToVibrantOverview(false);
    }
    animate();
  })();
  </script>
</body>
