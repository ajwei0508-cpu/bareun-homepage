<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>바른한의원 대전본점 | 3D 인체모형 · 바른한의원 진료 살펴보기</title>

  <link rel="canonical" href="https://www.bareunhaniwon.com/body-explorer/" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700;800&family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "MedicalWebPage",
    "name": "3D 인체모형 · 바른한의원 진료 살펴보기 건강 정보 패널",
    "url": "https://www.bareunhaniwon.com/body-explorer/",
    "inLanguage": "ko-KR",
    "description": "부위별 순수 건강 정보와 Q&A 공간입니다."
  }
  </script>
  <style>
    :root {
      --lux-white: #FFFFFF;
      --lux-white-glass: rgba(255, 255, 255, 0.95);
      --lux-ivory: #FCFBF8;
      --lux-gold-tint: #FAF5EA;
      --lux-black: #0D0D0F;
      --lux-charcoal: #1A1A1E;
      --lux-ink: #141416;
      --lux-sub: #57534E;
      --lux-gold: #C5A059;
      --lux-gold-bright: #E5C67E;
      --lux-gold-deep: #967128;
      --lux-gold-border: #DFC99B;
      --lux-border-soft: #EAE3D5;
      --lux-shadow: 0 22px 50px rgba(13, 13, 15, 0.16);
      --lux-shadow-sm: 0 8px 22px rgba(13, 13, 15, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100% !important;
      height: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
      background: #F5EFE2;
      color: var(--lux-ink);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* 1. FULLSCREEN 3D HUMAN BODY MODEL STAGE (100vw × 100vh) */
    .vibrant-workspace {
      position: fixed;
      inset: 0;
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden;
      z-index: 1;
    }
    .vibrant-3d-stage {
      position: fixed;
      inset: 0;
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      min-width: 100vw !important;
      min-height: 100vh !important;
      margin: 0 !important;
      padding: 0 !important;
      background: radial-gradient(circle at 50% 44%, #FFFEFA 0%, #F5EFE2 66%, #E8DEC9 100%);
      overflow: hidden;
      user-select: none;
      z-index: 1;
    }
    #vibrant-body-canvas {
      position: absolute;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
      display: block;
      z-index: 2;
      cursor: grab;
    }
    #vibrant-body-canvas:active { cursor: grabbing; }

    /* 2. FLOATING MINIMAL TOP HEADER (WHITE · BLACK · GOLD) */
    .vibrant-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 220;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      pointer-events: none;
      background: transparent;
      border: none;
      box-shadow: none;
    }
    .vh-brand {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 5px 15px 5px 6px;
      border-radius: 999px;
      background: var(--lux-white-glass);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--lux-gold-border);
      box-shadow: var(--lux-shadow-sm);
      text-decoration: none;
      color: var(--lux-black);
      transition: all 0.18s ease;
    }
    .vh-brand:hover {
      border-color: var(--lux-gold);
      background: var(--lux-white);
    }
    .vh-brand-mark {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--lux-black);
      border: 1px solid var(--lux-gold);
      color: var(--lux-gold-bright);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.71rem;
      letter-spacing: -0.02em;
    }
    .vh-brand-title {
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--lux-black);
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .vh-right-actions {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .vh-pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 13px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 800;
      text-decoration: none;
      border: 1px solid var(--lux-gold-border);
      background: var(--lux-white-glass);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: var(--lux-black);
      cursor: pointer;
      transition: all 0.18s ease;
      white-space: nowrap;
      font-family: 'Pretendard', sans-serif;
      box-shadow: var(--lux-shadow-sm);
    }
    .vh-pill-btn:hover {
      background: var(--lux-black);
      border-color: var(--lux-gold);
      color: var(--lux-gold-bright);
    }

    /* Override visit-tracker.js pill inside header to White · Black · Gold */
    html body header.vibrant-header .bareun-visit-pill-btn {
      background: var(--lux-black) !important;
      color: var(--lux-white) !important;
      border: 1px solid var(--lux-gold) !important;
      box-shadow: var(--lux-shadow-sm) !important;
      padding: 6px 13px !important;
      font-size: 0.74rem !important;
    }
    html body header.vibrant-header .bareun-visit-pill-btn:hover {
      background: var(--lux-charcoal) !important;
      border-color: var(--lux-gold-bright) !important;
    }
    html body header.vibrant-header .bareun-visit-pill-btn .bareun-visit-live-dot,
    html body header.vibrant-header .bareun-visit-pill-btn .bareun-visit-pill-dot {
      background: var(--lux-gold-bright) !important;
      box-shadow: 0 0 8px rgba(229, 198, 126, 0.65) !important;
    }
    html body header.vibrant-header .bareun-visit-pill-btn .bareun-visit-pill-label,
    html body header.vibrant-header .bareun-visit-pill-btn .bareun-visit-pill-sep {
      color: rgba(255, 255, 255, 0.88) !important;
    }
    html body header.vibrant-header .bareun-visit-pill-btn .bareun-visit-pill-num {
      color: var(--lux-gold-bright) !important;
    }

    /* 3. COMPACT RIGHT-SIDE VERTICAL MENU STACK (우측 소형 나열 · WHITE · BLACK · GOLD) */
    .right-compact-menu {
      position: fixed;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 215;
      width: 178px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 7px;
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.93);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--lux-gold-border);
      box-shadow: 0 14px 36px rgba(13, 13, 15, 0.11);
    }
    .rcm-head {
      background: var(--lux-black);
      color: var(--lux-white);
      border: 1px solid rgba(197, 160, 89, 0.55);
      border-radius: 10px;
      padding: 8px 10px;
      margin-bottom: 2px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .rcm-head-title {
      font-size: 0.73rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--lux-white);
      line-height: 1.25;
    }
    .rcm-head-sub {
      font-size: 0.63rem;
      font-weight: 700;
      color: var(--lux-gold-bright);
      letter-spacing: -0.01em;
    }

    .vh-part-chip {
      appearance: none;
      width: 100%;
      border: 1px solid var(--lux-border-soft);
      background: var(--lux-white);
      color: var(--lux-ink);
      font-family: 'Pretendard', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 7px 9px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      text-align: left;
      transition: all 0.16s ease;
      line-height: 1.2;
    }
    .vh-part-chip .rcm-num {
      font-size: 0.65rem;
      font-weight: 800;
      color: var(--lux-gold-deep);
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }
    .vh-part-chip .rcm-label {
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: -0.02em;
    }
    .vh-part-chip .rcm-arrow {
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--lux-gold);
      flex-shrink: 0;
      line-height: 1;
    }
    .vh-part-chip:hover {
      background: var(--lux-gold-tint);
      border-color: var(--lux-gold);
      color: var(--lux-black);
      transform: translateX(-2px);
    }
    .vh-part-chip.active {
      background: var(--lux-black);
      border: 1px solid var(--lux-gold);
      color: var(--lux-white);
      box-shadow: 0 7px 18px rgba(13, 13, 15, 0.24);
      transform: translateX(-3px);
    }
    .vh-part-chip.active .rcm-num,
    .vh-part-chip.active .rcm-arrow {
      color: var(--lux-gold-bright);
    }

    /* 4. TOP STATUS & BOTTOM 3D CONTROLS (WHITE · BLACK · GOLD) */
    .stage-top-badge {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 205;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 15px;
      border-radius: 999px;
      background: var(--lux-white-glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--lux-gold-border);
      box-shadow: var(--lux-shadow-sm);
      pointer-events: none;
      transition: left 0.28s ease;
    }
    .stage-top-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--lux-gold);
    }
    .stage-top-text {
      font-size: 0.74rem;
      font-weight: 800;
      color: var(--lux-black);
      white-space: nowrap;
      letter-spacing: -0.01em;
    }

    .stage-bottom-bar {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 205;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 4px 6px;
      border-radius: 999px;
      background: var(--lux-white-glass);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--lux-gold-border);
      box-shadow: var(--lux-shadow-sm);
      transition: left 0.28s ease;
    }
    @media (min-width: 961px) {
      body.popup-open-mode .stage-bottom-bar {
        left: 31%;
      }
      body.popup-open-mode .stage-top-badge {
        left: 31%;
      }
    }
    .stage-ctrl-btn {
      appearance: none;
      border: 1px solid transparent;
      background: transparent;
      color: var(--lux-sub);
      font-family: 'Pretendard', sans-serif;
      font-size: 0.73rem;
      font-weight: 800;
      padding: 6px 13px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.18s ease;
      white-space: nowrap;
    }
    .stage-ctrl-btn:hover {
      color: var(--lux-black);
      background: var(--lux-gold-tint);
    }
    .stage-ctrl-btn.active {
      background: var(--lux-black);
      border-color: var(--lux-gold);
      color: var(--lux-gold-bright);
    }
    .stage-ctrl-btn.reset-btn {
      background: var(--lux-gold-tint);
      color: var(--lux-black);
      border: 1px solid var(--lux-gold-border);
    }
    .stage-ctrl-btn.reset-btn:hover {
      background: var(--lux-black);
      border-color: var(--lux-gold);
      color: var(--lux-gold-bright);
    }

    /* 5. 3D HOTSPOTS & LOADER (WHITE · BLACK · GOLD) */
    #hotspot-overlay-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 20;
      overflow: hidden;
    }
    .body-3d-hotspot {
      position: absolute;
      transform: translate(-50%, -50%);
      pointer-events: auto;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: opacity 0.22s ease, transform 0.22s ease;
    }
    .hotspot-pulse-ring {
      width: 19px;
      height: 19px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.96);
      border: 1.5px solid var(--lux-gold);
      box-shadow: 0 3px 10px rgba(13, 13, 15, 0.14);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5px;
      transition: all 0.2s ease;
    }
    .hotspot-core-dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--lux-black);
    }
    .body-3d-hotspot:hover .hotspot-pulse-ring {
      transform: scale(1.14);
      border-color: var(--lux-black);
    }
    .body-3d-hotspot.active .hotspot-pulse-ring {
      background: var(--lux-black);
      border-color: var(--lux-gold-bright);
      box-shadow: 0 0 0 5px rgba(197, 160, 89, 0.30), 0 4px 14px rgba(13, 13, 15, 0.34);
    }
    .body-3d-hotspot.active .hotspot-core-dot { background: var(--lux-gold-bright); }
    .hotspot-tag-pill { display: none; }

    #dongin-loader-overlay {
      position: absolute;
      inset: 0;
      z-index: 60;
      background: rgba(247, 242, 232, 0.90);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    #dongin-loader-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .loader-spinner {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2.5px solid var(--lux-gold-border);
      border-top-color: var(--lux-gold-deep);
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 6. FLOATING WHITE · BLACK · GOLD 3-MENU INFO POPUP PANEL */
    .explore-floating-popup {
      position: fixed;
      right: 208px;
      top: 62px;
      max-height: calc(100vh - 82px);
      max-height: calc(100dvh - 82px);
      width: min(505px, calc(100vw - 228px));
      z-index: 218;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--lux-gold) transparent;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateX(14px) scale(0.99);
      transition: opacity 0.22s ease, transform 0.22s ease, visibility 0.22s ease;
    }
    .explore-floating-popup.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateX(0) scale(1);
    }
    .explore-floating-popup::-webkit-scrollbar { width: 5px; }
    .explore-floating-popup::-webkit-scrollbar-thumb { background: var(--lux-gold); border-radius: 999px; }

    .popup-shell-wrap {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* THE 3 CORE MENUS TAB BAR (WHITE · BLACK · GOLD) */
    .three-menu-nav {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 5px;
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid var(--lux-gold);
      box-shadow: var(--lux-shadow-sm);
    }
    .three-menu-btn {
      appearance: none;
      border: 1px solid transparent;
      background: transparent;
      color: var(--lux-ink);
      font-family: 'Pretendard', sans-serif;
      padding: 8px 6px;
      border-radius: 9px;
      cursor: pointer;
      transition: all 0.16s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      text-align: center;
    }
    .three-menu-btn:hover {
      background: var(--lux-gold-tint);
    }
    .three-menu-btn.active {
      background: var(--lux-black);
      border-color: var(--lux-gold);
      color: var(--lux-white);
    }
    .tmb-step {
      font-size: 0.64rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      color: var(--lux-gold-deep);
    }
    .three-menu-btn.active .tmb-step {
      color: var(--lux-gold-bright);
    }
    .tmb-label {
      font-size: 0.82rem;
      font-weight: 800;
      word-break: keep-all;
      letter-spacing: -0.02em;
    }

    /* CLEAN OUTPUT BOX FOR MENU 1 & ARCHIVE READER (NO THEME STRIP · NO AUDIT FOOTER) */
    .health-info-popup-box {
      background: var(--lux-white);
      border: 1.5px solid var(--lux-gold);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--lux-shadow);
    }
    .hip-header {
      background: var(--lux-black);
      color: var(--lux-white);
      padding: 13px 16px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 2px solid var(--lux-gold);
    }
    .hip-header-title-wrap {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      min-width: 0;
    }
    .hip-part-bracket {
      display: inline-flex;
      align-items: center;
      padding: 3px 9px;
      border-radius: 6px;
      background: linear-gradient(135deg, #E7C983 0%, #C59E50 100%);
      color: var(--lux-black);
      font-size: 0.75rem;
      font-weight: 800;
      white-space: nowrap;
    }
    .hip-divider {
      color: rgba(229, 198, 126, 0.50);
      font-weight: 600;
      font-size: 0.82rem;
    }
    .hip-question-title {
      font-family: 'Noto Serif KR', serif;
      font-size: 1.02rem;
      font-weight: 800;
      color: var(--lux-white);
      line-height: 1.42;
      word-break: keep-all;
    }
    .hip-close-btn {
      appearance: none;
      border: 1px solid rgba(229, 198, 126, 0.65);
      background: rgba(255, 255, 255, 0.06);
      color: var(--lux-gold-bright);
      font-family: 'Pretendard', sans-serif;
      font-size: 0.74rem;
      font-weight: 800;
      padding: 5px 10px;
      border-radius: 7px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.16s ease;
    }
    .hip-close-btn:hover {
      background: var(--lux-gold);
      color: var(--lux-black);
      border-color: var(--lux-gold-bright);
    }

    .hip-sections {
      padding: 13px 15px 15px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      background: var(--lux-white);
    }
    .hip-sec-card {
      border-radius: 11px;
      padding: 10px 13px;
      border: 1px solid var(--lux-border-soft);
      background: var(--lux-ivory);
    }
    .hip-sec-card.sec-truth {
      background: #FFFEFA;
      border: 1px solid var(--lux-gold-border);
      border-left: 3px solid var(--lux-gold);
    }
    .hip-sec-heading {
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--lux-black);
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .hip-two-lines {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .hip-line {
      margin: 0 !important;
      font-size: 0.83rem;
      font-weight: 600;
      color: #262522;
      line-height: 1.52;
      word-break: keep-all;
    }
    .hip-check-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 7px 10px;
      border-radius: 8px;
      background: var(--lux-white);
      border: 1px solid var(--lux-border-soft);
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--lux-ink);
      line-height: 1.46;
      word-break: keep-all;
    }
    .hip-check-item input[type="checkbox"] {
      width: 15px;
      height: 15px;
      margin-top: 2px;
      accent-color: var(--lux-gold-deep);
      flex-shrink: 0;
      cursor: pointer;
    }

    /* MENU 2 & MENU 3 PANELS (WHITE · BLACK · GOLD) */
    .qna-menu-panel,
    .archive-menu-panel {
      background: var(--lux-white);
      border: 1.5px solid var(--lux-gold);
      border-radius: 16px;
      padding: 18px;
      box-shadow: var(--lux-shadow);
      display: flex;
      flex-direction: column;

e":"밤에도 꺼지지 않는 뇌 각성과 상열감을 검사합니다","desc":"적외선 체열진단기(DITI)로 가슴과 머리에 몰린 열독을 확인하고 수면-각성 리듬이 무너진 원인을 진단합니다."}]},{"tabTitle":"둘째 · 원장 직접 시술","badge":"STEP 2 · 안정위 원장 직접 시술 & 물리치료","heading":"상부 경추·두개천골 추나 & 자율신경 한약으로 맑은 머리와 숙면을 회복합니다","summary":"과열된 교감신경은 식히고 미주신경·뇌혈류 탄력을 높여 두통·어지럼·불면·실신을 근본부터 회복합니다.","cards":[{"tag":"직접 처방 · 자율신경 조율 & 두풍·현훈·안신 맞춤 한약","title":"심박변이도(HRV)와 뇌·전정 혈류 탄력을 회복합니다","desc":"원내 직영 압력 탕전 한약으로 뇌혈류를 맑게 열고 심열(心熱)을 내려 두통·어지럼증 완화와 자연 숙면에 도움드립니다."},{"tag":"직접 시술 · 안정위 원장 상부 경추(C1-C2) & 흉곽 추나요법","title":"추골동맥과 미주신경 통로의 구조적 압박을 해소합니다","desc":"대표원장이 직접 후두골과 상부 경추, 흉추 자율신경절을 정밀 교정해 신경 전달 오류와 경추성 두통·어지럼을 회복합니다."},{"tag":"물리·이학 치료 · 자기장·소노(초음파)·ICT·IR·핫팩 케어","title":"후두하근 긴장 이완과 말초 혈관 순환을 회복합니다","desc":"심부 자기장, 소노(초음파), ICT, IR, 온열 핫팩 치료로 경직된 두경부 근막을 풀고 하체 정맥 환류를 강화해 도움드립니다."}]},{"tabTitle":"셋째 · 실전 대처·홈케어","badge":"STEP 3 · 실전 대처 가이드","heading":"두통·어지럼·실신 전조 증상 시 뇌혈류를 지키는 수칙","summary":"눈앞이 아찔하거나 어지러울 때 즉시 실천하면 실신 부상을 막고 빠르게 안정을 회복합니다.","cards":[{"tag":"응급 대처 · 즉시 쪼그려 앉기 & 다리 꼬아 힘주기(Leg Crossing)","title":"아찔한 전조 증상 시 참지 말고 자세를 낮추세요","desc":"식은땀·이명·현기증이 오면 즉시 앉거나 양다리를 교차해 허벅지·엉덩이에 힘을 주어 뇌혈류 유지에 도움드립니다."},{"tag":"두통·어지럼 케어 · 뒷목 온찜질 & 급격한 고개 회전 피하기","title":"상부 경추 보온으로 뇌·내이 혈류를 부드럽게 유지합니다","desc":"뒷목(풍지혈)을 따뜻하게 찜질하고 기상 시 천천히 일어나 기립성 어지럼증과 이석 자극을 예방하도록 도움드립니다."},{"tag":"수면 케어 · 취침 전 4-7-8 복식호흡 & 미온수 족욕","title":"부교감신경 스위치를 켜서 깊은 서파수면을 회복합니다","desc":"취침 1시간 전 스마트폰을 끄고 따뜻한 족욕과 복식호흡으로 머리의 열을 내려 숙면에 도움드립니다."}]},{"tabTitle":"넷째 · 추천 식단 · 루틴","badge":"STEP 4 · 식단 & 생활습관","heading":"뇌신경·혈관을 지키는 식단과 종아리 펌프 루틴","summary":"편두통 유발 식품과 탈수를 피하고 제2의 심장인 종아리 근육 운동으로 뇌혈류를 회복합니다.","cards":[{"tag":"추천 식단 · 뇌혈류 & 자율신경 안정 영양","title":"충분한 미온수 · 천마·국화·대추차 · 푸른잎채소·연어","desc":"마그네슘과 철분, 따뜻한 미온수를 충분히 섭취해 혈장 볼륨과 신경 안정 유지에 도움드립니다."},{"tag":"주의 요인 · 두통·어지럼·실신 유발 방아쇠 차단","title":"아침 공복 · 과도한 카페인·알코올 · 장시간 기립 주의","desc":"공복 저혈당과 카페인 과다 섭취는 뇌혈관 수축·확장 변동을 키워 편두통과 실신을 악화시킵니다."},{"tag":"매일 루틴 · 종아리 펌프(까치발 들기) 운동 50회","title":"하체 혈액을 심장과 뇌로 힘차게 올려보냅니다","desc":"매일 규칙적인 까치발 들기(Calf Raise) 운동으로 정맥 환     const SEED_NOTES = [{"id":"knee-20261023","partId":"knee","partLabel":"무릎 성장판","keyword":"입호흡","publishDate":"2026-10-23","title":"밤마다 입을 살짝 벌리고 자는 습관도 키 성장에 영향을 줄까요?","empathy":["아이가 일찍 잠자리에 드는데도 아침마다 유독 눈을 못 뜨고 베개에 침 자국이 남아 있어요.","단순한 잠버릇인 줄만 알았는데 입호흡이 계속되면 키 크는 데도 손해라는 말을 들어 걱정됩니다."],"truth":["코가 막혀 입으로 숨을 쉬면 잠든 사이 뇌에 산소가 충분히 전달되지 않아 몸이 밤새 얕은 잠만 뒤척이게 됩니다.","무릎 성장 연골을 쑥쑥 키워 주는 성장 호르몬은 가장 깊게 잠든 시간에만 뿜어져 나오는데, 입호흡이 이 귀한 성장 시간을 가로막는 셈입니다."],"myth":["잠자는 시간만 8시간 이상 채우면 무조건 키가 잘 자란다고 생각하기 쉽습니다.","하지만 코로 편안하게 숨 쉬며 깨지 않고 깊게 자는 수면의 질이 뒷받침되지 않으면 오래 누워 있어도 성장 효율이 크게 떨어집니다."],"check":["잠든 지 1시간쯤 지났을 때 아이 입술이 벌어져 있거나 숨소리가 거칠게 들리는지 1분만 지켜보세요.","아침에 일어났을 때 아이가 입안이 마른다며 찬물부터 찾거나 다크서클이 짙어져 있는지 확인해 보세요."]},{"id":"knee-20261025","partId":"knee","partLabel":"무릎 성장판","keyword":"어린이 성장통","publishDate":"2026-10-25","title":"밤에만 무릎과 종아리가 아프다는 아이, 다 자연스러운 성장통일까요?","empathy":["낮에는 운동장에서 신나게 뛰어놀던 아이가 불만 끄면 다리가 아프다며 주물러 달라고 칭얼거려요.","주변에서는 키 크느라 겪는 어린이 성장통이라지만, 혹시 무릎 관절에 무리가 간 건 아닌지 헷갈립니다."],"truth":["낮 동안 허벅지 뼈와 종아리 뼈의 성장 연골이 자라는 속도를 주변 근육과 힘줄이 미처 따라가지 못하면 저녁에 당기는 통증이 생깁니다.","마치 작아진 고무줄을 양쪽에서 잡아당기는 것과 같아서, 따뜻한 손으로 주물러 주었을 때 스르르 풀린다면 자연스러운 어린이 성장통일 가능성이 높습니다."],"myth":["아이들이 다리가 아프다고 하면 무조건 키가 크는 중이라며 그냥 참게 두는 경우가 많습니다.","만약 양쪽이 아니라 한쪽 무릎만 계속 아프거나 아침에 일어난 뒤에도 절뚝거리고 부어 있다면 단순 성장통이 아니므로 세심하게 살펴야 합니다."],"check":["아이가 아파하는 부위가 양쪽 허벅지나 종아리 근육인지, 아니면 한쪽 무릎 뼈마디 한 곳인지 손끝으로 짚어 보세요.","따뜻한 물수건을 5분간 올려 둔 뒤 통증이 편안해지는지, 다음 날 아침 걸음걸이가 가벼운지 확인해 보세요."]},{"id":"knee-20261027","partId":"knee","partLabel":"무릎 성장판","keyword":"소아비만","publishDate":"2026-10-27","title":"통통하게 오른 살이 정말 나중에 다 키로 갈까요?","empathy":["한창 클 나이엔 잘 먹어야 키도 큰다는데, 요즘 아이 배와 허벅지에 살이 부쩍 올라 걱정이에요.","어른들은 어릴 때 찐 살은 다 키로 간다고 안심하라고 하시지만, 혹시 소아비만 때문에 키가 일찍 멈추진 않을지 마음이 쓰입니다."],"truth":["몸속에 과도하게 쌓인 지방은 가만히 있지 않고, 뇌에 이제 어른 몸으로 빨리 자라라는 재촉 신호를 보내 무릎 성장 연골의 문 닫는 시계를 앞당깁니다.","마치 열 시간 동안 천천히 지어야 높게 올라갈 건물을 일찍 마감 공사에 들어가게 하는 것과 같아서, 소아비만이 지속되면 당장은 커 보여도 최종 키에서 손해를 보기 쉽습니다."],"myth":["어릴 때 살이 곧 키가 된다는 말은 활동량이 아주 많고 먹을거리가 부족하던 시절에나 맞던 이야기입니다.","달고 기름진 간식이 흔한 요즘에는 남는 열량이 허벅지 뼈와 종아리 뼈 길이를 늘리는 대신 사춘기 시계만 빠르게 돌리고 무릎 관절에 무거운 짐을 얹을 뿐입니다."],"check":["오늘 밤 샤워 후 아이 목 뒷부분과 겨드랑이 피부를 보았을 때, 때가 낀 것처럼 거뭇하고 두꺼워진 흔적이 있는지 살펴보세요.","최근 반년 사이 바지 허리둘레가 급격히 작아지면서 또래보다 머리 냄새가 진해지거나 빠른 사춘기 신체 변화가 비치지 않는지 확인해 보세요."]},{"id":"knee-20261029","partId":"knee","partLabel":"무릎 성장판","keyword":"성장호르몬","publishDate":"2026-10-29","title":"자기 전 마시는 달콤한 우유나 과일 한 조각도 키 크는 걸 방해할까요?","empathy":["저녁밥을 적게 먹은 날이면 아이가 배고플까 봐 잠들기 전에 과일이나 달콤한 유제품을 챙겨 주곤 했어요.","몸에 좋은 간식이라 괜찮을 줄 알았는데 밤늦게 먹으면 성장호르몬이 줄어든다는 이야기를 듣고 깜짝 놀랐습니다."],"truth":["잠들기 직전 단 음식을 먹어 핏속 당분이 높아지면, 이를 치우기 위해 바빠진 몸이 밤사이 나와야 할 성장호르몬의 문을 잠가 버립니다.","밤 10시부터 새벽 2시는 무릎 성장 연골에 영양 벽돌을 쌓는 황금 시간인데, 늦은 간식이 그 공사장의 불을 끄는 스위치 역할을 하는 셈입니다."],"myth":["키를 키우려면 잠자기 직전까지라도 뭐든 든든히 먹여 재워야 뼈로 영양이 간다고 오해하기 쉽습니다.","실제로는 잠들기 최소 2시간 전부터 위장을 편안하게 비워 두어야 밤사이 뇌에서 성장호르몬이 훨씬 힘차게 분비됩니다."],"check":["오늘 저녁 식사 후부터 잠자리에 들 때까지 최소 2시간 이상 물 이외의 간식 공백 시간이 지켜졌는지 점검해 보세요.","아침에 일어났을 때 아이 얼굴이 부어 있거나 입냄새가 유독 심하고 아침밥을 거부하지 않는지 살펴보세요."]},{"id":"knee-20261031","partId":"knee","partLabel":"무릎 성장판","keyword":"숨은 키","publishDate":"2026-10-31","title":"거실 바닥에 앉아 숙제하는 습관이 아이의 숨은 키를 깎아 먹을까요?","empathy":["책상 의자를 사 주었는데도 아이가 자꾸 거실 바닥에 다리를 꼬거나 W자 모양으로 꺾어 앉아 장난감을 가지고 놀아요.","자세가 구부정해 보일 때마다 잔소리는 하지만 이 습관이 무릎 성장에도 나쁜 영향을 줄 줄은 미처 몰랐습니다."],"truth":["바닥에 다리를 꺾어 앉으면 골반이 한쪽으로 기울어지면서 허벅지 뼈와 종아리 뼈 사이 무릎 성장 연골의 한쪽 모서리만 짓눌리게 됩니다.","화분 한쪽에만 무거운 돌을 올려 두면 새싹이 반듯하게 위로 뻗지 못하는 것처럼, 틀어진 자세는 이미 자란 숨은 키까지 구부러뜨립니다."],"myth":["아이들 뼈와 관절은 말랑하고 유연해서 어떻게 앉든 자라면서 저절로 다 펴진다고 생각하기 쉽습니다.","오히려 뼈가 빠르게 자라는 초등학생 시기일수록 잘못된 앉기 습관이 근육 기억으로 굳어져 양쪽 다리 균형에 차이를 만들기 쉽습니다."],"check":["아이가 똑바로 서 있을 때 양쪽 어깨 높이와 바지 밑단이 바닥에 닿는 길이가 서로 같은지 뒤에서 1분간 바라보세요.","아이가 자주 신는 운동화 뒤집어 보았을 때 좌우 뒷굽 중 한쪽 바깥면만 유난히 빨리 닳아 있지 않은지 확인해 보세요."]},{"id":"knee-20261102","partId":"knee","partLabel":"무릎 성장판","keyword":"어린이 면역력","publishDate":"2026-11-02","title":"환절기마다 감기를 달고 사는 아이, 왜 그 시기엔 키도 잘 안 자랄까요?","empathy":["계절이 바뀔 때마다 콧물과 기침이 두세 달씩 이어지다 보니 아이 입맛도 뚝 떨어지고 몸무게도 제자리걸음이에요.","또래 친구들은 한 뼘씩 훌쩍 크는데 우리 아이만 감기 치르느라 성장이 멈춘 것 같아 속상합니다."],"truth":["우리 몸의 에너지는 정해져 있어서, 코와 목에 염증이 자주 생기면 몸속 일꾼들이 무릎 성장 연골을 키우는 일을 멈추고 불 끄는 데만 매달립니다.","어린이 면역력이 흔들려 잔병치레가 길어지는 기간에는 성장 공사장이 잠시 휴업 상태에 들어가기 때문에 연간 키 성장 속도가 더뎌질 수 있습니다."],"myth":["어릴 때 감기는 많이 앓으면서 이겨 내야 저절로 튼튼해지고 키도 큰다고 믿는 경우가 있습니다.","열이 내린 뒤에도 밥맛과 어린이 면역력을 제때 회복하지 못한 채 다음 감기로 이어지면 따라잡기 성장을 할 여유를 놓치게 됩니다."],"check":["잠자리에 들기 전 침실 습도가 50% 안팎으로 촉촉한지, 아이 목덜미에 서늘한 외풍이 닿지 않는지 손등으로 확인해 보세요.","감기를 앓고 난 뒤 2주가 지났는데도 아이가 평소 먹던 밥양의 절반도 못 먹거나 쉽게 주저앉아 피곤해하는지 살펴보세요."]},{"id":"cervical-20261023","partId":"cervical","partLabel":"목뼈 · 두피 혈관","keyword":"두피 가려움","publishDate":"2026-10-23","title":"밤에 머리 감고 덜 말린 채 누우면 정말 머리카락 뿌리가 약해질까요?","empathy":["퇴근하고 늦게 씻고 나면 팔도 아프고 피곤해서 수건으로만 대충 물기를 닦고 베개에 머리를 대곤 해요.","요즘 들어 베개 냄새도 신경 쓰이고 정수리 쪽 두피 가려움과 뾰루지가 잦아져 은근히 불안합니다."],"truth":["축축한 두피가 따뜻한 베개와 만나면 마치 여름철 젖은 빨래처럼 세균과 곰팡이가 번식하기 가장 좋은 온실로 변합니다.","이렇게 생긴 미세한 염증은 머리카락 뿌리를 감싸는 토양을 무르게 만들고 성가신 두피 가려움과 함께 모발이 일찍 빠지게 만듭니다."],"myth":["드라이기 바람을 쐬면 머릿결이 상한다며 자연 바람에 저절로 마르도록 젖은 채 두는 것이 좋다고 생각하기 쉽습니다.","뜨거운 열풍 대신 미지근하거나 시원한 바람으로 두피 속 뿌리 물기만 바싹 말려 주는 것이 머리카락 건강을 지키는 핵심입니다."],"check":["오늘 밤 머리를 말린 뒤 손가락을 뒷머리 속 두피에 넣어 보았을 때 축축하거나 눅눅한 기운이 남아 있지 않은지 확인해 보세요.","베개 커버를 마지막으로 세탁한 지 일주일이 넘었거나 정수리 부근에 붉은 뾰루지가 만져지지 않는지 살펴보세요."]},{"id":"cervical-20261025","partId":"cervical","partLabel":"목뼈 · 두피 혈관","keyword":"거북목","publishDate":"2026-10-25","title":"고개 숙여 휴대폰을 보는 자세가 왜 정수리 머리카락까지 가늘게 만들까요?","empathy":["하루 종일 모니터와 휴대폰을 들여다보고 나면 저녁마다 뒷목이 돌처럼 단단해지고 머리 위쪽만 화끈거려요.","목이 뻐근한 거북목 문제인 줄만 알았는데 같은 시기부터 가르마 볼륨까지 푹 꺼져 보여 걱정됩니다."],"truth":["머리카락 뿌리에 영양분을 배달하는 가느다란 혈관들은 모두 목과 어깨 길목을 지나 머리 꼭대기까지 올라갑니다.","고개가 앞으로 빠진 거북목 자세로 뒷목 근육이 꽉 뭉치면 마치 발로 밟힌 물호스처럼 두피로 가는 혈액 길이 좁아져 모발이 점점 가늘어집니다."],"myth":["머리카락이 가늘어지면 두피 겉면에 바르는 좋은 샴푸나 영양제만 바꾸면 해결된다고 믿기 쉽습니다.","정작 목 아래에서 올라오는 영양 공급 통로가 꺾여 있으면 겉에 아무리 좋은 성분을 발라도 뿌리 깊은 곳까지 힘이 닿기 어렵습니다."],"check":["옆모습을 거울에 비추어 보았을 때 귓불의 위치가 어깨 한가운데 선보다 한 뼘 가까이 앞으로 나와 있지 않은지 확인해 보세요.","양손 엄지로 머리뼈와 뒷목이 만나는 오목한 곳을 살짝 눌렀을 때 유독 찌릿하거나 딱딱하게 굳어 있는지 짚어 보세요."]},{"id":"cervical-20261027","partId":"cervical","partLabel":"목뼈 · 두피 혈관","keyword":"두피열","publishDate":"2026-10-27","title":"손발은 차가운데 유독 머리 꼭대기만 뜨끈한 이유, 그냥 체질 탓일까요?","empathy":["오후만 되면 얼굴과 정수리로 열이 확 달아오르고 저녁 무렵엔 앞머리가 기름져 떡이 지곤 해요.","단순히 피곤해서 오르는 열인 줄 알았는데 이 두피열이 머리카락을 빨리 빠지게 한다는 말에 거울을 자꾸 보게 됩니다."],"truth":["스트레스와 수면 부족이 겹치면 몸의 열기가 아래로 골고루 돌지 못하고 굴뚝 연기처럼 머리 꼭대기로만 몰리게 됩니다.","사막처럼 뜨거워진 두피열 환경에서는 수분은 날아가고 기름기만 끈적하게 변해 머리카락 뿌리가 오래 버티지 못하고 일찍 힘을 잃습니다."],"myth":["머리가 뜨거울 때마다 얼음팩이나 아주 차가운 물로 두피를 갑자기 식히면 열이 쉽게 빠질 거라 생각하기 쉽습니다.","갑작스러운 냉자극은 오히려 혈관을 놀라게 할 수 있어, 발끝을 따뜻한 물에 담가 위쪽 열기를 자연스럽게 아래로 내려 주는 편이 훨씬 순리적입니다."],"check":["오늘 밤 손등 하나는 정수리 두피에, 다른 손등은 볼이나 손목에 동시에 대어 보았을 때 정수리가 유독 뜨겁게 느껴지는지 비교해 보세요.","하얀 종이나 손끝으로 정수리 두피를 가볍게 비벼 보았을 때 노르스름한 기름기나 붉은 기운이 눈에 띄지 않는지 확인해 보세요."]},{"id":"cervical-20261029","partId":"cervical","partLabel":"목뼈 · 두피 혈관","keyword":"머리 감는 시간","publishDate":"2026-10-29","title":"바쁜 아침에 머리 감기 대 저녁에 감기, 모발 건강엔 언제가 더 유리할까요?","empathy":["아침에 자고 일어나면 머리가 눌려서 늘 출근 직전에만 머리를 감고 밤에는 세수만 한 채 잠들었어요.","하루 한 번 똑같이 감는데도 머리 감는 시간 때문에 두피 상태가 달라질 수 있다니 궁금해집니다."],"truth":["낮 동안 두피에 달라붙은 미세먼지와 땀, 기름기는 밤사이 공기와 만나 모공 입구를 막는 찌꺼기로 변합니다.","머리카락 뿌리 세포가 가장 활발히 새살을 돋우는 밤 시간 전에 깨끗이 씻어 주는 저녁 머리 감는 시간이 건강한 모발 주기에 훨씬 유리합니다."],"myth":["하루에 두세 번씩 뽀드득 소리가 날 때까지 박박 문질러 감아야 두피가 깨끗해진다고 오해하기 쉽습니다.","손톱으로 긁거나 과하게 씻어 내면 두피를 지켜 주는 보호막까지 벗겨져 오히려 기름기가 더 많이 뿜어져 나올 수 있습니다."],"check":["머리를 감을 때 손톱 끝이 아닌 열 손가락의 부드러운 지문 살로 거품을 내어 마사지하고 있는지 오늘 밤 점검해 보세요.","헹구는 물의 온도가 목욕탕 열탕처럼 너무 뜨겁지 않고 체온과 비슷한 미지근한 온도인지 손목으로 먼저 확인해 보세요."]},{"id":"cervical-20261031","partId":"cervical","partLabel":"목뼈 · 두피 혈관","keyword":"다이어트 탈모","publishDate":"2026-10-31","title":"살을 빼려고 굶기 시작한 지 두 달 뒤, 왜 머리카락이 한 움큼씩 빠질까요?","empathy":["체중계 숫자는 줄어들어 기뻤는데 언제부턴가 머리 말릴 때마다 바닥에 떨어지는 머리카락이 두 배로 늘었어요.","살 빠진 시기와 시차가 있다 보니 이게 말로만 듣던 다이어트 탈모인지 당황스럽습니다."],"truth":["갑자기 식사량을 크게 줄이면 우리 몸은 심장이나 뇌처럼 당장 생명에 꼭 필요한 곳에만 영양분을 보내고 머리카락으로 가는 배급부터 끊습니다.","영양이 끊긴 모발 뿌리는 약 두세 달의 준비 기간을 거쳐 한꺼번에 쉬는 단계로 넘어가기 때문에 뒤늦게 다이어트 탈모가 눈에 띄게 나타납니다."],"myth":["검은콩만 잔뜩 갈아 마시면 다른 식사를 굶어도 머리카락이 금방 다시 풍성해진다고 믿기 쉽습니다.","한 가지 식품만 편식하기보다 달걀이나 살코기, 두부, 해조류 같은 기본 단백질과 철분을 매끼 고르게 채워 주는 것이 우선입니다."],"check":["오늘 하루 먹은 세 끼 식단 중에 손바닥 크기만 한 단백질 반찬(두부·달걀·생선·살코기)이 최소 두 번 이상 들어 있었는지 떠올려 보세요.","빠진 머리카락 끝부분을 밝은 곳에서 보았을 때 하얀 뿌리 주머니가 힘없이 가늘어져 있지 않은지 살펴보세요."]},{"id":"cervical-20261102","partId":"cervical","partLabel":"목뼈 · 두피 혈관","keyword":"앞머리 숱","publishDate":"2026-11-02","title":"단정하게 바짝 묶어 올리는 머리 습관도 앞머리 숱을 줄어들게 할까요?","empathy":["일할 때 머리카락이 흘러내리는 게 불편해서 매일 고무줄로 높고 팽팽하게 묶거나 한쪽 가르마만 고집했어요.","어느 날 머리를 풀었더니 묶었던 자리가 얼얼하고 이마 양옆 잔머리 부근 앞머리 숱이 휑해 보여 놀랐습니다."],"truth":["머리카락을 같은 방향으로 강하게 잡아당기면 모발을 붙잡고 있는 두피 속 작은 뿌리 주머니가 매일 줄다리기를 하듯 지쳐 버립니다.","어린 묘목을 매일 조금씩 위로 잡아당기면 뿌리가 흙에서 들뜨는 것처럼, 반복되는 당김은 이마선과 가르마 쪽 앞머리 숱을 서서히 줄어들게 합니다."],"myth":["머리를 느슨하게 풀기보다 단단히 묶어 두어야 바람에 엉키지 않아 모발이 덜 빠진다고 생각하기 쉽습니다.","두피가 당겨질 정도로 묶는 습관은 뿌리에 지속적인 긴장을 주므로 집에서 쉬는 시간만이라도 느슨한 집게핀을 쓰거나 풀어 두어야 합니다."],"check":["저녁에 머리끈을 풀었을 때 정수리나 관자놀이 부근 두피에 묵직하고 얼얼한 통증이 남아 있는지 느껴 보세요.","지난 6개월 넘게 단 한 번도 가르마 방향을 바꾸지 않아 한쪽 길만 유독 넓어지고 자외선에 그을려 있지 않은지 거울로 확인해 보세요."]},{"id":"lumbar-20261023","partId":"lumbar","partLabel":"허리 물렁뼈 · 골반","keyword":"골반 틀어짐","publishDate":"2026-10-23","title":"의자에 앉을 때 다리를 꼬아야 편한데, 내 몸이 이미 기울어졌다는 신호일까요?","empathy":["바르게 두 발을 내려놓고 앉으면 어딘가 어색하고 5분도 안 돼서 저도 모르게 한쪽 다리를 포개어 올리고 있어요.","치마가 자꾸 한쪽으로 돌아가고 한쪽 허리만 묵직한데 이게 골반 틀어짐 때문인지 신경 쓰입니다."],"truth":["다리를 꼬고 앉으면 한쪽 엉덩이뼈만 위로 들리면서 그 위에 쌓인 허리 뼈 기둥 전체가 나선 모양으로 비틀리게 됩니다.","기울어진 책상 다리 밑에 책을 괴어야 덜 흔들리는 것처럼, 이미 골반 틀어짐이 진행되면 오히려 다리를 꼬았을 때 몸이 임시로 편하다고 착각하게 됩니다."],"myth":["오른쪽 다리를 꼬았던 시간만큼 반대쪽 왼쪽 다리를 번갈아 꼬아 주면 균형이 다시 맞춰진다고 오해하기 쉽습니다.","양쪽으로 번갈아 비트는 행동은 허리 아래 물렁뼈 쿠션을 좌우로 두 번 쥐어짜는 격이어서 두 발바닥을 바닥에 나란히 두는 것만 못합니다."],"check":["오늘 입었던 바지나 치마의 봉제선이 배꼽 정중앙에서 한쪽으로 돌아가 있거나 양쪽 신발 밑창 닳은 모양이 다른지 확인해 보세요.","바닥에 편하게 누워 힘을 뺐을 때 양쪽 발끝이 벌어지는 각도가 유독 한쪽만 더 바닥 쪽으로 쓰러져 있지 않은지 살펴보세요."]},{"id":"lumbar-20261025","partId":"lumbar","partLabel":"허리 물렁뼈 · 골반","keyword":"허리 통증","publishDate":"2026-10-25","title":"퇴근 후 푹신한 소파에 엉덩이를 빼고 기대앉는 자세, 허리도 쉬고 있는 걸까요?","empathy":["하루 종일 일하고 집에 오면 소파에 반쯤 미끄러지듯 기대어 휴대폰이나 TV를 보는 시간이 가장 달콤해요.","그런데 막상 소파에서 일어나려 하면 아이고 소리가 절로 날 만큼 허리 통증이 심해져 의아합니다."],"truth":["엉덩이를 앞으로 빼고 등을 둥글게 말아 소파에 기대면, 서 있을 때보다 허리 뼈 사이 말랑한 물렁뼈 쿠션이 두 배 가까이 강하게 눌립니다.","햄버거 앞쪽만 손으로 꾹 누르면 속 재료가 뒤로 삐져나오는 것처럼, 내가 편하다고 느끼는 그 시간 동안 허리 뒤쪽 신경 길은 가장 고된 벌을 받고 있습니다."],"myth":["의자나 침대는 몸이 푹 파묻힐 만큼 푹신할수록 허리 관절에 무리가 덜 간다고 생각하기 쉽습니다.","지나치게 푹신한 곳은 허리의 자연스러운 오목한 곡선을 무너뜨려 주변 속근육을 밤새 긴장시키고 허리 통증을 키웁니다."],"check":["지금 소파나 의자에 앉았을 때 허리 뒤쪽과 등받이 사이에 주먹 두 개가 들어갈 만큼 빈 공간이 떠 있지 않은지 손을 넣어 확인해 보세요.","소파에서 30분 이상 머문 뒤 자리에서 일어설 때 허리가 한 번에 펴지지 않고 묵직하게 걸리는 느낌이 드는지 살펴보세요."]},{"id":"lumbar-20261027","partId":"lumbar","partLabel":"허리 물렁뼈 · 골반","keyword":"아침 허리 뻐근함","publishDate":"2026-10-27","title":"밤새 푹 잤는데도 아침에 눈뜨자마자 허리가 뻣뻣한 이유는 무엇일까요?","empathy":["낮에 움직일 때는 그럭저럭 괜찮은데 아침에 알람 듣고 윗몸을 일으키는 순간 허리가 끊어질 듯 뻐근해요.","세수하려고 세면대 앞에서 허리를 살짝 숙일 때마다 찌릿해서 아침 허리 뻐근함이 덜컥 겁이 납니다."],"truth":["허리 뼈 사이에서 충격을 받아 주는 물렁뼈 쿠션은 밤사이 누워 자는 동안 수분을 듬뿍 빨아들여 물풍선처럼 통통하게 부풀어 오릅니다.","이렇게 팽팽해진 아침 첫 시간에 윗몸일으키기하듯 갑자기 허리를 굽히면 압력이 한곳으로 몰려 아침 허리 뻐근함과 갑작스러운 통증이 생기기 쉽습니다."],"myth":["아침에 굳은 허리를 빨리 풀겠다며 잠자리에서 일어나자마자 바닥에 손끝이 닿도록 앞으로 깊게 숙이는 스트레칭을 하곤 합니다.","자고 일어난 직후 1시간 동안은 앞으로 숙이는 동작이 오히려 허리 쿠션에 큰 부담을 주므로 옆으로 돌아 손으로 짚고 천천히 일어나는 것이 안전합니다."],"check":["오늘 밤 잠자리에 누웠을 때 무릎 아래에 얇은 베개를 하나 받쳐 허리와 이불 사이 들뜬 틈이 편안해지는지 직접 느껴 보세요.","내일 아침 기상할 때 곧바로 상체를 일으키지 않고, 옆으로 몸을 먼저 돌린 뒤 팔 힘으로 바닥을 짚고 일어나는 동작을 실천해 보세요."]},{"id":"lumbar-20261029","partId":"lumbar","partLabel":"허리 물렁뼈 · 골반","keyword":"엉덩이 저림","publishDate":"2026-10-29","title":"허리보다 엉덩이와 종아리 뒤쪽이 당기고 저린데, 다리 혈액순환 문제일까요?","empathy":["오래 운전하거나 사무실 의자에 앉아 있으면 한쪽 엉덩이 깊은 곳부터 허벅지 뒤까지 전기가 오듯 저릿해요.","다리가 저리니까 혈액순환이 안 되는 줄 알고 종아리만 주무르는데 엉덩이 저림이 좀처럼 가시지 않습니다."],"truth":["허리에서 출발한 굵은 신경 다발은 엉덩이 깊은 근육 사이를 지나 발끝까지 하나의 전선처럼 길게 이어져 있습니다.","정작 전선 출발지인 허리 아래쪽이나 엉덩이 길목이 눌려 있으면, 아무 죄 없는 종아리와 발바닥에서 엉덩이 저림과 당김 신호가 울리게 됩니다."],"myth":["허리가 크게 아프지 않고 다리만 저리면 허리에는 아무 문제가 없고 다리 근육만 뭉친 것이라 단정하기 쉽습니다.","기침을 하거나 다리를 쭉 폈을 때 엉덩이부터 종아리까지 당기는 줄이 느껴진다면 허리와 골반 신경 길목의 압박부터 살펴야 합니다."],"check":["바닥에 똑바로 누워 무릎을 편 채로 한쪽 다리씩 천천히 들어 올렸을 때 양쪽 다리가 올라가는 높이와 당김이 서로 다른지 비교해 보세요.","뒷주머니에 두꺼운 지갑이나 휴대폰을 넣은 채 앉아 한쪽 엉덩이 신경을 누르는 습관이 없는지 오늘 바지 주머니를 점검해 보세요."]},{"id":"lumbar-20261031","partId":"lumbar","partLabel":"허리 물렁뼈 · 골반","keyword":"급성 요통","publishDate":"2026-10-31","title":"무거운 상자도 아닌 바닥의 양말 한 짝을 줍다가 왜 갑자기 허리가 삐끗할까요?","empathy":["운동하다 다친 것도 아니고 아침에 바닥에 떨어진 수건을 무심코 집어 들다가 억 소리 나게 허리가 굳었어요.","가벼운 물건인데도 한순간에 꼼짝 못 할 만큼 급성 요통이 찾아오니 너무 당황스럽습니다."],"truth":["무릎을 곧게 편 채 허리만 폴더처럼 접어 숙이면, 상체 무게가 긴 지렛대처럼 작용해 허리 아랫부분에 평소보다 몇 배 큰 하중이 쏠립니다.","이미 여러 날 피로가 쌓여 팽팽해진 허리 근육과 인대는 아주 가벼운 물건을 줍는 작은 각도 변화에도 마지막 실이 끊어지듯 급성 요통을 일으킵니다."],"myth":["힘센 사람이나 평소 무거운 기구를 드는 운동을 하는 사람은 가벼운 집안일로는 절대 허리를 다치지 않는다고 믿기 쉽습니다.","무게보다 더 중요한 것은 동작의 순서여서, 무엇을 집든 허리를 굽히기 전에 무릎과 엉덩이를 먼저 낮추는 습관이 허리를 지켜 줍니다."],"check":["오늘 밤 양치나 세수를 할 때 허리만 둥글게 꺾어 숙이지 않고, 무릎을 살짝 구부린 채 세면대에 가까이 서고 있는지 확인해 보세요.","바닥의 물건을 들 때 물건을 내 배꼽 가까이 바짝 붙여 안고 하체 힘으로 일어서는 동작이 자연스러운지 연습해 보세요."]},{"id":"lumbar-20261102","partId":"lumbar","partLabel":"허리 물렁뼈 · 골반","keyword":"허리 근력","publishDate":"2026-11-02","title":"허리가 약할 땐 무조건 누워서 아끼는 게 좋을까요, 걸어야 좋아질까요?","empathy":["허리가 조금만 묵직해도 더 나빠질까 봐 주말 내내 침대에만 누워 움직임을 최소한으로 줄였어요.","그런데 오래 누워 있을수록 몸이 더 천근만근 무겁고 허리 근력만 빠지는 기분이 듭니다."],"truth":["허리 뼈 기둥을 흔들리지 않게 감싸 주는 속근육은 마치 천연 복대와 같아서, 사흘 이상 계속 누워만 있으면 빠르게 힘이 빠지고 얇아집니다.","시선을 정면에 두고 가볍게 팔을 흔들며 평지를 걸으면 허리 쿠션에 산소와 영양이 스펀지처럼 스며들고 허리 근력이 자연스럽게 살아납니다."],"myth":["허리에 힘을 기르겠다며 통증이 있는데도 가파른 등산이나 윗몸일으키기부터 무리하게 시작하는 경우가 많습니다.","급성 통증이 가라앉은 뒤에는 허리를 반복해 꺾는 운동보다 충격이 적은 운동화를 신고 평탄한 길을 20~30분 걷는 것이 훨씬 안전합니다."],"check":["걸을 때 고개를 숙여 휴대폰을 보지 않고 15미터 앞을 바라보며 가슴을 가볍게 편 자세가 유지되는지 오늘 저녁 산책길에 점검해 보세요.","하루 전체 앉아 있는 시간 중 50분마다 한 번씩 자리에서 일어나 기지개를 켜고 1분간 걸었는지 돌아보세요."]},{"id":"gongjindan-20261023","partId":"gongjindan","partLabel":"뇌 · 심장 활력축","keyword":"만성 피로","publishDate":"2026-10-23","title":"주말 내내 낮까지 몰아서 잤는데도 왜 월요일 아침엔 더 천근만근일까요?","empathy":["평일에 못 잔 잠을 보충하려고 토요일과 일요일엔 정오가 넘도록 암막 커튼을 치고 푹 잤어요.","잠은 실컷 잤는데도 머리가 안개 낀 것처럼 멍하고 만성 피로가 오히려 더 심해진 느낌입니다."],"truth":["기상 시간을 주말마다 서너 시간씩 늦추면 우리 몸속 생체 시계는 매주 해외여행을 다녀온 것처럼 심한 시차 혼란에 빠집니다.","뇌와 심장을 깨우는 아침 활력 호르몬 리듬이 뒤엉키면서 정작 월요일 아침에는 시동이 걸리지 않는 만성 피로 상태가 이어집니다."],"myth":["밀린 잠은 은행 적금처럼 주말에 한꺼번에 몰아서 자 두면 평일 피로가 말끔히 지워진다고 생각하기 쉽습니다.","아침에 눈뜨는 시각은 평일과 1시간 이내로 비슷하게 맞추고, 부족한 잠은 오후 3시 이전에 20분 정도 짧은 낮잠으로 채우는 편이 훨씬 개운합니다."],"check":["평일 기상 시각과 주말 기상 시각의 차이가 2시간 이상 벌어져 있지 않은지 최근 일주일 수면 습관을 돌아보세요.","아침에 눈을 뜬 뒤 30분 안에 창문을 열어 햇빛을 쬐며 뇌의 아침 스위치를 켜 주고 있는지 확인해 보세요."]},{"id":"gongjindan-20261025","partId":"gongjindan","partLabel":"뇌 · 심장 활력축","keyword":"카페인 피로","publishDate":"2026-10-25","title":"피곤할 때마다 마시는 진한 커피 한 잔, 정말 내 체력을 채워 주는 걸까요?","empathy":["아침에 눈뜨자마자 한 잔, 점심 먹고 쏟아지는 잠을 쫓으려고 또 한 잔 마셔야 겨우 오후 업무를 버텨요.","처음엔 정신이 번쩍 들더니 이제는 커피를 마셔도 가슴만 두근거리고 저녁엔 카페인 피로가 한꺼번에 몰려옵니다."],"truth":["커피는 몸에 새 에너지를 넣어 주는 연료가 아니라, 뇌가 보내는 쉬어야 한다는 피로 경고등만 잠시 가려 두는 가리개와 같습니다.","가리개가 걷히는 오후 늦은 시간이 되면 그동안 쌓여 있던 피로 물질이 한꺼번에 밀려오면서 심장은 지치고 밤잠까지 얕아지는 카페인 피로 악순환이 생깁니다."],"myth":["커피를 마시고도 밤에 머리만 대면 금방 잠드니까 내 몸은 커피의 영향을 전혀 받지 않는다고 믿기 쉽습니다.","잠이 들더라도 뇌가 깊게 쉬는 수면 단계가 얕아지기 때문에 다음 날 아침 개운함이 크게 떨어질 수 있습니다."],"check":["오늘 마지막으로 마신 커피나 녹차, 에너지 음료의 시각이 오후 2시를 넘기지 않았는지 확인해 보세요.","아침 기상 직후 빈속에 차가운 커피부터 마시는 대신 미지근한 물 한 컵으로 밤새 부족해진 수분을 먼저 채웠는지 점검해 보세요."]},{"id":"gongjindan-20261027","partId":"gongjindan","partLabel":"뇌 · 심장 활력축","keyword":"브레인 포그","publishDate":"2026-10-27","title":"방금 하려던 말도 깜빡하고 머릿속에 안개가 낀 듯 멍한 건 나이 탓일까요?","empathy":["중요한 서류나 책을 앞에 두고도 같은 줄만 세 번씩 읽고, 단어가 입안에서만 맴돌아 답답할 때가 많아졌어요.","잠도 그럭저럭 자는데 왜 머리가 맑지 않고 브레인 포그처럼 뿌연 느낌이 계속되는지 걱정됩니다."],"truth":["우리 뇌는 몸무게의 아주 작은 부분이지만 심장이 보내는 산소와 영양의 5분의 1을 쓸 만큼 에너지를 많이 소모하는 기관입니다.","긴장과 과로로 가슴과 목 주변 순환이 막히고 밤사이 뇌 속 피로 찌꺼기를 씻어 내지 못하면, 창문에 김이 서리듯 브레인 포그 현상이 나타납니다."],"myth":["머리가 멍하고 기억력이 떨어질 때는 책상에 더 오래 앉아 억지로 집중력을 쥐어짜야만 능률이 오른다고 생각하기 쉽습니다.","과열된 컴퓨터를 잠시 재부팅해야 빨라지듯, 50분 집중 후 5분간 창밖 먼 곳을 보며 깊게 숨을 내쉬어야 뇌 혈류가 다시 맑아집니다."],"check":["집중해서 일할 때 나도 모르게 숨을 얕게 참거나 어금니를 꽉 깨물어 가슴과 관자놀이가 긴장되어 있지 않은지 지금 바로 느껴 보세요.","오늘 밤 잠들기 전 3분 동안 배가 천천히 부풀었다 가라앉도록 코로 들이마시고 길게 내쉬는 편안한 호흡이 잘 되는지 확인해 보세요."]},{"id":"gongjindan-20261029","partId":"gongjindan","partLabel":"뇌 · 심장 활력축","keyword":"가슴 답답함","publishDate":"2026-10-29","title":"신경 쓰는 일이 많을 때 자꾸 한숨이 나오고 앞가슴이 묵직한 이유는 무엇일까요?","empathy":["특별히 달리기한 것도 아닌데 가슴 한가운데에 돌멩이가 얹힌 듯 답답해서 하루에도 몇 번씩 큰 한숨을 내쉬어요.","주변에 눈치가 보여 한숨을 참으려 해도 숨이 끝까지 시원하게 안 들어가는 가슴 답답함이 이어집니다."],"truth":["걱정과 긴장이 계속되면 갈비뼈 사이 호흡 근육이 딱딱하게 굳어 폐가 풍선처럼 충분히 펴지지 못합니다.","이때 나오는 깊은 한숨은 좁아진 가슴 공간을 넓히고 심장과 뇌에 신선한 산소를 보내려는 우리 몸의 자연스러운 구조 요청 신호입니다."],"myth":["한숨을 쉬면 복이 달아난다거나 기분이 더 가라앉는다며 억지로 숨을 참고 참아 넘기는 것이 좋다고 여기기 쉽습니다.","가슴 답답함이 느껴질 때는 어깨 힘을 툭 떨어뜨리고 입술을 오므려 후 하고 길게 숨을 비워 내야 긴장 스위치가 부드럽게 내려갑니다."],"check":["양쪽 가슴 정중앙 뼈 부위를 손가락 끝으로 가볍게 눌렀을 때 유독 뻐근하고 아픈 긴장감이 느껴지는지 짚어 보세요.","숨을 들이마실 때 배보다 어깨와 쇄골만 위로 들썩이는 얕은 가슴 호흡을 하고 있지 않은지 거울 앞에서 확인해 보세요."]},{"id":"gongjindan-20261031","partId":"gongjindan","partLabel":"뇌 · 심장 활력축","keyword":"새벽 각성","publishDate":"2026-10-31","title":"잠드는 건 쉬운데 왜 매일 새벽 2~3시만 되면 눈이 말똥말똥 떠질까요?","empathy":["밤 11시에 피곤해서 쓰러지듯 잠들었는데 새벽 두세 시쯤 꼭 한 번씩 깨서 다시 잠들기가 힘들어요.","아침까지 푹 이어서 자 본 지가 언제인지 기억나지 않을 만큼 새벽 각성이 반복되어 낮 동안 기력이 바닥납니다."],"truth":["낮에 쌓인 긴장 열기가 밤까지 식지 않거나 늦은 저녁 식사로 속이 바쁘면, 몸이 한창 해독하고 쉬어야 할 새벽에 비상벨이 잘못 울립니다.","깊은 잠의 흐름이 새벽 각성으로 한 번 끊기면 전체 잠든 시간은 비슷해도 뇌와 근육의 피로 회복량은 절반 가까이 줄어듭니다."],"myth":["밤에 안 깨고 푹 자려면 잠들기 직전 맥주 한 캔이나 가벼운 술 한잔을 마시는 게 도움이 된다고 생각하기 쉽습니다.","알코올은 처음 잠들 때만 졸음을 부를 뿐 서너 시간 뒤 분해되면서 심장을 빠르게 뛰게 만들어 오히려 새벽에 잠을 더 자주 깨웁니다."],"check":["새벽에 눈이 떠졌을 때 곧바로 밝은 휴대폰 시계 화면을 확인해 뇌를 완전히 깨워 버리는 습관이 있는지 점검해 보세요.","저녁 식사나 술자리가 잠들기 3시간 이내에 끝나지 않아 밤새 속이 더부룩한 채 누워 있지 않았는지 돌아보세요."]},{"id":"gongjindan-20261102","partId":"gongjindan","partLabel":"뇌 · 심장 활력축","keyword":"기력 저하","publishDate":"2026-11-02","title":"오전엔 괜찮다가 오후 3시만 넘으면 배터리가 닳듯 온몸에 힘이 빠지는 이유는 뭘까요?","empathy":["아침에는 의욕 있게 하루를 시작하는데 오후 세네 시만 되면 눈꺼풀이 무겁고 목소리 내는 것조차 힘에 부쳐요.","운동 부족인가 싶어 저녁에 무리하게 땀을 흘려 보아도 다음 날 기력 저하만 더 깊어져 고민입니다."],"truth":["점심으로 면이나 빵처럼 빨리 소화되는 음식을 먹고 물까지 적게 마시면, 오후 중반쯤 혈액 속 에너지가 롤러코스터처럼 뚝 떨어집니다.","여기에 햇빛 없는 실내 생활까지 겹치면 뇌와 심장의 활력 배터리가 일찍 바닥나면서 오후마다 깊은 기력 저하를 겪게 됩니다."],"myth":["체력이 떨어졌을 때는 무조건 땀이 흠뻑 날 만큼 강도 높은 저녁 운동을 밀어붙여야 기운이 살아난다고 믿기 쉽습니다.","몸이 이미 방전된 상태에서 밤늦게 격한 운동을 하면 회복 에너지만 더 고갈되므로 낮 시간 15분 햇볕 산책부터 시작하는 것이 현명합니다."],"check":["오후에 힘이 빠질 때 소변 색깔이 진한 노란색을 띠거나 하루 동안 마신 순수한 물이 세 컵도 채 안 되지 않는지 확인해 보세요.","점심 식사 직후 바로 자리에 앉아 꾸벅꾸벅 조는 대신 10분이라도 바깥 공기를 쐬며 가볍게 걸었는지 점검해 보세요."]},{"id":"syncope-20261023","partId":"syncope","partLabel":"뇌신경 · 자동조절 신경","keyword":"기립성 어지럼증","publishDate":"2026-10-23","title":"앉았다가 벌떡 일어설 때 눈앞이 반짝 어두워지는 건 다 빈혈 때문일까요?","empathy":["따뜻한 곳에서 쪼그려 앉아 있다가 일어나는 순간 눈앞이 까매져서 벽을 짚고 가만히 서 있었던 적이 있어요.","주변에서 피가 부족한 빈혈이라며 철분제부터 먹으라는데, 건강검진 피검사 수치는 정상이라 기립성 어지럼증 원인이 궁금합니다."],"truth":["자리에서 갑자기 일어서면 중력 때문에 피가 다리 쪽으로 쏠리는데, 이때 혈관을 재빨리 조여 피를 머리까지 올려 보내는 자동조절 신경이 한 박자 늦게 반응할 때가 있습니다.","피의 양 자체가 모자란 빈혈과 달리, 피를 뇌까지 끌어 올리는 종아리와 혈관 펌프가 순간적으로 느려져 생기는 것이 기립성 어지럼증입니다."],"myth":["일어설 때 어지러우면 무조건 철분 영양제나 피에 좋다는 음식만 챙겨 먹으면 금방 해결된다고 생각하기 쉽습니다.","수분 섭취가 부족하거나 다리 근육을 움직이지 않은 채 갑자기 일어나는 습관을 고치지 않으면 피검사 수치가 좋아도 어지럼이 반복될 수 있습니다."],"check":["아침에 잠자리에서 일어날 때 눈 뜨고 30초, 침대 끝에 걸터앉아 발목을 움직이며 30초를 기다린 뒤 천천히 일어서는지 점검해 보세요.","샤워나 반신욕으로 몸이 따뜻하게 데워진 직후 어지럼이 더 자주 찾아오지 않는지 최근 상황을 떠올려 보세요."]},{"id":"syncope-20261025","partId":"syncope","partLabel":"뇌신경 · 자동조절 신경","keyword":"편두통","publishDate":"2026-10-25","title":"머리가 심장 박동처럼 욱신거리고 불빛까지 눈부신 날, 진통제만 늘리는 게 맞을까요?","empathy":["신경 쓸 일이 있거나 끼니를 한번 거른 날이면 한쪽 관자놀이가 쿵쿵 울리고 속까지 울렁거려 아무것도 못 하겠어요.","참다못해 두통약을 자꾸 먹다 보니 이제는 약 먹는 횟수만 늘어나는 것 같아 편두통 관리가 막막합니다."],"truth":["우리 뇌 주변 혈관과 신경은 일정한 생활 리듬을 좋아해서, 잠을 설쳤거나 공복이 길어지면 위험 신호로 받아들이고 예민하게 부풀어 오릅니다.","한번 예민해진 뇌 신경은 평소엔 아무렇지 않던 형광등 불빛이나 작은 말소리에도 과하게 반응하며 욱신거리는 편두통을 일으킵니다."],"myth":["머리가 한쪽만 아파야만 편두통이고 양쪽이 다 아프면 다른 종류의 두통이라고 단정하기 쉽습니다.","양쪽이 아파도 움직일 때 심장 뛰듯 욱신거림이 커지거나 속 메스꺼움과 빛 예민함이 함께 나타난다면 뇌 신경의 과민 신호로 볼 수 있습니다."],"check":["두통이 시작되기 전날 밤 수면 시간이 들쭉날쭉했거나 아침·점심 끼니를 거른 채 커피만 마시지 않았는지 기록해 보세요.","일주일에 사흘 이상 습관적으로 두통약을 복용해 오히려 머리가 더 자주 무거워지는 반동 현상이 없는지 횟수를 세어 보세요."]},{"id":"syncope-20261027","partId":"syncope","partLabel":"뇌신경 · 자동조절 신경","keyword":"미주신경 어지럼","publishDate":"2026-10-27","title":"만원 지하철이나 더운 곳에 오래 서 있을 때 갑자기 식은땀이 나고 아찔한 이유는 뭘까요?","empathy":["출근길 답답한 전철 안에서 가만히 서 있는데 갑자기 속이 메스껍고 귀가 멍해지면서 식은땀이 주르륵 흘렀어요.","잠시 주저앉아 바람을 쐬니 괜찮아졌지만 언제 또 미주신경 어지럼이 찾아올지 몰라 사람 많은 곳이 두렵습니다."],"truth":["덥고 밀폐된 곳에서 다리를 움직이지 않고 오래 서 있으면 심장으로 돌아와야 할 피가 부족해져 뇌가 잠시 과부하를 막으려고 몸의 긴장 스위치를 확 내려 버립니다.","그 순간 혈압과 맥박이 동시에 뚝 떨어지면서 머리까지 올라가던 피가 줄어들어 시야가 좁아지는 미주신경 어지럼 신호가 나타납니다."],"myth":["눈앞이 하얘지고 식은땀이 날 때 남들 보기에 민망하다며 이를 악물고 끝까지 서서 버티려 하는 경우가 많습니다.","전조 신호가 올 때 서서 참으면 넘어져 크게 다칠 수 있으므로, 즉시 바닥에 쪼그려 앉거나 다리를 꼬고 허벅지와 엉덩이에 힘을 꽉 주어 피를 위로 올려야 합니다."],"check":["오래 서 있어야 하는 날 아침 식사와 물 한 컵을 거르지 않았는지, 서 있는 동안 발뒤꿈치를 수시로 들었다 내리고 있는지 확인해 보세요.","아찔하기 직전에 하품이 연달아 나오거나 속이 울렁거리고 소리가 멀게 들리는 내 몸만의 사전 경고 신호가 있었는지 떠올려 보세요."]},{"id":"syncope-20261029","partId":"syncope","partLabel":"뇌신경 · 자동조절 신경","keyword":"수면 리듬","publishDate":"2026-10-29","title":"몸은 파김치처럼 지쳤는데 왜 불만 끄고 누우면 머릿속 생각이 더 또렷해질까요?","empathy":["소파에 앉아 있을 땐 눈이 감기다가도 양치하고 침대에 딱 누우면 내일 할 일과 지난 걱정이 꼬리를 물어요.","시계를 볼수록 조바심이 나서 한두 시간씩 뒤척이다 보니 수면 리듬이 완전히 무너진 기분입니다."],"truth":["자동차가 빠르게 달리다 멈추려면 브레이크를 미리 밟아야 하듯, 낮 동안 긴장 모드로 달린 뇌도 밤잠 모드로 바뀌는 감속 시간이 필요합니다.","잠들기 직전까지 밝은 휴대폰 화면을 보거나 고민을 이어 가면 뇌는 아직 낮이라고 착각해 근육은 지쳤는데 신경만 깨어 있는 불균형에 빠집니다."],"myth":["잠이 안 올수록 침대 이불 속에서 눈을 꽉 감고 억지로 잠들려고 애써야 조금이라도 쉰다고 생각하기 쉽습니다.","20분 이상 잠이 오지 않을 때 침대에서 괴로워하면 뇌가 침대를 긴장하는 장소로 기억하므로, 은은한 조명 아래에서 잠시 숨을 고른 뒤 졸릴 때 눕는 것이 수면 리듬 회복에 좋습니다."],"check":["오늘 밤 잠자리에 들기 최소 30분 전부터 침실 천장 형광등을 끄고 노란 간접 조명만 켜 두었는지 확인해 보세요.","누운 상태에서 4초 동안 코로 숨을 들이마시고 6초 동안 입으로 천천히 내쉬며 어깨와 턱의 힘이 풀리는지 1분간 따라 해 보세요."]},{"id":"syncope-20261031","partId":"syncope","partLabel":"뇌신경 · 자동조절 신경","keyword":"가슴 두근거림","publishDate":"2026-10-31","title":"운동한 것도 아닌데 조용히 앉아 있을 때 심장 뛰는 소리가 크게 느껴지는 이유는 뭘까요?","empathy":["사무실에 가만히 앉아 있거나 밤에 자려고 옆으로 누웠을 때 심장이 쿵쾅거리는 느낌이 손끝까지 전해져요.","큰 병이 생긴 건 아닌지 놀라서 검사해 보면 특별한 이상이 없다는데 가슴 두근거림이 종종 찾아와 불안합니다."],"truth":["우리 심장은 내가 의식하지 않아도 가속 페달과 브레이크 역할을 하는 두 자동조절 신경이 번갈아 속도를 맞춰 줍니다.","과로와 수면 부족, 스트레스, 카페인이 겹치면 가속 페달 쪽으로만 무게가 쏠려 평소엔 못 느끼던 정상 박동까지 가슴 두근거림으로 크게 느껴집니다."],"myth":["가슴이 두근거릴 때마다 손목 맥박을 수시로 재며 숫자에 집중해야 안심이 된다고 생각하기 쉽습니다.","불안한 마음으로 심장 소리에 계속 귀를 기울이면 긴장 신경이 더 자극받아 박동이 빨라지므로 천천히 숨을 내쉬며 시선을 분산하는 편이 훨씬 차분해집니다."],"check":["두근거림이 느껴진 날 수면 시간이 6시간 미만이었거나 빈속에 커피·단 음료를 마시지 않았는지 먼저 짚어 보세요.","손목 주름에서 팔꿈치 쪽으로 손가락 세 마디 아래 가운데 지점을 반대쪽 엄지로 5초씩 지그시 누르며 길게 숨을 내쉬어 보세요."]},{"id":"syncope-20261102","partId":"syncope","partLabel":"뇌신경 · 자동조절 신경","keyword":"체온 조절","publishDate":"2026-11-02","title":"남들과 같은 실내에 있는데 왜 나만 손발은 얼음장 같고 얼굴로만 열이 오를까요?","empathy":["에어컨이나 난방기가 켜진 곳에 들어가면 손끝 발끝은 시린데 얼굴만 빨갛게 달아올라 불편해요.","계절이 바뀔 때마다 추위와 더위를 남들보다 유독 심하게 타서 내 몸의 체온 조절 기능이 고장 난 건 아닌지 걱정됩니다."],"truth":["피부 끝 가느다란 혈관들은 바깥 온도에 맞춰 열렸다 닫히며 내 몸의 온도를 일정하게 지켜 주는 자동 창문 역할을 합니다.","운동 부족과 만성 피로로 이 자동 창문 신경이 지치면 손발 끝 혈관은 꽉 닫히고 남은 열기가 얼굴과 가슴 쪽으로만 몰리게 됩니다."],"myth":["손발이 차가울 때는 두꺼운 수면 양말만 겹겹이 신어 외부 열기만 가두면 해결된다고 생각하기 쉽습니다.","종아리 근육을 움직여 피를 직접 끝까지 밀어 보내고 저녁에 15분 정도 발목 위까지 따뜻한 물에 담가 혈관 탄력을 깨워 주어야 체온 조절이 한결 자연스러워집니다."],"check":["오늘 하루 종아리가 살짝 뻐근할 만큼 걸었거나 제자리에서 발뒤꿈치를 스무 번 이상 들었다 내렸는지 점검해 보세요.","잠들기 전 손바닥과 발바닥의 온도 차이가 크게 느껴진다면 미지근한 물을 한 모금 마시고 발목을 천천히 돌려주어 보세요."]},{"id":"digest-20261023","partId":"digest","partLabel":"위장 · 식도 근육","keyword":"만성 소화불량","publishDate":"2026-10-23","title":"입맛 없을 때 국이나 물에 밥을 후루룩 말아 먹으면 소화가 더 잘될까요?","empathy":["바쁘거나 입이 까끌까끌한 날이면 따뜻한 국물에 밥을 말아 김치 한 점 얹어 5분 만에 식사를 끝내곤 해요.","넘어갈 땐 부드러워서 편했는데 먹고 나면 저녁때까지 명치 아래가 묵직한 만성 소화불량이 계속됩니다."],"truth":["음식을 입안에서 서른 번 가까이 꼭꼭 씹어야 침 속 천연 소화제가 골고루 섞이고 위장도 미리 움직일 준비를 합니다.","국물에 말아 씹지 않고 삼키면 큰 밥알 덩어리가 그대로 떨어지는 데다 위액까지 물에 묽어져 위장 근육이 지쳐 버리는 만성 소화불량으로 이어집니다."],"myth":["속이 불편할수록 씹는 수고를 줄이려고 매끼 묽은 국물 음식이나 물 말은 밥만 찾는 것이 위장을 아끼는 길이라 오해하기 쉽습니다.","오히려 국물은 건더기 위주로 적게 먹고 밥과 부드러운 반찬을 죽이 될 만큼 충분히 씹어 넘기는 것이 위장 부담을 절반으로 줄여 줍니다."],"check":["오늘 저녁 식사 한 끼를 끝내는 데 걸린 시간이 15분도 채 되지 않았는지 시계를 보며 속도를 점검해 보세요.","식사하는 도중에 습관적으로 물을 두세 컵씩 들이켜고 있지 않은지, 식후 1시간 뒤에 미지근한 물을 마시고 있는지 확인해 보세요."]},{"id":"digest-20261025","partId":"digest","partLabel":"위장 · 식도 근육","keyword":"목 이물감","publishDate":"2026-10-25","title":"감기도 아닌데 목구멍에 뭔가 걸린 듯 답답해 자꾸 헛기침이 나는 이유는 뭘까요?","empathy":["목 안에 작은 매실 씨앗이나 가래가 붙어 있는 것 같아 하루 종일 큼큼거리며 삼켜도 뱉어지지도 않아요.","목감기인 줄 알았는데 열도 안 나고 신경 쓰는 날이나 야식 먹은 다음 날이면 목 이물감이 더 심해집니다."],"truth":["밤늦게 음식을 먹고 눕거나 긴장으로 위장이 굳어 있으면, 위 속의 시큼한 김이 식도를 타고 목구멍 끝 여린 점막까지 살짝 올라옵니다.","연약한 목 점막이 이 자극에 놀라 살짝 부어오르면 실제로 아무것도 없는데도 무언가 걸려 있다고 느끼는 목 이물감 신호가 켜집니다."],"myth":["목에 걸린 느낌을 털어 내려고 목청껏 강하게 헛기침을 하거나 켁켁거려야 시원해진다고 생각하기 쉽습니다.","강한 헛기침은 성대와 목 점막을 서로 세게 부딪치게 만들어 부기를 더 키우므로 따뜻한 물을 한 모금 천천히 삼켜 달래 주는 편이 좋습니다."],"check":["잠자리에 눕기 전 3시간 이내에 야식이나 과일, 차가운 음료를 먹지 않았는지 오늘 밤 시간을 확인해 보세요.","아침에 일어났을 때 유독 목소리가 잠겨 있거나 입안에서 쌉싸름하고 시큼한 느낌이 들지 않는지 살펴보세요."]},{"id":"digest-20261027","partId":"digest","partLabel":"위장 · 식도 근육","keyword":"명치 답답함","publishDate":"2026-10-27","title":"위장 속은 깨끗하다는데 왜 밥만 먹으면 명치 끝이 돌덩이처럼 단단하고 막힐까요?","empathy":["속을 들여다보는 검사에서는 큰 상처가 없다는데 조금만 먹어도 윗배가 풍선처럼 차오르고 트림도 시원하게 안 나와요.","손으로 배 위쪽을 눌러 보면 단단하게 뭉친 느낌이 들고 답답한 명치 답답함 때문에 두통까지 따라옵니다."],"truth":["위장 안쪽 벽에 상처가 없더라도, 위장을 밖에서 주물러 주는 근육 층이 스트레스와 급한 식사로 차갑고 뻣뻣하게 굳어 버릴 수 있습니다.","마치 고무공이 얼어붙으면 잘 늘어나지 않는 것처럼, 위장 근육이 유연하게 움직이지 못해 음식물이 오래 머무르며 명치 답답함을 만듭니다."],"myth":["속이 답답하고 막힐 때마다 탄산음료를 마셔 억지로 트림을 빼내면 막힌 위장이 뚫린다고 믿기 쉽습니다.","차가운 탄산가스는 위장을 일시적으로 더 부풀리고 위장 입구 조임근만 느슨하게 만들어 신물 역류를 부추길 뿐입니다."],"check":["배꼽과 가슴뼈 끝의 한가운데 지점을 따뜻한 손바닥으로 살살 눌렀을 때 유독 단단하고 꾸르륵 소리가 안 나는지 확인해 보세요.","식사 직후 바로 의자에 구부정하게 앉거나 눕지 않고 집 안이라도 10분 이상 가볍게 걸어 주었는지 점검해 보세요."]},{"id":"digest-20261029","partId":"digest","partLabel":"위장 · 식도 근육","keyword":"위산 역류","publishDate":"2026-10-29","title":"아침밥 대신 마시는 시원한 커피 한 잔이 왜 가슴 타는 속쓰림을 부를까요?","empathy":["출근길 빈속에 시원한 아메리카노를 마셔야 정신이 드는데 요즘 들어 오후만 되면 앞가슴 뒤쪽이 화끈거리고 신물이 올라와요.","커피를 줄여야지 하면서도 설탕 안 든 블랙커피니까 위산 역류와는 상관없지 않을까 스스로 위안해 봅니다."],"truth":["아무것도 들어 있지 않은 빈 위장에 커피가 들어가면 위산 분비는 늘어나는 반면, 위장과 식도 사이 문을 꼭 닫아 주는 조임근의 힘은 풀려 버립니다.","뚜껑이 느슨해진 물병이 조금만 기울어도 새어 나오는 것처럼, 풀어진 문틈으로 강한 산성 액체가 넘어오며 위산 역류와 속쓰림이 생깁니다."],"myth":["속이 쓰릴 때 우유를 한 컵 마시면 위벽이 코팅되어 위산이 완전히 가라앉는다고 생각하기 쉽습니다.","우유는 마시는 순간엔 잠시 부드럽지만 우유 속 칼슘과 단백질이 잠시 뒤 위산을 다시 부르기 때문에 미지근한 물을 조금 마시는 편이 낫습니다."],"check":["아침 첫 음료로 차가운 커피 대신 체온과 비슷한 미지근한 물과 간단한 아침 식사로 위장을 먼저 보호했는지 확인해 보세요.","밤에 누웠을 때 신물이 자주 올라온다면 베개만 높이지 말고 상체 전체가 완만하게 높아지도록 누운 각도를 점검해 보세요."]},{"id":"digest-20261031","partId":"digest","partLabel":"위장 · 식도 근육","keyword":"복부 팽만감","publishDate":"2026-10-31","title":"점심만 먹고 나면 바지 단추를 풀고 싶을 만큼 배에 가스가 차는 이유는 뭘까요?","empathy":["아침엔 납작하던 배가 오후 세네 시만 되면 임산부처럼 볼록하게 부풀어 오르고 조용한 사무실에서 꾸르륵 소리가 나 민망해요.","많이 먹은 날도 아닌데 왜 이렇게 가스가 차고 복부 팽만감이 심한지 원인을 모르겠습니다."],"truth":["밀가루 면이나 빵, 단 음료처럼 장 속에서 빨리 발효되는 음식은 소화되는 과정에서 풍선을 불듯 많은 가스를 만들어 냅니다.","여기에 오래 앉아 있는 자세와 차가운 음료로 배 속 온도까지 내려가면 장의 꿈틀운동이 느려져 가스가 빠져나가지 못하고 복부 팽만감이 커집니다."],"myth":["배에 가스가 찰 때는 생채소 샐러드를 산더미처럼 많이 먹어야 장이 깨끗이 비워진다고 생각하기 쉽습니다.","장이 예민하고 차가운 상태에서 찬 생채소를 갑자기 많이 먹으면 오히려 가스가 더 생길 수 있어 살짝 데치거나 익힌 채소가 훨씬 편안합니다."],"check":["오늘 먹은 식사와 간식 중에 밀가루 면·빵이나 달콤한 유제품, 얼음 음료가 두 가지 이상 겹치지 않았는지 돌아보세요.","오늘 밤 잠자리에 누워 따뜻한 양손으로 배꼽 주변을 시계 방향으로 천천히 서른 번 쓸어 주며 배가 차갑지 않은지 확인해 보세요."]},{"id":"digest-20261102","partId":"digest","partLabel":"위장 · 식도 근육","keyword":"예민한 장","publishDate":"2026-11-02","title":"중요한 약속이나 시험 앞둔 날마다 왜 귀신같이 배가 살살 아프고 화장실을 찾게 될까요?","empathy":["집에 있을 땐 멀쩡하다가도 중요한 발표 날이나 장거리 버스만 타려 하면 아랫배가 싸르르 꼬여 화장실 위치부터 확인해요.","마음을 편히 먹으려 해도 머리보다 배가 먼저 긴장하는 예민한 장 때문에 외출이 조심스럽습니다."],"truth":["우리 장 속에는 제2의 뇌라고 부를 만큼 수많은 신경 그물이 촘촘히 깔려 있어 뇌와 실시간 직통 전화로 연결되어 있습니다.","뇌가 긴장 신호를 보내는 순간 직통 전화를 받은 예민한 장이 경련하듯 빠르게 수축하기 때문에 상한 음식을 먹지 않아도 배가 아파옵니다."],"myth":["장 신호가 자주 오는 것은 오직 내 의지가 약하고 겁이 많아서 생기는 마음의 문제라고만 자책하기 쉽습니다.","장 속 신경 자체가 남들보다 민감하게 반응하는 생리 현상이므로 자책하기보다 배를 따뜻하게 보온하고 찬 자극 음식을 피하는 생활 기준이 중요합니다."],"check":["외출 전 긴장되는 아침에 차가운 우유나 아이스 커피, 기름진 음식으로 장 신경을 먼저 자극하지 않았는지 점검해 보세요.","배가 살살 긴장될 때 아랫배에 따뜻한 온기를 대어 주며 코로 천천히 숨을 들이마시고 길게 내쉬면 꼬이던 느낌이 가라앉는지 확인해 보세요."]},{"id":"gut-20261023","partId":"gut","partLabel":"복부 · 대사 순환","keyword":"식후 혈당","publishDate":"2026-10-23","title":"똑같은 양의 밥을 먹는데도 먹는 순서만 바꾸면 뱃살이 덜 찐다는 게 사실일까요?","empathy":["식사량을 줄이려고 노력하는데도 점심만 먹고 나면 눈을 못 뜰 만큼 졸음이 쏟아지고 아랫배 둘레만 자꾸 늘어나요.","반찬과 밥을 똑같이 먹더라도 먹는 순서가 식후 혈당과 뱃살을 좌우한다니 정말인지 궁금합니다."],"truth":["빈속에 흰쌀밥이나 면부터 먼저 먹으면 당분이 핏속으로 폭포처럼 쏟아져 들어와 식후 혈당이 급격히 치솟고 남는 에너지가 고스란히 뱃살 창고로 들어갑니다.","반대로 채소와 단백질 반찬을 먼저 먹어 장 속에 그물망을 깔아 두면 뒤따라 들어오는 밥의 흡수가 완만해져 졸음과 지방 저장이 크게 줄어듭니다."],"myth":["살을 빼려면 무조건 밥그릇의 전체 열량 숫자만 계산해서 줄이면 된다고 생각하기 쉽습니다.","같은 열량이라도 채소 5분, 단백질 5분 뒤에 밥을 천천히 먹는 순서 습관이 배고픔 없이 복부 지방을 줄이는 훨씬 쉬운 지름길입니다."],"check":["오늘 저녁 식탁에서 첫 세 젓가락을 밥이나 면이 아닌 나물·채소와 두부·생선·달걀 반찬으로 먼저 시작했는지 확인해 보세요.","식사 후 30분에서 1시간 사이 참기 힘들 만큼 식곤증이 몰려오거나 곧바로 단 디저트가 당기지 않는지 살펴보세요."]},{"id":"gut-20261025","partId":"gut","partLabel":"복부 · 대사 순환","keyword":"기초대사량","publishDate":"2026-10-25","title":"하루 한 끼만 먹으며 꾹 참고 굶는데 왜 처음에만 빠지고 금방 다시 살이 찔까요?","empathy":["마음먹고 일주일 동안 샐러드 한 접시로 버텨서 2킬로그램을 뺐는데 일반식을 조금 먹자마자 그보다 더 불어났어요.","예전만큼 많이 먹지도 않는데 갈수록 살이 더 안 빠지는 체질로 변한 것 같아 기초대사량이 걱정됩니다."],"truth":["음식이 갑자기 끊기면 우리 몸은 큰 기근이 닥친 줄 알고, 에너지를 가장 많이 쓰는 근육부터 덜어 내며 소비 전력을 아끼는 절전 모드로 바뀝니다.","절전 모드로 기초대사량이 낮아진 몸은 나중에 평소 먹던 적은 양만 들어와도 다음 굶주림에 대비해 뱃살 지방으로 차곡차곡 비상 저장을 해 버립니다."],"myth":["체중계 숫자가 단기간에 빠르게 줄어들수록 지방이 성공적으로 불타고 있다고 믿기 쉽습니다.","초반에 굶어서 빠지는 무게의 대부분은 몸속 수분과 소중한 근육이므로, 세 끼 규칙적인 단백질 식사로 몸의 화로 불씨를 꺼뜨리지 말아야 합니다."],"check":["최근 식사량을 급격히 줄인 뒤로 손발이 유독 차가워지거나 계단을 오를 때 다리가 쉽게 후들거리고 피곤하지 않은지 점검해 보세요.","하루 세 끼 중 아침과 점심을 거른 채 저녁 한 끼에 몰아서 먹는 불규칙한 패턴이 반복되고 있지 않은지 돌아보세요."]},{"id":"gut-20261027","partId":"gut","partLabel":"복부 · 대사 순환","keyword":"가짜 배고픔","publishDate":"2026-10-27","title":"저녁밥을 든든히 먹었는데도 밤 10시만 넘으면 매운 야식과 단것이 미치도록 당기는 이유는 뭘까요?","empathy":["낮에는 식단 관리를 잘 참아 내다가도 밤늦게 퇴근하고 나면 배가 고픈 것도 아닌데 배달 앱을 켜고 있어요.","먹고 나서 후회하면서도 밤마다 반복되는 이 가짜 배고픔을 의지력만으로는 도저히 이기기가 힘듭니다."],"truth":["잠이 부족하고 스트레스가 쌓이면 뇌에서 배부르다는 신호는 약해지고, 당장 달고 기름진 연료를 채우라는 식욕 경보 물질이 평소보다 훨씬 많이 뿜어져 나옵니다.","위장이 비어서 울리는 진짜 허기가 아니라 지친 뇌가 즉각적인 위로를 찾으며 보내는 가짜 배고픔이기 때문에 의지 탓만 할 일이 아닙니다."],"myth":["야식 유혹은 무조건 정신력으로만 버텨야 하며 잠을 줄여서라도 밤늦게 운동을 더 해야 살이 빠진다고 생각하기 쉽습니다.","미지근한 물 한 잔을 천천히 마신 뒤 평소보다 1시간 일찍 불을 끄고 7시간 이상 푹 자는 것이 밤 식욕 스위치를 끄는 가장 확실한 방법입니다."],"check":["지금 갑자기 무언가 먹고 싶다면 30분 전에 비해 서서히 배가 고파 온 것인지, 아니면 특정 자극적인 맛만 머릿속에 떠오르는 가짜 배고픔인지 구분해 보세요.","미지근한 물 한 컵을 마시고 양치를 먼저 한 뒤 15분이 지났을 때도 여전히 배에서 꼬르륵 소리가 나는지 확인해 보세요."]},{"id":"gut-20261029","partId":"gut","partLabel":"복부 · 대사 순환","keyword":"다리 부종","publishDate":"2026-10-29","title":"아침엔 헐렁하던 신발과 바지가 저녁만 되면 꽉 끼는데, 이 붓기도 방치하면 살이 될까요?","empathy":["오후 내내 책상 앞에 앉아 일하고 퇴근할 때면 종아리가 돌처럼 탱탱해지고 양말 고무줄 자국이 한참 동안 안 사라져요.","물만 마셔도 붓는 것 같아 물도 안 마시는데 매일 반복되는 다리 부종을 어떻게 풀어야 할지 고민입니다."],"truth":["심장에서 발끝까지 내려간 혈액과 수분은 걸을 때 움직이는 종아리 근육이 펌프처럼 짜 올려 주어야 다시 위로 돌아올 수 있습니다.","오래 앉아 움직이지 않고 짠 국물 음식을 즐기면 빠져나가지 못한 노폐물 수분이 다리 조직 사이에 고이면서 무거운 다리 부종과 순환 정체를 만듭니다."],"myth":["몸이 잘 붓는 사람은 물을 마실수록 더 붓기 때문에 하루 종일 물 한 모금도 최대한 참아야 한다고 오해하기 쉽습니다.","오히려 깨끗한 물을 조금씩 자주 마셔 주어야 몸속에 고여 있던 짠 기운과 묵은 수분이 소변으로 시원하게 빠져나갑니다."],"check":["오늘 저녁 정강이뼈 앞쪽 살을 엄지손가락으로 5초간 꾹 눌렀다 떼었을 때 들어간 자국이 바로 올라오지 않고 남는지 확인해 보세요.","잠들기 전 벽에 다리를 가볍게 기대어 심장보다 조금 높게 올리고 발목을 앞뒤로 열 번 당겨 주었을 때 종아리가 한결 가벼워지는지 느껴 보세요."]},{"id":"gut-20261031","partId":"gut","partLabel":"복부 · 대사 순환","keyword":"내장지방","publishDate":"2026-10-31","title":"밥은 반 공기만 먹는데 식후 마시는 달콤한 음료 한 잔이 왜 뱃살로 직행할까요?","empathy":["살을 빼려고 점심밥은 꼭 절반씩 남기면서 입가심으로 달콤한 라떼나 과일주스 한 잔은 별생각 없이 마셨어요.","씹어 먹는 음식이 아니니 괜찮을 줄 알았는데 팔다리는 그대로인데 배만 볼록 나오는 내장지방이 늘었습니다."],"truth":["씹지 않고 마시는 액체 속 설탕과 시럽은 소화 과정을 거칠 틈도 없이 순식간에 흡수되어 간으로 한꺼번에 몰려갑니다.","미처 쓰이지 못한 당분을 간이 급하게 지방 방울로 바꾸어 장기 사이사이에 차곡차곡 쌓아 두기 때문에 밥 한 숟가락보다 음료를 줄여야 내장지방이 빠집니다."],"myth":["생과일을 갈아 만든 주스나 무가당 요구르트 음료는 모두 자연식품이라 아무리 마셔도 뱃살이 찌지 않는다고 믿기 쉽습니다.","과일도 믹서기에 갈아 마시면 흡수를 늦춰 주는 섬유질 그물이 끊어져 당분이 빠르게 올라가므로 음료 대신 생과일 두세 쪽을 천천히 씹어 먹는 편이 좋습니다."],"check":["오늘 하루 마신 음료 중 순수한 물과 보리차·잎차를 제외하고 단맛이 나는 음료나 믹스커피가 몇 잔이었는지 손가락으로 세어 보세요.","배에 힘을 뺀 채 줄자로 배꼽 높이 허리둘레를 재어 보았을 때 남성 90센티미터, 여성 85센티미터 기준선에 가까워지지 않았는지 확인해 보세요."]},{"id":"gut-20261102","partId":"gut","partLabel":"복부 · 대사 순환","keyword":"야간 공복","publishDate":"2026-11-02","title":"저녁 마지막 숟가락을 내려놓는 시간만 당겨도 자는 동안 지방이 타기 시작할까요?","empathy":["퇴근이 늦다 보니 밤 9시 넘어 저녁을 먹고 소화가 다 되기도 전에 자정 무렵 잠자리에 드는 날이 많아요.","따로 운동할 시간을 내기 힘든데 저녁 식사 마감 시간을 지켜 야간 공복을 확보하는 것만으로 몸이 가벼워질지 궁금합니다."],"truth":["마지막 식사를 마친 뒤 약 12시간 동안 아무것도 먹지 않는 시간이 지나야 우리 몸은 비로소 뱃속에 쌓아 둔 지방 창고를 열어 에너지로 쓰기 시작합니다.","저녁 7시 전에 식사를 마치고 다음 날 아침 7시까지 편안한 야간 공복을 지켜 주면 자는 동안 위장은 쉬고 대사 청소 스위치가 자연스럽게 켜집니다."],"myth":["공복 시간이 무조건 길수록 좋다고 생각해 18시간 이상 무리하게 굶다가 첫 끼니에 폭식하는 실수를 하기 쉽습니다.","무리한 장시간 단식보다 누구나 매일 꾸준히 지킬 수 있는 12~14시간의 밤 비움 시간과 아침 단백질 식사가 몸의 균형에 훨씬 이롭습니다."],"check":["어젯밤 마지막으로 음식(과일·견과류·음료 포함)을 삼킨 시각부터 오늘 아침 첫 식사까지 몇 시간의 비움 시간이 있었는지 계산해 보세요.","야간 비움 시간을 지킨 다음 날 아침 눈을 떴을 때 손가락 반지나 얼굴 윤곽이 평소보다 한결 가볍고 개운한지 직접 비교해 보세요."]},{"id":"uterus-20261023","partId":"uterus","partLabel":"아랫배 · 골반 순환","keyword":"생리통","publishDate":"2026-10-23","title":"한겨울에도 얼음 음료를 찾는 습관, 매달 찾아오는 아랫배 통증과 관련이 있을까요?","empathy":["답답할 때마다 얼음이 가득 든 음료를 마시는데 그날만 되면 아랫배를 쥐어짜는 듯 아파 진통제 없이는 버티기 힘들어요.","원래 체질려니 하고 넘겼는데 배가 차가울수록 생리통과 덩어리진 혈이 심해진다는 말에 습관을 돌아보게 됩니다."],"truth":["아랫배 속 온도가 내려가면 골반 안쪽을 흐르는 가느다란 혈관들이 추위에 움츠러들듯 좁아져 산소와 혈액 전달이 원활하지 못하게 됩니다.","순환이 막힌 아랫배 근육은 밖으로 내보내야 할 혈을 밀어내느라 평소보다 훨씬 더 강하게 쥐어짜기 때문에 찌르는 듯한 생리통이 커집니다."],"myth":["그날의 통증은 여성이라면 누구나 매달 당연하게 참고 견뎌야 하는 통과의례라고만 생각하기 쉽습니다.","일상생활을 멈춰야 할 만큼 통증이 점점 심해지거나 진통제 개수가 늘어난다면 아랫배 보온과 골반 순환 상태를 반드시 세심하게 돌보아야 합니다."],"check":["오늘 밤 손바닥을 배꼽 바로 아래 아랫배에 대어 보았을 때 명치나 가슴보다 유독 서늘하게 느껴지지 않는지 확인해 보세요.","그날이 다가오는 일주일 전부터라도 얼음 음료 대신 따뜻한 물과 발목 위까지 덮는 양말로 온기를 지켜 주고 있는지 점검해 보세요."]},{"id":"uterus-20261025","partId":"uterus","partLabel":"아랫배 · 골반 순환","keyword":"골반 순환","publishDate":"2026-10-25","title":"몸매를 잡아 주는 꽉 끼는 바지와 보정 속옷이 왜 아랫배를 더 묵직하게 만들까요?","empathy":["옷맵시를 위해 허리와 골반을 단단히 조여 주는 바지를 입고 퇴근하면 사타구니에 깊은 자국이 남고 아랫배가 더부룩해요.","오후만 되면 다리도 잘 붓고 분비물까지 신경 쓰이는데 골반 순환이 막혀서 그런 건지 궁금합니다."],"truth":["사타구니와 아랫배는 하체에서 심장으로 올라가는 큰 혈관과 순환 통로가 지나는 가장 중요한 길목입니다.","이 길목을 하루 종일 고무줄과 단단한 옷감으로 꽉 조여 두면 골반 안쪽에 피가 고여 묵직해지고 건강한 골반 순환과 쾌적한 환경이 무너지기 쉽습니다."],"myth":["배를 강하게 압박하는 보정 속옷을 매일 입어야 아랫배 근육에 힘이 들어가고 체형이 예뻐진다고 믿기 쉽습니다.","외부 압박으로 숨쉬기조차 불편하게 조이면 오히려 배 속 깊은 근육의 자연스러운 힘은 약해지고 순환만 정체됩니다."],"check":["저녁에 옷을 갈아입을 때 허리선과 사타구니 주변에 붉게 눌린 자국이 30분 이상 선명하게 남아 있지 않은지 살펴보세요.","집에 머무는 시간과 잠잘 때만이라도 조임 없는 순면 소재의 넉넉한 옷을 입고 나비 자세로 골반을 부드럽게 열어 주고 있는지 확인해 보세요."]},{"id":"uterus-20261027","partId":"uterus","partLabel":"아랫배 · 골반 순환","keyword":"아랫배 보온","publishDate":"2026-10-27","title":"소중한 아기를 기다리는 시기, 영양제만큼이나 중요한 아랫배와 밤잠 기준은 무엇일까요?","empathy":["임신을 준비하며 좋다는 영양제는 여러 가지 챙겨 먹고 있는데 정작 손발과 아랫배는 늘 얼음장처럼 차가워요.","밤늦게까지 일하고 잠도 불규칙한데 일상에서 아랫배 보온과 컨디션을 어떻게 다져야 할지 막막합니다."],"truth":["씨앗이 싹을 틔우려면 햇볕을 머금은 폭신하고 따뜻한 흙이 필요하듯, 아기집 역시 따뜻한 피가 풍성하게 돌 때 가장 포근한 이불처럼 준비됩니다.","꾸준한 아랫배 보온과 밤 11시 이전의 깊은 잠은 세포를 지키는 밤 호르몬을 채워 주어 부부 모두의 건강한 생체 리듬을 돕습니다."],"myth":["아랫배를 따뜻하게 해야 한다며 시기를 가리지 않고 매일 아주 뜨거운 열탕이나 고온 찜질방에 오래 들어가 있는 경우가 있습니다.","지나친 고온 사우나보다 평소 배꼽 아래를 포근히 덮어 주고 하루 20분 햇볕 아래를 걸으며 골반 피가 스스로 돌게 하는 것이 훨씬 안전하고 자연스럽습니다."],"check":["뜨거운 배달 음식을 일회용 플라스틱 용기째로 먹지 않고 유리나 도자기 그릇에 옮겨 담아 환경호르몬 노출을 줄이고 있는지 점검해 보세요.","잠들기 전 부부가 함께 휴대폰을 내려놓고 따뜻한 물로 발목을 데운 뒤 자정 전에 편안히 숙면에 들고 있는지 확인해 보세요."]},{"id":"uterus-20261029","partId":"uterus","partLabel":"아랫배 · 골반 순환","keyword":"생리 전 증후군","publishDate":"2026-10-29","title":"매달 그날 일주일 전만 되면 몸이 붓고 작은 일에도 울컥하는 건 마음 탓일까요?","empathy":["달력을 보기도 전에 가슴이 팽팽해지고 손발이 부으면서 평소엔 웃어넘기던 말에도 눈물이나 짜증이 먼저 나요.","단 과자가 멈출 수 없이 당기다 막상 그날이 시작되면 거짓말처럼 가라앉는 생리 전 증후군이 매달 버겁습니다."],"truth":["매달 주기가 바뀌는 일주일 전에는 몸속 호르몬 파도가 크게 출렁이면서 기분을 차분하게 잡아 주는 뇌 신경 전달 물질도 함께 흔들립니다.","동시에 몸이 수분을 붙잡아 두려는 성질이 강해져 실제 체중이 1~2킬로그램 늘고 붓는 자연스러운 생리 전 증후군 변화가 나타납니다."],"myth":["이 시기에 단 초콜릿과 짠 음식이 당긴다고 마음껏 먹으면 기분이 끝까지 좋아질 것이라 기대하기 쉽습니다.","설탕과 짠 음식은 혈당을 급하게 출렁이게 하고 붓기를 더 키워 오후에 감정 기복과 피로감을 두 배로 깊어지게 만듭니다."],"check":["그날 일주일 전부터 짠 국물과 카페인 음료를 절반으로 줄이고 바나나·견과류·두부처럼 신경을 안정시키는 간식으로 바꾸었는지 확인해 보세요.","몸이 무겁고 예민한 시기임을 스스로 인정하고 저녁 일정을 여유 있게 비워 평소보다 30분 일찍 잠자리에 들었는지 돌아보세요."]},{"id":"uterus-20261031","partId":"uterus","partLabel":"아랫배 · 골반 순환","keyword":"산후 관절 관리","publishDate":"2026-10-31","title":"출산하고 몇 달이 지났는데도 에어컨 바람만 스치면 손목과 발목이 시린 이유는 뭘까요?","empathy":["아기를 안고 수유하느라 손목이 시큰거리는 데다 선풍기나 찬 바람만 닿아도 뼈마디 속으로 찬 기운이 스며드는 것 같아요.","겉으로 보기엔 멀쩡해서 남들은 잘 모르는데 산후 관절 관리가 덜 된 건지 계절 바뀔 때마다 걱정됩니다."],"truth":["출산을 위해 골반과 온몸의 관절 마디를 부드럽게 늘려 주었던 호르몬의 영향은 아이를 낳은 뒤에도 수개월 동안 서서히 제자리로 돌아갑니다.","아직 느슨하게 열려 있는 관절 마디에 무거운 하중과 찬 바람이 겹치면 작은 근육과 신경이 쉽게 시리고 아픈 신호를 보내므로 세심한 산후 관절 관리가 필요합니다."],"myth":["산후 몸조리는 무조건 방 안 온도를 한증막처럼 높여 진땀을 뻘뻘 흘려야만 찬 기운이 빠진다고 오해하기 쉽습니다.","과하게 땀을 흘린 뒤 식는 과정에서 오히려 한기가 들기 쉬우므로, 땀이 맺히지 않을 정도의 포근한 실내 온도와 얇은 긴소매·양말 착용이 훨씬 중요합니다."],"check":["아기를 안거나 젖병을 들 때 손목만 꺾어 힘을 쓰지 않고 팔뚝과 몸통 전체로 받쳐 손목 부담을 덜어 주고 있는지 확인해 보세요.","실내에서도 맨발로 차가운 바닥을 디디지 않도록 발목까지 올라오는 부드러운 양말을 챙겨 신고 있는지 오늘 바로 점검해 보세요."]},{"id":"uterus-20261102","partId":"uterus","partLabel":"아랫배 · 골반 순환","keyword":"생리 불순","publishDate":"2026-11-02","title":"매달 시계처럼 정확하던 주기가 갑자기 한두 달씩 밀리거나 앞당겨지는 건 왜일까요?","empathy":["야근이 이어지거나 살을 급하게 뺀 달에는 어김없이 날짜가 훌쩍 지나가 버려 달력을 볼 때마다 마음이 조마조마해요.","한두 번쯤은 그럴 수 있다지만 생리 불순이 반복되니 내 몸 안의 균형이 무너진 건 아닌지 신경 쓰입니다."],"truth":["매달 규칙적인 주기를 지휘하는 본부는 아랫배가 아니라 우리 뇌 한가운데 있는 아주 섬세한 생체 시계 센터입니다.","밤잠이 뒤바뀌거나 극심한 스트레스, 급격한 체중 변화를 겪으면 뇌 본부가 지금은 몸을 먼저 지킬 때라고 판단해 주기 신호를 잠시 늦추며 생리 불순이 나타납니다."],"myth":["주기가 몇 달씩 건너뛰어도 통증이 없고 일상생활이 편하니 오히려 좋은 일이라며 대수롭지 않게 넘기기 쉽습니다.","규칙적인 주기는 여성의 전반적인 호르몬과 뼈, 혈관 건강을 보여 주는 소중한 성적표이므로 세 달 이상 어긋난다면 생활 리듬부터 차분히 바로잡아야 합니다."],"check":["최근 석 달 동안 몸무게가 갑자기 3~5킬로그램 이상 변했거나 밤 12시 이후에 잠드는 날이 일주일의 절반을 넘지 않았는지 돌아보세요.","스마트폰 달력이나 수첩에 최근 6개월간의 시작일과 기간, 컨디션 변화를 꾸준히 기록해 내 몸의 주기를 알고 있는지 확인해 보세요."]},{"id":"prostate-20261023","partId":"prostate","partLabel":"방광 · 골반 바닥근육","keyword":"야간뇨","publishDate":"2026-10-23","title":"잠든 뒤 새벽마다 소변 마려워 한두 번씩 꼭 깨는 습관, 물 마시는 시간 때문일까요?","empathy":["초저녁엔 피곤해서 금방 잠드는데 새벽 두세 시쯤 소변 신호 때문에 눈이 떠지면 그 뒤로 아침까지 뒤척이게 돼요.","나이 들면 다 겪는 일이라지만 매일 밤 야간뇨로 깊은 잠이 끊기니 낮 동안 피로가 가시질 않습니다."],"truth":["낮에는 소변을 모아 두는 방광 주머니가 넉넉하게 늘어나고 밤에는 소변 양을 줄여 주는 밤 호르몬이 나와 아침까지 통잠을 지켜 줍니다.","하지만 저녁 늦게 물이나 과일, 차를 많이 먹거나 골반 아래 순환이 차가워지면 방광이 작은 양에도 예민하게 신호를 울려 야간뇨가 반복됩니다."],"myth":["건강을 위해 하루 물 2리터를 채워야 한다며 낮에 못 마신 물을 퇴근 후 저녁과 잠들기 직전에 몰아서 마시는 경우가 많습니다.","하루 필요한 수분은 오전과 오후 5시 이전에 충분히 나누어 마시고 저녁 7시 이후에는 목만 축일 정도로 줄여야 밤새 방광이 편안히 쉽니다."],"check":["어제 저녁 식사 이후에 수박·참외·귤 같은 수분 많은 과일이나 국물, 차를 무심코 드시지 않았는지 떠올려 보세요.","잠자리에 눕기 바로 직전 화장실에 들러 방광을 한 번 가볍게 비워 두는 습관을 오늘 밤 실천해 보세요."]},{"id":"prostate-20261025","partId":"prostate","partLabel":"방광 · 골반 바닥근육","keyword":"잔뇨감","publishDate":"2026-10-25","title":"하루 종일 의자에 앉아 일한 날일수록 왜 소변을 봐도 끝이 개운하지 않고 묵직할까요?","empathy":["화장실에 다녀와 바지를 입자마자 아직 조금 남은 것처럼 찝찝하고 다리 사이 골반 아래쪽이 뻐근해요.","장거리 운전을 하거나 오래 앉아 회의한 날 저녁이면 유독 잔뇨감이 심해져 신경이 곤두섭니다."],"truth":["딱딱한 의자에 몇 시간씩 앉아 있으면 상체 몸무게가 고스란히 소변 길이 지나가는 골반 맨 아래쪽 근육과 혈관을 짓누르게 됩니다.","눌려서 피가 고이고 붓기가 생긴 소변 길 주변은 실제로는 소변이 거의 비워졌는데도 무언가 차 있는 듯 착각해 묵직한 잔뇨감 신호를 보냅니다."],"myth":["남은 소변을 마지막 한 방울까지 다 짜내야 개운하다며 변기 앞에서 아랫배에 잔뜩 힘을 주어 억지로 밀어내려 하기 쉽습니다.","억지로 배에 힘을 주면 오히려 골반 바닥 근육이 더 긴장해 소변 길이 좁아지므로, 편안히 숨을 내쉬며 자연스럽게 비워 내는 것이 좋습니다."],"check":["오늘 하루 한 번도 일어나지 않고 의자에 연달아 1시간 이상 앉아 골반 아래쪽을 압박하지 않았는지 점검해 보세요.","저녁에 38~40도 정도의 따뜻한 물로 10분간 아랫배와 엉덩이 아래를 데워 주었을 때 묵직하던 긴장이 부드럽게 풀리는지 확인해 보세요."]},{"id":"prostate-20261027","partId":"prostate","partLabel":"방광 · 골반 바닥근육","keyword":"과민성 방광","publishDate":"2026-10-27","title":"외출만 하면 화장실 위치부터 찾게 되는 급한 소변 신호, 방광이 작아진 걸까요?","empathy":["물 흐르는 소리만 들어도 갑자기 신호가 오고 영화관이나 고속버스를 탈 때면 혹시 실수할까 봐 통로 쪽 자리만 골라 앉아요.","막상 화장실에 가 보면 양은 얼마 되지도 않는데 왜 이렇게 자주 급해지는 과민성 방광 증상이 생겼는지 답답합니다."],"truth":["방광의 실제 크기가 줄어든 것이 아니라, 방광 벽의 감각 신경이 예민해져서 소변이 절반도 안 찼는데 벌써 가득 찼다고 잘못된 경보를 울리는 상태입니다.","특히 커피의 카페인과 술, 탄산음료는 예민해진 방광 벽을 직접 콕콕 찌르는 자극제 역할을 해 과민성 방광 신호를 더욱 재촉합니다."],"myth":["급한 신호가 두려워 아직 마렵지도 않은데 30분마다 미리 화장실에 들러 소변을 비우는 습관이 안전하다고 생각하기 쉽습니다.","너무 자주 미리 비우면 방광이 소변을 넉넉히 담아 두는 연습 기회를 잃어 오히려 더 적은 양에도 신호를 보내게 됩니다."],"check":["하루 동안 낮에 소변보러 가는 횟수가 8번을 훌쩍 넘으면서 그때마다 마신 커피나 차, 탄산음료가 있지 않았는지 세어 보세요.","갑자기 급한 신호가 올 때 당황해 뛰어가기보다, 제자리에 잠시 서서 항문과 요도 주변 근육을 5초간 지그시 조이며 숨을 고르면 급한 느낌이 가라앉는지 확인해 보세요."]},{"id":"prostate-20261029","partId":"prostate","partLabel":"방광 · 골반 바닥근육","keyword":"골반 바닥 근육","publishDate":"2026-10-29","title":"재채기하거나 크게 웃을 때 아차 싶게 새는 불편함, 어떻게 골반 힘을 되찾을 수 있을까요?","empathy":["감기 걸려 기침할 때나 친구들과 박장대소할 때, 줄넘기처럼 살짝 뛰는 동작만 해도 속옷이 젖을까 봐 움츠러들어요.","누구에게 말하기도 부끄러워 혼자 속앓이만 하는데 집에서 골반 바닥 근육 힘을 기르는 정확한 기준이 궁금합니다."],"truth":["우리 골반 맨 아래에는 방광과 소변 길을 해먹처럼 탄탄하게 받쳐 주는 골반 바닥 근육이 자리 잡고 있습니다.","출산이나 나이에 따른 근력 감소로 이 해먹이 느슨해지면 기침으로 배에 압력이 순간 가해질 때 소변 문을 끝까지 잡아 주지 못하게 됩니다."],"myth":["소변을 보는 도중에 중간에 힘을 주어 소변 줄기를 끊는 연습을 매일 반복하면 근육이 빨리 단련된다고 오해하기 쉽습니다.","배뇨 도중에 억지로 끊는 행동은 오히려 방광이 소변을 다 못 비우게 방해하므로, 반드시 평상시 화장실 밖에서 근육만 조였다 푸는 연습을 해야 합니다."],"check":["엉덩이나 허벅지, 아랫배에는 힘을 빼고 오직 소변이나 방귀를 참을 때 쓰는 안쪽 골반 바닥 근육만 5초간 당겨 올렸다 5초간 푸는 동작이 분리되어 되는지 느껴 보세요.","재채기나 기침이 나오려 하기 직전 1초 전에 먼저 골반 아래쪽을 가볍게 조여 주는 습관을 오늘부터 연습해 보세요."]},{"id":"prostate-20261031","partId":"prostate","partLabel":"방광 · 골반 바닥근육","keyword":"배뇨 불편","publishDate":"2026-10-31","title":"날씨가 추워지거나 코감기약을 먹은 날 유독 소변 줄기가 가늘어지는 이유는 뭘까요?","empathy":["찬 바람 부는 계절만 되면 화장실 서 있는 시간도 길어지고 소변이 한참 뜸을 들였다가 힘없이 나와요.","특히 코막힘 약을 먹은 날 저녁엔 배뇨 불편이 갑자기 심해져서 깜짝 놀란 적이 있습니다."],"truth":["기온이 뚝 떨어지면 우리 몸의 긴장 신경이 활발해지면서 소변 길 입구를 둘러싼 근육까지 추위에 움츠러들듯 좁아집니다.","여기에 콧물을 말려 주는 일부 감기약 성분이 소변 문을 조이는 근육까지 함께 수축시키면 평소보다 갑작스러운 배뇨 불편이 나타날 수 있습니다."],"myth":["소변이 시원하게 안 나올 때는 맥주처럼 이뇨 작용이 강한 찬 술을 많이 마셔 한꺼번에 밀어내면 뚫린다고 생각하기 쉽습니다.","차가운 알코올은 소변 양만 급격히 늘리는 동시에 소변 길 주변 조직을 붓게 만들어 오히려 길을 더 꽉 막히게 할 위험이 큽니다."],"check":["평소 소변 줄기가 약한 분이라면 감기약을 복용하기 전에 약 봉투의 주의사항을 살피고 소변 불편 이력을 미리 알리고 있는지 확인해 보세요.","추운 아침이나 저녁에 외출할 때 내복이나 따뜻한 하의로 아랫배와 허리 아래 온기를 충분히 지켜 주고 있는지 점검해 보세요."]},{"id":"prostate-20261102","partId":"prostate","partLabel":"방광 · 골반 바닥근육","keyword":"하체 순환","publishDate":"2026-11-02","title":"허벅지와 엉덩이 근육을 움직이는 걷기 운동이 왜 밤 시간 방광 건강까지 편하게 해 줄까요?","empathy":["은퇴 후나 재택근무로 집에만 머물며 걷는 시간이 확 줄어든 뒤부터 화장실 가는 횟수가 부쩍 늘었어요.","다리 운동과 소변 건강이 무슨 상관이 있을까 싶었는데 하체 순환이 좋아져야 밤잠도 편해진다는 말이 흥미롭습니다."],"truth":["허벅지와 엉덩이의 큰 근육들은 골반 안쪽 방광과 그 주변 기관으로 신선한 피를 보내 주는 가장 힘센 이웃 엔진입니다.","낮 동안 걷기와 가벼운 앉았다 일어서기로 하체 순환을 깨워 두면 낮에 다리에 고였던 여분의 수분이 미리 빠져나가 밤에 생기는 소변 양도 한결 줄어듭니다."],"myth":["골반 건강에 좋다며 안장이 좁고 딱딱한 자전거를 하루 한두 시간씩 쉬지 않고 타는 것이 가장 좋다고 믿기 쉽습니다.","좁은 안장에 회음부가 오래 눌리면 오히려 소변 길 신경에 부담을 줄 수 있어, 편안한 운동화를 신고 평지를 활기차게 걷는 것이 훨씬 유익합니다."],"check":["오늘 낮 동안 햇볕을 쬐며 20분 이상 보폭을 넓혀 걸었거나 의자를 잡고 천천히 앉았다 일어서는 동작을 열다섯 번 해 보았는지 확인해 보세요.","잠들기 전 발바닥 앞쪽 오목한 가운데 지점을 양손 엄지로 5초씩 지그시 눌러 발끝이 따뜻하게 풀리는지 점검해 보세요."]}];

      gut:       { pos3D: [-0.08, 3.06,  0.08], camPos: [ 0.16, 3.08, 2.08], camTarget: [0.00, 3.06,  0.02] },
      uterus:    { pos3D: [-0.10, 2.44,  0.05], camPos: [ 0.00, 2.44, 1.75], camTarget: [0.00, 2.42,  0.00] },
      prostate:  { pos3D: [ 0.10, 2.26,  0.05], camPos: [ 0.00, 2.28, 1.72], camTarget: [0.00, 2.26,  0.00] }
    };

    function getTodayKst() {
      try {
        return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul' }).format(new Date());
      } catch (e) {
        return new Date(Date.now() + 9 * 3600 * 1000).toISOString().slice(0, 10);
      }
    }

    function computeNextUpdateKst(todayStr) {
      const anchor = Date.parse('2026-10-23T00:00:00Z');
      const cur = Date.parse(todayStr + 'T00:00:00Z');
      if (isNaN(cur) || cur < anchor) return '2026-10-23';
      const diffDays = Math.floor((cur - anchor) / 86400000);
      const addDays = (diffDays % 2 === 0) ? 2 : 1;
      return new Date(cur + addDays * 86400000).toISOString().slice(0, 10);
    }

    function fmtDotDate(d) {
      return String(d || '').replace(/-/g, '.');
    }

    function escHtml(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // 보이지 않는 내부 3단계 자가 검수 게이트 (UI에는 검수 문구 비노출)
    function passThreeStageGate(note) {
      if (!note || !note.title || !String(note.title).includes('?')) return false;
      if (!Array.isArray(note.empathy) || note.empathy.length < 2) return false;
      if (!Array.isArray(note.truth) || note.truth.length < 2) return false;
      if (!Array.isArray(note.myth) || note.myth.length < 2) return false;
      if (!Array.isArray(note.check) || note.check.length < 2) return false;
      const all = [note.title, ...note.empathy, ...note.truth, ...note.myth, ...note.check].join(' ');
      for (const w of FORBIDDEN_PROMO) { if (all.includes(w)) return false; }
      for (const j of FORBIDDEN_JARGON) { if (all.includes(j)) return false; }
      return true;
    }

    let todayKst = getTodayKst();
    let nextUpdateKst = computeNextUpdateKst(todayKst);
    let dynamicNotes = [];
    let isPopupOpen = false;
    let currentPartId = earlyParams.get('part') || 'knee';
    let currentMenuTab = 0; // 0: 오늘의 건강 글(1개 노출), 1: 무엇이든 물어보세요, 2: 더 궁금하세요?(누적 글 목록)
    let archiveScope = 'part'; // 'part' | 'all'
    let selectedArchiveNoteId = null;
    let qnaCacheByPart = {};

    const popupDrawer = document.getElementById('encyclopedia-scroll-panel');
    const contentBox = document.getElementById('encyclopedia-dynamic-content');

    const canvas = document.getElementById('vibrant-body-canvas');
    const hotspotLayer = document.getElementById('hotspot-overlay-layer');
    const loaderOverlay = document.getElementById('dongin-loader-overlay');

    function getPartById(id) {
      return BODY_PARTS_DATA.find(p => p.id === id) || BODY_PARTS_DATA[0];
    }

    function getMenuMeta(id) {
      return CLINIC_MENUS.find(m => m.id === id) || CLINIC_MENUS[0];
    }

    function normalizeDynamicNote(raw) {
      if (!raw || typeof raw !== 'object') return null;
      return {
        id: raw.id,
        partId: raw.partId || 'knee',
        partLabel: raw.partLabel || '무릎 성장판',
        keyword: raw.keyword || '',
        publishDate: raw.publishDate || todayKst,
        title: raw.title || raw.questionTitle || '',
        empathy: raw.empathy || raw.empathyLines || [],
        truth: raw.truth || raw.truthLines || [],
        myth: raw.myth || raw.mythLines || [],
        check: raw.check || raw.checkList || []
      };
    }

    function getPublishedNotes(partFilter) {
      const mergedMap = new Map();
      for (const n of SEED_NOTES) {
        if (passThreeStageGate(n)) mergedMap.set(n.id, n);
      }
      for (const raw of dynamicNotes) {
        const n = normalizeDynamicNote(raw);
        if (n && passThreeStageGate(n)) mergedMap.set(n.id, n);
      }
      const list = Array.from(mergedMap.values()).filter(n => {
        if (n.publishDate && n.publishDate > todayKst) return false;
        if (partFilter && partFilter !== 'all' && n.partId !== partFilter) return false;
        return true;
      });
      list.sort((a, b) => {
        if (b.publishDate !== a.publishDate) return b.publishDate.localeCompare(a.publishDate);
        return String(b.id).localeCompare(String(a.id));
      });
      return list;
    }

    // 최종 출력 양식 (테마 행 제거 & 하단 검수 문구 제거 · 순수 본문만 출력)

    let applyCameraFraming = function() {};

                  '<span class="archive-part-pill">[' + escHtml(n.partLabel) + ']</span>' +

                '<div class="archive-card-title">&ldquo;' + escHtml(n.title) + '&rdquo;</div>' +

          activeBodyHtml =
            '<div class="archive-menu-panel">' +
              '<div class="archive-filter-bar">' +
                '<div>' +
                  '<div style="font-size:0.72rem;font-weight:800;color:#967128;margin-bottom:2px;">2일 주기 자동 누적 아카이브</div>' +
                  '<h2 style="font-size:1.12rem;font-weight:800;color:#0D0D0F;">더 궁금하세요?</h2>' +

                '<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">' +

                    '<button type="button" class="archive-scope-btn' + (archiveScope === 'all' ? ' active' : '') + '" onclick="window.setArchiveScope(\'all\')">전체 부위 (' + allNotes.length + ')</button>' +

      contentBox.innerHTML =
        '<div class="popup-shell-wrap">' +
          '<nav class="three-menu-nav" role="tablist" aria-label="정보 팝업 3대 메뉴">' +
            '<button type="button" class="three-menu-btn' + (currentMenuTab === 0 ? ' active' : '') + '" onclick="window.switchPopupMenu(0)">' +
              '<span class="tmb-step">01 · 최신 글 1편</span>' +
              '<span class="tmb-label">오늘의 건강 글</span>' +
            '</button>' +
            '<button type="button" class="three-menu-btn' + (currentMenuTab === 1 ? ' active' : '') + '" onclick="window.switchPopupMenu(1)">' +
              '<span class="tmb-step">02 · 1:1 질문</span>' +
              '<span class="tmb-label">무엇이든 물어보세요</span>' +
            '</button>' +
            '<button type="button" class="three-menu-btn' + (currentMenuTab === 2 ? ' active' : '') + '" onclick="window.switchPopupMenu(2)">' +
              '<span class="tmb-step">03 · 누적 ' + partNotes.length + '편</span>' +
              '<span class="tmb-label">더 궁금하세요?</span>' +
            '</button>' +
          '</nav>' +
          activeBodyHtml +
        '</div>';
    }

    window.switchPopupMenu = function(tabIdx) {
      currentMenuTab = tabIdx;
      if (tabIdx !== 2) selectedArchiveNoteId = null;
      renderPopupPanel();
    };

    window.setArchiveScope = function(scope) {
      archiveScope = scope;
      selectedArchiveNoteId = null;
      renderPopupPanel();
    };

    window.openArchivedNote = function(noteId) {
      selectedArchiveNoteId = noteId;
      renderPopupPanel();
    };

    window.backToArchiveList = function() {
      selectedArchiveNoteId = null;
      renderPopupPanel();
    };

    window.closeInfoPopup = function() {
      selectedArchiveNoteId = null;
      renderIdleState();
      if (typeof window.resetDonginView === 'function') {
        window.resetDonginView();
      }
      if (typeof majorHotspotNodes !== 'undefined' && Array.isArray(majorHotspotNodes)) {
        majorHotspotNodes.forEach(h => h.dom.classList.remove('active'));
      }
    };

    // 백엔드(/wp-json/bareun/v1/body-notes)에서 2일 주기 동적 신규 글 실시간 동기화
    async function syncLiveServerNotes() {
      try {
        const res = await fetch('/wp-json/bareun/v1/body-notes', { cache: 'no-store' });
        if (!res.ok) return;
        const data = await res.json();
        if (data && data.ok) {
          if (data.todayKst) todayKst = data.todayKst;
          if (data.nextUpdateKst) nextUpdateKst = data.nextUpdateKst;
          if (Array.isArray(data.notes) && data.notes.length > 0) {
            dynamicNotes = data.notes;
          }
          if (isPopupOpen) renderPopupPanel();
          else renderIdleState();
        }
      } catch (e) {}
    }

    if (earlyParams.get('part')) {
      renderPopupPanel();
    } else {
      renderIdleState();
    }
    syncLiveServerNotes();

    setTimeout(() => {
      if (loaderOverlay) loaderOverlay.classList.add('hidden');
    }, 2400);

    // ========================================================================
    // 2. 3D WEBGL SCENE & LIFELIKE NATURAL ORGAN SHADERS (#1, #2, #3, #6, #8, #9)
    // ========================================================================
    const [THREE, { GLTFLoader }, { DRACOLoader }, { OrbitControls }] = await Promise.all([
      import('https://esm.sh/three@0.166.0'),
      import('https://esm.sh/three@0.166.0/examples/jsm/loaders/GLTFLoader.js'),
      import('https://esm.sh/three@0.166.0/examples/jsm/loaders/DRACOLoader.js'),
      import('https://esm.sh/three@0.166.0/examples/jsm/controls/OrbitControls.js')
    ]);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 2000);
    camera.setFocalLength(38);
    camera.position.set(0.0, 2.28, 5.65);

    const renderer = new THREE.WebGLRenderer({
      canvas: canvas,
      powerPreference: 'high-performance',
      antialias: true,
      alpha: true
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.toneMapping = THREE.NoToneMapping;

    const controls = new OrbitControls(camera, canvas);
    controls.target.set(0.0, 2.26, 0.0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.maxDistance = 7.5;
    controls.minDistance = 0.70;
    controls.maxPolarAngle = Math.PI * 0.82;
    controls.minPolarAngle = Math.PI * 0.18;

    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('draco/');
    const gltfLoader = new GLTFLoader();
    gltfLoader.setDRACOLoader(dracoLoader);

    // 2.1 Smooth Porcelain Mannequin Shader
    function createStylizedPorcelainBodyMaterial() {
      return new THREE.ShaderMaterial({
        uniforms: {
          uHighlightCol: { value: new THREE.Color('#FAF6EC') },
          uMidCol:       { value: new THREE.Color('#EFE6D5') },
          uRimCol:       { value: new THREE.Color('#D2C2A8') },
          uOutlineCol:   { value: new THREE.Color('#6E5844') },
          uCenterAlpha:  { value: 0.88 }
        },
        vertexShader: [
          'varying vec3 vNormal;',
          'varying vec3 vViewDir;',
          'varying vec3 vWorldPos;',
          'void main() {',
          '  vec4 worldPos = modelMatrix * vec4(position, 1.0);',
          '  vWorldPos = worldPos.xyz;',
          '  vec4 mvPos = viewMatrix * worldPos;',
          '  vViewDir = normalize(-mvPos.xyz);',
          '  vNormal = normalize(normalMatrix * normal);',
          '  gl_Position = projectionMatrix * mvPos;',
          '}'
        ].join(' '),
        fragmentShader: [
          'uniform vec3 uHighlightCol;',
          'uniform vec3 uMidCol;',
          'uniform vec3 uRimCol;',
          'uniform vec3 uOutlineCol;',
          'uniform float uCenterAlpha;',
          'varying vec3 vNormal;',
          'varying vec3 vViewDir;',
          'varying vec3 vWorldPos;',
          'void main() {',
          '  vec3 N = normalize(vNormal);',
          '  vec3 V = normalize(vViewDir);',
          '  vec3 L = normalize(vec3(0.42, 0.78, 0.68));',
          '  float faceMask = smoothstep(3.96, 4.10, vWorldPos.y) * (1.0 - smoothstep(4.40, 4.54, vWorldPos.y));',
          '  vec3 smoothFaceN = normalize(vec3(N.x * 0.92, N.y * 0.35, max(abs(N.z), 0.66)));',
          '  vec3 effN = normalize(mix(N, smoothFaceN, faceMask * 0.84));',
          '  float NdotL = dot(effN, L) * 0.5 + 0.5;',
          '  float NdotV = clamp(abs(dot(effN, V)), 0.0, 1.0);',
          '  float toonBand = smoothstep(0.38, 0.46, NdotL);',
          '  vec3 baseCol = mix(uMidCol, uHighlightCol, toonBand);',
          '  float rim = 1.0 - NdotV;',
          '  float rimBand = smoothstep(0.54, 0.74, rim);',
          '  float inkOutline = smoothstep(0.80, 0.90, rim);',
          '  vec3 col = mix(baseCol, uRimCol, rimBand * 0.60);',

    // 2.2 Smooth Lifelike Cel-Shaded Clay Shader for Organs & Bones (#6)
    function createToonClayMaterial(hiHex, midHex, shdHex, outHex, initialOpacity = 0.96, smoothFactor = 0.72) {
      return new THREE.ShaderMaterial({
        uniforms: {
          uHigh:    { value: new THREE.Color(hiHex) },
          uMid:     { value: new THREE.Color(midHex) },
          uShadow:  { value: new THREE.Color(shdHex) },
          uOutline: { value: new THREE.Color(outHex) },
          uOpacity: { value: initialOpacity },
          uCenter:  { value: new THREE.Vector3(0, 0, 0) },
          uSmooth:  { value: smoothFactor }
        },
        vertexShader: [
          'uniform vec3 uCenter;',
          'varying vec3 vNormal;',
          'varying vec3 vRadial;',
          'varying vec3 vViewDir;',
          'void main() {',
          '  vec4 mvPos = modelViewMatrix * vec4(position, 1.0);',
          '  vViewDir = normalize(-mvPos.xyz);',
          '  vNormal = normalize(normalMatrix * normal);',
          '  vec3 radLocal = position - uCenter;',
          '  float rLen = length(radLocal);',
          '  vRadial = rLen > 0.0001 ? normalize(normalMatrix * (radLocal / rLen)) : vNormal;',
          '  gl_Position = projectionMatrix * mvPos;',
          '}'
        ].join(' '),
        fragmentShader: [
          'uniform vec3 uHigh;',
          'uniform vec3 uMid;',
          'uniform vec3 uShadow;',
          'uniform vec3 uOutline;',
          'uniform float uOpacity;',
          'uniform float uSmooth;',
          'varying vec3 vNormal;',
          'varying vec3 vRadial;',
          'varying vec3 vViewDir;',
          'void main() {',
          '  vec3 N = normalize(mix(normalize(vNormal), normalize(vRadial), uSmooth));',
          '  vec3 V = normalize(vViewDir);',
          '  vec3 L = normalize(vec3(0.38, 0.72, 0.68));',
          '  float nl = dot(N, L) * 0.5 + 0.5;',
          '  float nv = clamp(abs(dot(N, V)), 0.0, 1.0);',
          '  float band1 = smoothstep(0.35, 0.42, nl);',
          '  float band2 = smoothstep(0.65, 0.72, nl);',
          '  vec3 col = mix(uShadow, uMid, band1);',
          '  col = mix(col, uHigh, band2);',
          '  vec3 H = normalize(L + V);',
          '  float spec = smoothstep(0.90, 0.95, max(0.0, dot(N, H)));',
          '  col = mix(col, vec3(0.99, 0.98, 0.95), spec * 0.45);',
          '  float ink = smoothstep(0.75, 0.87, 1.0 - nv);',
          '  col = mix(col, uOutline, ink * 0.70);',
          '  gl_FragColor = vec4(col, uOpacity);',
          '}'
        ].join(' '),
        transparent: true,
        depthWrite: true
      });
    }
