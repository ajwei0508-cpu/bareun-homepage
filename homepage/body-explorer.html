        },
        vertexShader: [
          'varying vec3 vNormal;',
          'varying vec3 vViewDir;',
          'varying vec3 vLocalPos;',
          'void main() {',
          '  vLocalPos = position;',
          '  vec4 mvPos = modelViewMatrix * vec4(position, 1.0);',
          '  vViewDir = normalize(-mvPos.xyz);',
          '  vNormal = normalize(normalMatrix * normal);',
          '  gl_Position = projectionMatrix * mvPos;',
          '}'
        ].join(' '),
        fragmentShader: [
          'uniform vec3 uHigh;',
          'uniform vec3 uMid;',
          'uniform vec3 uShadow;',
          'uniform vec3 uOutline;',
          'uniform float uOpacity;',
          'varying vec3 vNormal;',
          'varying vec3 vViewDir;',
          'varying vec3 vLocalPos;',
          'void main() {',
          '  if (vLocalPos.y > 1.92 && vLocalPos.y < 2.38 && abs(vLocalPos.x) < 0.092) discard;',
          '  vec3 N = normalize(vNormal);',
          '  vec3 V = normalize(vViewDir);',
          '  vec3 L = normalize(vec3(0.38, 0.72, 0.68));',
          '  float nl = dot(N, L) * 0.5 + 0.5;',
          '  float nv = clamp(abs(dot(N, V)), 0.0, 1.0);',
          '  vec3 col = mix(uShadow, uMid, smoothstep(0.35, 0.44, nl));',
          '  col = mix(col, uHigh, smoothstep(0.65, 0.74, nl));',
          '  col = mix(col, uOutline, smoothstep(0.74, 0.86, 1.0 - nv) * 0.65);',
          '  gl_FragColor = vec4(col, uOpacity);',
          '}'
        ].join(' '),
        transparent: true,
        depthWrite: true
      });
    }

    let vascularGroup = null;
    gltfLoader.load('models/Vascular.glb', (gltf) => {
      vascularGroup = gltf.scene;
      vascularGroup.visible = false;
      const artMat = createVascularMaterial('#E8645E', '#C43B35', '#8C1F1B', '#4D0E0B', 0.88);
      const venMat = createVascularMaterial('#6BA3EB', '#3E76C2', '#224C87', '#112A4D', 0.85);
      vascularGroup.traverse(c => {
        if (c.isMesh) {
          c.material = (c.name || '').includes('Venous') ? venMat : artMat;
          c.renderOrder = 5;
        }
      });
      scene.add(vascularGroup);
      updateAnatomyHighlight();
    });

    function createAutonomicNerve3DGroup() {
      const group = new THREE.Group();
      const nerveMat = createToonClayMaterial('#FFF099', '#F2C94C', '#C49416', '#6E4F04', 0.98, 0.20);

      // Brainstem Autonomic Center & Solar/Cardiac Plexus Nodes
      [
        [0.0, 4.10, -0.02, 0.024], // Brainstem Medulla Autonomic Center
        [0.03, 3.52, 0.04, 0.020], // Cardiac Plexus
        [0.0, 3.12, 0.03, 0.022],  // Celiac / Solar Plexus
        [0.0, 2.48, 0.02, 0.018]   // Pelvic Autonomic Plexus
      ].forEach(([x, y, z, r]) => {
        const node = new THREE.Mesh(new THREE.SphereGeometry(r, 20, 20), nerveMat);
        node.position.set(x, y, z);
        node.renderOrder = 8;
        group.add(node);
      });

      // Left & Right Vagus Nerve + Sympathetic Chains + Lower Limb Autonomic Nerves
      [-1, 1].forEach(dir => {
        const vagusPath = new THREE.CatmullRomCurve3([
          new THREE.Vector3(dir * 0.022, 4.12, -0.02),
          new THREE.Vector3(dir * 0.038, 3.85,  0.00),
          new THREE.Vector3(dir * 0.042, 3.52,  0.03),
          new THREE.Vector3(dir * 0.028, 3.12,  0.03),
          new THREE.Vector3(dir * 0.035, 2.75,  0.01),
          new THREE.Vector3(dir * 0.045, 2.45,  0.00),
          new THREE.Vector3(dir * 0.115, 1.85, -0.04),
          new THREE.Vector3(dir * 0.145, 1.20, -0.08),
          new THREE.Vector3(dir * 0.155, 0.55, -0.08)
        ]);
        const vagusMesh = new THREE.Mesh(new THREE.TubeGeometry(vagusPath, 64, 0.0075, 12, false), nerveMat);
        vagusMesh.renderOrder = 8;
        group.add(vagusMesh);

        // Upper limb brachial autonomic branch
        const armPath = new THREE.CatmullRomCurve3([
          new THREE.Vector3(dir * 0.040, 3.78,  0.00),
          new THREE.Vector3(dir * 0.180, 3.62, -0.02),
          new THREE.Vector3(dir * 0.310, 3.15, -0.03),
          new THREE.Vector3(dir * 0.420, 2.55,  0.02)
        ]);
        const armMesh = new THREE.Mesh(new THREE.TubeGeometry(armPath, 32, 0.0055, 10, false), nerveMat);
        armMesh.renderOrder = 8;
        group.add(armMesh);
      });

      scene.add(group);
      return group;
    }
    const autonomicNerveGroup = createAutonomicNerve3DGroup();

    // Heart-Brain Golden Vitality Stream for Emperor Gongjindan (#8)
    function createGongjindanBridgeGroup() {
      const group = new THREE.Group();
      const goldMat = createToonClayMaterial('#FFF2A6', '#E5B842', '#AD8018', '#5E4306', 0.95, 0.20);
      [-1, 1].forEach(dir => {
        const curve = new THREE.CatmullRomCurve3([
          new THREE.Vector3(dir * 0.025, 3.52, 0.04),
          new THREE.Vector3(dir * 0.048, 3.88, 0.02),
          new THREE.Vector3(dir * 0.032, 4.26, 0.00)
        ]);
        const m = new THREE.Mesh(new THREE.TubeGeometry(curve, 32, 0.007, 12, false), goldMat);
        m.renderOrder = 7;
        group.add(m);
      });
      scene.add(group);
      return group;
    }
    const gongjindanBridgeGroup = createGongjindanBridgeGroup();

    // ========================================================================
    // 3. 9 BALANCED HOTSPOTS ON THE 3D BODY
    // ========================================================================
    const LEFT_ALIGNED_PARTS = ['cervical', 'gut', 'uterus'];
    const HOTSPOT_3D_ANCHORS = {
      syncope:    [ 0.08, 4.34,  0.04],
      cervical:   [-0.08, 3.92,  0.04],
      gongjindan: [ 0.08, 3.52,  0.08],
      digest:     [ 0.08, 3.22,  0.08],
      gut:        [-0.08, 3.06,  0.08],
      lumbar:     [ 0.08, 2.76,  0.04],
      uterus:     [-0.10, 2.44,  0.05],
      prostate:   [ 0.10, 2.24,  0.05],
      knee:       [ 0.16, 1.20,  0.05]
    };

    const majorHotspotNodes = [];
    BODY_PARTS_DATA.forEach((part) => {
      const anchor = HOTSPOT_3D_ANCHORS[part.id] || [0, 3.0, 0];
      const isLeft = LEFT_ALIGNED_PARTS.includes(part.id);
      const dom = document.createElement('div');
      dom.className = 'body-3d-hotspot' + (isLeft ? ' align-left' : '') + (part.id === currentPartId ? ' active' : '');
      dom.innerHTML =
        '<div class="hotspot-pulse-ring">' +
          '<div class="hotspot-core-dot"></div>' +
          '<div class="hotspot-core-dot"></div>' +
          '<div class="hotspot-core-dot"></div>' +
        '</div>' +
        '<div class="hotspot-tag-pill">' + part.hotspotLabel + '</div>';
      dom.addEventListener('click', () => window.selectBodyPart(part.id, true));
      hotspotLayer.appendChild(dom);
      majorHotspotNodes.push({
        id: part.id,
        part: part,
        dom: dom,
        worldPos: new THREE.Vector3(...anchor)
      });
    });

    // ========================================================================
    // 4. CAMERA FLY-TO, RESET VIEW ("원위치"), & PART-SPECIFIC 3D GRAPHICS
    // ========================================================================
    const DEFAULT_CAM_POS = new THREE.Vector3(0.0, 2.28, 5.65);
    const DEFAULT_CAM_TARGET = new THREE.Vector3(0.0, 2.26, 0.0);
    const camGoalPos = DEFAULT_CAM_POS.clone();
    const camGoalTarget = DEFAULT_CAM_TARGET.clone();
    let isCameraFlying = false;
    let isOverviewCamera = true;

    controls.addEventListener('start', () => {
      isCameraFlying = false;
    });

    function updateAnatomyHighlight() {
      // 1) Special 3D Groups: Uterus (#2), Prostate (#1), Syncope Vessels & Nerves (#9), Gongjindan Bridge (#8)
      uterus3D.group.visible = (currentPartId === 'uterus') || (isOverviewCamera && currentPartId !== 'syncope');
      prostate3D.group.visible = (currentPartId === 'prostate');
      if (vascularGroup) vascularGroup.visible = (currentPartId === 'syncope');
      autonomicNerveGroup.visible = (currentPartId === 'syncope');
      gongjindanBridgeGroup.visible = (currentPartId === 'gongjindan');

      // 2) Spine, Pelvis, Knee & Intervertebral Discs (#3)
      const boneHighlightMap = {
        knee:       ['KneeJointBones', 'KneeGrowthPlate', 'LowerLimbs'],
        cervical:   ['CervicalSpine'],
        lumbar:     ['LumbarSpine', 'Pelvis'],
        gongjindan: ['CervicalSpine'],
        syncope:    [],
        digest:     ['LumbarSpine'],
        gut:        ['LumbarSpine'],
        uterus:     ['Pelvis', 'LumbarSpine'],
        prostate:   ['Pelvis', 'LumbarSpine']
      };
      const activeBones = boneHighlightMap[currentPartId] || [];

      Object.keys(boneIllustrationMap).forEach(gName => {
        const entry = boneIllustrationMap[gName];
        if (gName.includes('KneeGrowthPlate')) {
          entry.mesh.visible = true;
          return;
        }
        const isMatched = (isOverviewCamera && currentPartId !== 'syncope') || activeBones.some(b => gName.includes(b));
        entry.mat.uniforms.uOpacity.value = isMatched ? 0.94 : 0.25;
        entry.mat.depthWrite = isMatched;
      });

      if (spinalDiscs3D && spinalDiscs3D.group) {
        const showDiscs = (isOverviewCamera && currentPartId !== 'syncope') || ['lumbar', 'cervical', 'uterus', 'prostate'].includes(currentPartId);
        spinalDiscs3D.group.visible = showDiscs;
        const discAlpha = (currentPartId === 'lumbar' || currentPartId === 'cervical') ? 0.98 : 0.85;
        spinalDiscs3D.mats.forEach(m => { m.uniforms.uOpacity.value = discAlpha; });
      }

      // 3) Natural Colored Internal Organs (#6, #8)
      const OVERVIEW_ORGANS = ['brain', 'heart', 'liver', 'stomach', 'intestine', 'kidneys'];
      Object.keys(loadedOrgans).forEach(key => {
        const entry = loadedOrgans[key];
        const isTarget = entry.cfg.parts.includes(currentPartId);
        if (isOverviewCamera && currentPartId !== 'syncope') {
          entry.scene.visible = OVERVIEW_ORGANS.includes(key);
          entry.mat.uniforms.uOpacity.value = 0.95;
          entry.mat.depthWrite = true;
        } else if (currentPartId === 'syncope') {
          entry.scene.visible = (key === 'brain' || key === 'heart');
          entry.mat.uniforms.uOpacity.value = 0.94;
          entry.mat.depthWrite = true;
        } else {
          entry.scene.visible = isTarget;
          entry.mat.uniforms.uOpacity.value = isTarget ? 0.97 : 0.0;
          entry.mat.depthWrite = isTarget;
        }
      });
    }

    window.selectBodyPart = function(partId, shouldFlyCamera = true, keepCurrentTab = false) {
      const part = getPartById(partId);
      currentBlogArticleId = null;
      const targetTabIdx = (keepCurrentTab || currentSlideIdx === part.slides.length) ? part.slides.length : 0;
      renderEncyclopedia(part.id, targetTabIdx, 'next');

      // Automatically switch mannequin gender for Uterus (female) vs Prostate (male) if appropriate
      if (part.id === 'uterus') {
        window.setDonginGender('female');
      } else if (part.id === 'prostate') {
        window.setDonginGender('male');
      }

      const preset = PART_CAMERA_PRESETS[part.id];
      if (preset && shouldFlyCamera) {
        isOverviewCamera = (part.id === 'syncope');
        camGoalPos.set(...preset.camPos);
        camGoalTarget.set(...preset.camTarget);
        isCameraFlying = true;
      }

      majorHotspotNodes.forEach(h => {
        h.dom.classList.toggle('active', h.id === part.id);
      });

      updateAnatomyHighlight();
    };

    window.setDonginGender = function(gender) {
      currentGender = gender;
      document.getElementById('btn-gender-male')?.classList.toggle('active', gender === 'male');
      document.getElementById('btn-gender-female')?.classList.toggle('active', gender === 'female');
      if (maleBodyObj) maleBodyObj.visible = (gender === 'male');
      if (femaleBodyObj) femaleBodyObj.visible = (gender === 'female');
    };

    // Single Reset View ("원위치") Button (#5)
    window.resetDonginView = function() {
      isOverviewCamera = true;
      isCameraFlying = true;
      camGoalPos.copy(DEFAULT_CAM_POS);
      camGoalTarget.copy(DEFAULT_CAM_TARGET);
      updateAnatomyHighlight();
    };

    quickNavButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        window.selectBodyPart(btn.getAttribute('data-part'), true);
      });
    });

    function resizeRenderer() {
      if (!stageEl) return;
      const w = Math.max(320, stageEl.clientWidth || Math.round(window.innerWidth * 0.44));
      const h = Math.max(320, stageEl.clientHeight || (window.innerHeight - 62));
      renderer.setSize(w, h, false);
      const aspect = w / Math.max(1, h);
      camera.aspect = aspect;
      const focal = aspect < 0.72 ? Math.max(22, 38 * (aspect / 0.72)) : 38;
      camera.setFocalLength(focal);
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resizeRenderer);
    if (window.ResizeObserver && stageEl) {
      new ResizeObserver(() => resizeRenderer()).observe(stageEl);
    }
    resizeRenderer();

    // ========================================================================
    // 5. RENDER LOOP (STATIC HEART, SMOOTH CAMERA FLY-TO, IDEA B SVG SPOKE LINES)
    // ========================================================================
    const projVec = new THREE.Vector3();
    const hubStageEl = document.getElementById('idea-b-hub-stage');
    const hubSpokeSvg = document.getElementById('hub-spoke-svg');
    const spokeElements = {};

    if (hubSpokeSvg) {
      const svgNS = 'http://www.w3.org/2000/svg';
      Object.keys(PART_CAMERA_PRESETS).forEach(partKey => {
        const pathEl = document.createElementNS(svgNS, 'path');
        pathEl.setAttribute('class', 'hub-spoke-line');
        const dotEl = document.createElementNS(svgNS, 'circle');
        dotEl.setAttribute('class', 'hub-spoke-dot');
        dotEl.setAttribute('r', '4');
        hubSpokeSvg.appendChild(pathEl);
        hubSpokeSvg.appendChild(dotEl);
        spokeElements[partKey] = {
          pathEl,
          dotEl,
          anchorEl: document.querySelector('.hub-card-anchor[data-anchor-part="' + partKey + '"]')
        };
      });
    }

    function animate() {
      requestAnimationFrame(animate);

      if (isCameraFlying) {
        camera.position.lerp(camGoalPos, 0.08);
        controls.target.lerp(camGoalTarget, 0.09);
        if (camera.position.distanceTo(camGoalPos) < 0.012) {
          isCameraFlying = false;
        }
      }
      controls.update();

      const w = stageEl.clientWidth;
      const h = stageEl.clientHeight;
      const showSpokes = hubStageEl && hubSpokeSvg && window.innerWidth > 1240;
      let hubRect = null;
      let stageRect = null;
      if (showSpokes) {
        hubRect = hubStageEl.getBoundingClientRect();
        stageRect = stageEl.getBoundingClientRect();
        hubSpokeSvg.setAttribute('viewBox', '0 0 ' + Math.round(hubRect.width) + ' ' + Math.round(hubRect.height));
      }

      majorHotspotNodes.forEach(item => {
        projVec.copy(item.worldPos).project(camera);
        if (projVec.z > 1.0) {
          item.dom.style.opacity = '0';
          return;
        }
        const sx = (projVec.x * 0.5 + 0.5) * w;
        const sy = (-projVec.y * 0.5 + 0.5) * h;
        item.dom.style.left = sx.toFixed(1) + 'px';
        item.dom.style.top = sy.toFixed(1) + 'px';
        const inBounds = (sx > 16 && sx < w - 16 && sy > 28 && sy < h - 38);
        item.dom.style.opacity = inBounds ? '1' : '0';

        if (showSpokes && spokeElements[item.id] && spokeElements[item.id].anchorEl) {
          const sp = spokeElements[item.id];
          const anchorRect = sp.anchorEl.getBoundingClientRect();
          const x1 = (stageRect.left - hubRect.left) + sx;
          const y1 = (stageRect.top - hubRect.top) + sy;
          const x2 = (anchorRect.left - hubRect.left) + anchorRect.width * 0.5;
          const y2 = (anchorRect.top - hubRect.top) + anchorRect.height * 0.5;
          const isLeftCard = x2 < x1;
          const elbowX = isLeftCard
            ? (stageRect.left - hubRect.left) + 18
            : (stageRect.right - hubRect.left) - 18;
          const isActive = (item.id === currentPartId);

          sp.pathEl.setAttribute(
            'd',
            'M ' + x1.toFixed(1) + ' ' + y1.toFixed(1) +
            ' L ' + elbowX.toFixed(1) + ' ' + y1.toFixed(1) +
            ' L ' + elbowX.toFixed(1) + ' ' + y2.toFixed(1) +
            ' L ' + x2.toFixed(1) + ' ' + y2.toFixed(1)
          );
          sp.pathEl.setAttribute('class', 'hub-spoke-line' + (isActive ? ' active' : ''));
          sp.dotEl.setAttribute('cx', x1.toFixed(1));
          sp.dotEl.setAttribute('cy', y1.toFixed(1));
          sp.dotEl.setAttribute('r', isActive ? '5.5' : '3.5');
          sp.dotEl.setAttribute('class', 'hub-spoke-dot' + (isActive ? ' active' : ''));
        }
      });

      renderer.render(scene, camera);
    }

    const params = new URLSearchParams(window.location.search);
    const urlPart = params.get('part');
    const urlWantsBlog = (params.get('tab') === 'blog' || params.get('blog') === '1');
    if (urlPart) {
      window.selectBodyPart(urlPart, true, urlWantsBlog);
    } else {
      window.selectBodyPart('knee', false, urlWantsBlog);
      window.resetDonginView();
    }
    if (urlWantsBlog) {
      window.openDiseaseBlogTab();
    }
    animate();
  })();
  </script>
</body>
</html>
