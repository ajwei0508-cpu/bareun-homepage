<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>바른한의원 | 3D 인체 질환 · 치료 · 홈케어 쇼룸</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Noto+Serif+KR:wght@500;600;700;800&family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
/* WORDPRESS & ASTRA THEME CONTAINER RESET */
.site-header, .site-footer, #masthead, #colophon, .entry-header, .ast-breadcrumbs-wrapper { display: none !important; }
.entry-content, .ast-container, .site-content, article.page, .ast-plain-container,
.elementor, .elementor-section-wrap, .wp-block-group {
  padding: 0 !important;
  margin: 0 !important;
  max-width: 100% !important;
  width: 100% !important;
  overflow: visible !important;
}

    :root {
      --bg-beige: #F5F1E8;
      --bg-beige-deep: #EBE4D5;
      --bg-white: #FFFFFF;
      --brown-deep: #3A2A1E;
      --brown-mid: #5E4736;
      --brown-soft: #8A7460;
      --green-primary: #2D5A43;
      --green-mid: #4B8567;
      --green-soft: #68A684;
      --green-tint: #E8F2EC;
      --black-ink: #171614;
      --black-sub: #45413C;
      --border-warm: #DFD6C5;
      --border-strong: #C9BTA8;
      --shadow-soft: 0 12px 34px rgba(58, 42, 30, 0.06);
      --shadow-card: 0 6px 20px rgba(58, 42, 30, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg-beige);
      color: var(--black-ink);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* =========================================================================
       1. TOP HEADER BAR (8 CLINIC PARTS QUICK NAV)
       ========================================================================= */
    .vibrant-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 62px;
      z-index: 300;
      background: rgba(245, 241, 232, 0.96);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-warm);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      gap: 12px;
    }

    .vh-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--black-ink);
      flex-shrink: 0;
    }

    .vh-brand-mark {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: var(--green-primary);
      color: var(--bg-white);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Noto Serif KR', serif;
      font-weight: 800;
      font-size: 0.92rem;
    }

    .vh-brand-title {
      font-family: 'Noto Serif KR', serif;
      font-weight: 800;
      font-size: 0.98rem;
      color: var(--black-ink);
    }

    .vh-part-quicknav {
      display: flex;
      align-items: center;
      gap: 5px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 4px 0;
    }
    .vh-part-quicknav::-webkit-scrollbar { display: none; }

    .vh-part-chip {
      appearance: none;
      border: 1px solid var(--border-warm);
      background: var(--bg-white);
      color: var(--brown-mid);
      font-family: 'Pretendard', sans-serif;
      font-size: 0.74rem;
      font-weight: 700;
      padding: 6px 11px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .vh-part-chip:hover {
      border-color: var(--green-primary);
      color: var(--green-primary);
    }
    .vh-part-chip.active {
      background: var(--green-primary);
      border-color: var(--green-primary);
      color: var(--bg-white);
      box-shadow: 0 4px 12px rgba(45, 90, 67, 0.22);
    }

    .vh-right-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .vh-pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 13px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      text-decoration: none;
      border: 1px solid var(--border-warm);
      background: var(--bg-white);
      color: var(--brown-deep);
      transition: all 0.2s ease;
    }
    .vh-pill-btn.primary {
      background: var(--brown-deep);
      border-color: var(--brown-deep);
      color: var(--bg-white);
    }

    /* =========================================================================
       2. SPLIT WORKSPACE: LEFT 3D STAGE (43%) + RIGHT PAGINATED SLIDE & SCI RAIL (57%)
       ========================================================================= */
    .vibrant-workspace {
      display: grid;
      grid-template-columns: 43% 57%;
      width: 100%;
      min-height: 100vh;
      padding-top: 62px;
    }

    .vibrant-3d-stage {
      position: sticky;
      top: 62px;
      height: calc(100vh - 62px);
      background: radial-gradient(circle at 50% 42%, #FAF7F0 0%, #EFE9DA 68%, #E4DCCB 100%);
      border-right: 1px solid var(--border-warm);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      user-select: none;
    }

    #vibrant-body-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 2;
      cursor: grab;
    }
    #vibrant-body-canvas:active { cursor: grabbing; }

    .stage-top-badge {
      position: relative;
      z-index: 25;
      margin: 16px 20px 0;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid var(--border-warm);
      box-shadow: var(--shadow-card);
      width: fit-content;
      pointer-events: none;
    }

    .stage-top-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green-primary);
    }

    .stage-top-text {
      font-size: 0.76rem;
      font-weight: 800;
      color: var(--brown-deep);
    }

    /* Bottom Control Bar: ONLY Gender Toggle + Reset View ("원위치") */
    .stage-bottom-bar {
      position: relative;
      z-index: 25;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid var(--border-warm);
      box-shadow: var(--shadow-soft);
    }

    .stage-ctrl-btn {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--brown-mid);
      font-family: 'Pretendard', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 6px 13px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .stage-ctrl-btn:hover {
      color: var(--black-ink);
      background: var(--bg-beige);
    }
    .stage-ctrl-btn.active {
      background: var(--green-primary);
      color: var(--bg-white);
    }
    .stage-ctrl-btn.reset-btn {
      background: var(--brown-deep);
      color: var(--bg-white);
    }
    .stage-ctrl-btn.reset-btn:hover {
      background: var(--green-primary);
    }

    /* 2D Overlay Layer for 8 Organ Hotspots */
    #hotspot-overlay-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 20;
      overflow: hidden;
    }

    .body-3d-hotspot {
      position: absolute;
      transform: translate(-12px, -50%);
      pointer-events: auto;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .body-3d-hotspot.align-left {
      flex-direction: row-reverse;
      transform: translate(calc(-100% + 12px), -50%);
    }

    .body-3d-hotspot:hover { z-index: 40; }

    .hotspot-pulse-ring {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.96);
      border: 1.5px solid var(--brown-mid);
      box-shadow: 0 4px 10px rgba(58, 42, 30, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      flex-shrink: 0;
      transition: all 0.22s ease;
    }

    .hotspot-core-dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--brown-deep);
    }

    .body-3d-hotspot.active .hotspot-pulse-ring {
      background: var(--green-primary);
      border-color: var(--bg-white);
      box-shadow: 0 0 0 4px rgba(45, 90, 67, 0.2), 0 4px 14px rgba(45, 90, 67, 0.3);
    }
    .body-3d-hotspot.active .hotspot-core-dot {
      background: var(--bg-white);
    }

    .hotspot-tag-pill {
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid var(--border-warm);
      color: var(--brown-deep);
      font-size: 0.71rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      white-space: nowrap;
      box-shadow: var(--shadow-card);
      transition: all 0.2s ease;
    }
    .body-3d-hotspot:hover .hotspot-tag-pill {
      border-color: var(--green-primary);
      color: var(--green-primary);
    }
    .body-3d-hotspot.active .hotspot-tag-pill {
      background: var(--brown-deep);
      border-color: var(--brown-deep);
      color: var(--bg-white);
    }

    /* Loader */
    #dongin-loader-overlay {
      position: absolute;
      inset: 0;
      z-index: 60;
      background: rgba(245, 241, 232, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    #dongin-loader-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .loader-spinner {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 3px solid var(--border-warm);
      border-top-color: var(--green-primary);
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* =========================================================================
       3. RIGHT PANEL: SELECTABLE SLIDE DECK + COMPACT SCI PAPER SIDEBAR
       ========================================================================= */
    .encyclopedia-scroll-panel {
      width: 100%;
      height: calc(100vh - 62px);
      overflow-y: auto;
      padding: 26px 32px 40px;
      background: var(--bg-beige);
      display: flex;
      flex-direction: column;
    }

    /* Top Title Header */
    .encyc-part-header {
      padding-bottom: 16px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border-warm);
    }

    .encyc-part-kicker {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.09em;
      color: var(--green-primary);
      background: var(--green-tint);
      padding: 4px 11px;
      border-radius: 999px;
      margin-bottom: 8px;
    }

    .encyc-part-title {
      font-family: 'Noto Serif KR', serif;
      font-size: clamp(1.35rem, 1.9vw, 1.75rem);
      font-weight: 800;
      color: var(--black-ink);
      letter-spacing: -0.02em;
      line-height: 1.28;
    }

    .encyc-part-lead {
      margin-top: 6px;
      font-size: 0.86rem;
      line-height: 1.6;
      color: var(--black-sub);
      word-break: keep-all;
    }

    /* Step Selector Bar (4 Selectable Pages per Condition) */
    .slide-tabs-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .slide-tabs-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .slide-step-tab {
      appearance: none;
      border: 1px solid var(--border-warm);
      background: var(--bg-white);
      color: var(--brown-mid);
      font-family: 'Pretendard', sans-serif;
      font-size: 0.78rem;
      font-weight: 800;
      padding: 8px 15px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.22s ease;
    }
    .slide-step-tab:hover {
      border-color: var(--green-primary);
      color: var(--green-primary);
    }
    .slide-step-tab.active {
      background: var(--brown-deep);
      border-color: var(--brown-deep);
      color: var(--bg-white);
      box-shadow: 0 4px 12px rgba(58, 42, 30, 0.18);
    }

    .slide-page-counter {
      font-size: 0.76rem;
      font-weight: 800;
      color: var(--brown-soft);
      padding: 5px 12px;
      border-radius: 999px;
      background: var(--bg-beige-deep);
    }

    /* 2-Column Content Area: [Interactive Slide Card (70%)] + [Compact SCI Paper Side Rail (30%)] */
    .encyc-main-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 235px;
      gap: 18px;
      align-items: start;
      flex: 1;
    }

    /* Animated Slide Deck Container */
    .slide-stage-card {
      background: var(--bg-white);
      border: 1px solid var(--border-warm);
      border-radius: 20px;
      padding: 20px 22px;
      box-shadow: var(--shadow-soft);
      overflow: hidden;
      position: relative;
    }

    /* Page Transition Animations (#7-3) */
    @keyframes slideMotionNext {
      0% { opacity: 0; transform: translateX(34px) scale(0.985); }
      100% { opacity: 1; transform: translateX(0) scale(1); }
    }
    @keyframes slideMotionPrev {
      0% { opacity: 0; transform: translateX(-34px) scale(0.985); }
      100% { opacity: 1; transform: translateX(0) scale(1); }
    }
    .slide-anim-next {
      animation: slideMotionNext 0.42s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .slide-anim-prev {
      animation: slideMotionPrev 0.42s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* Soft Editorial Illustration Banner blended with Slide Header (#7-2) */
    .slide-visual-banner {
      display: grid;
      grid-template-columns: 185px 1fr;
      gap: 16px;
      align-items: center;
      background: var(--bg-beige);
      border: 1px solid var(--border-warm);
      border-radius: 15px;
      padding: 12px 16px;
      margin-bottom: 16px;
    }

    .slide-illust-thumb {
      width: 100%;
      height: 112px;
      object-fit: cover;
      border-radius: 11px;
      border: 1px solid var(--border-warm);
      background: #EFE9DC;
      display: block;
    }

    .slide-banner-badge {
      display: inline-block;
      font-size: 0.69rem;
      font-weight: 800;
      color: var(--green-primary);
      background: var(--green-tint);
      padding: 3px 9px;
      border-radius: 999px;
      margin-bottom: 6px;
    }

    .slide-banner-heading {
      font-family: 'Noto Serif KR', serif;
      font-size: 1.08rem;
      font-weight: 800;
      color: var(--black-ink);
      line-height: 1.35;
      margin-bottom: 5px;
      word-break: keep-all;
    }

    .slide-banner-summary {
      font-size: 0.81rem;
      line-height: 1.55;
      color: var(--black-sub);
      word-break: keep-all;
    }

    /* 3 Concise Core Cards per Slide (#7-1) */
    .slide-cards-stack {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .concise-point-card {
      background: #FAF8F3;
      border: 1px solid var(--border-warm);
      border-left: 4px solid var(--green-primary);
      border-radius: 13px;
      padding: 12px 16px;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .concise-point-card:hover {
      transform: translateX(3px);
      border-color: var(--green-primary);
    }

    .cpc-tag {
      font-size: 0.7rem;
      font-weight: 800;
      color: var(--brown-mid);
      margin-bottom: 3px;
    }

    .cpc-title {
      font-size: 0.92rem;
      font-weight: 800;
      color: var(--black-ink);
      margin-bottom: 4px;
      word-break: keep-all;
    }

    .cpc-desc {
      font-size: 0.81rem;
      line-height: 1.54;
      color: var(--black-sub);
      word-break: keep-all;
    }

    /* Slide Bottom Pagination & Clinic Link Bar */
    .slide-footer-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-top: 12px;
      border-top: 1px solid var(--border-warm);
      flex-wrap: wrap;
    }

    .slide-arrow-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .slide-nav-btn {
      appearance: none;
      border: 1px solid var(--border-warm);
      background: var(--bg-beige);
      color: var(--brown-deep);
      font-family: 'Pretendard', sans-serif;
      font-size: 0.76rem;
      font-weight: 800;
      padding: 7px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .slide-nav-btn:hover {
      background: var(--brown-deep);
      border-color: var(--brown-deep);
      color: var(--bg-white);
    }

    .slide-clinic-cta {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 15px;
      border-radius: 999px;
      background: var(--green-primary);
      color: var(--bg-white);
      font-size: 0.76rem;
      font-weight: 800;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .slide-clinic-cta:hover {
      background: var(--brown-deep);
    }

    /* Compact SCI Paper Titles Side Rail (#7) */
    .sci-side-rail {
      background: var(--bg-white);
      border: 1px solid var(--border-warm);
      border-radius: 18px;
      padding: 16px 15px;
      box-shadow: var(--shadow-card);
    }

    .sci-rail-header {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--brown-deep);
      padding-bottom: 8px;
      margin-bottom: 8px;
      border-bottom: 1px solid var(--border-warm);
    }

    .sci-rail-note {
      font-size: 0.69rem;
      line-height: 1.48;
      color: var(--brown-soft);
      margin-bottom: 10px;
      word-break: keep-all;
    }

    .sci-mini-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .sci-mini-item {
      background: var(--bg-beige);
      border: 1px solid var(--border-warm);
      border-radius: 10px;
      padding: 8px 10px;
    }

    .sci-mini-journal {
      font-size: 0.64rem;
      font-weight: 800;
      color: var(--green-primary);
      margin-bottom: 2px;
      letter-spacing: 0.02em;
    }

    .sci-mini-title {
      font-size: 0.71rem;
      font-weight: 700;
      line-height: 1.42;
      color: var(--black-ink);
      word-break: keep-all;
    }

    @media (max-width: 1180px) {
      .encyc-main-grid {
        grid-template-columns: 1fr;
      }
    }
    @media (max-width: 980px) {
      .vibrant-workspace {
        grid-template-columns: 1fr;
      }
      .vibrant-3d-stage {
        position: relative;
        top: 0;
        height: 54vh;
      }
      .encyclopedia-scroll-panel {
        height: auto;
      }
      .slide-visual-banner {
        grid-template-columns: 1fr;
      }
    }
  </style>

    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.166.0/build/three.module.js",

    }
  }
  </script>
</head>
<body>

  <!-- TOP HEADER BAR -->
  <header class="vibrant-header">
    <a href="/" class="vh-brand">
      <div class="vh-brand-mark">바</div>
      <span class="vh-brand-title">바른한의원 3D 질환 쇼룸</span>
    </a>

    <nav class="vh-part-quicknav" id="vh-part-quicknav">
      <button type="button" class="vh-part-chip active" data-part="knee">01 · 무릎 (소아 키성장·감기면역)</button>
      <button type="button" class="vh-part-chip" data-part="cervical">02 · 경추·두피 (거북목·열성탈모)</button>
      <button type="button" class="vh-part-chip" data-part="lumbar">03 · 요추·골반 (디스크·체형 추나)</button>
      <button type="button" class="vh-part-chip" data-part="gongjindan">04 · 뇌·심장 (황제공진단)</button>
      <button type="button" class="vh-part-chip" data-part="syncope">05 · 자율신경성 실신 (혈관·신경)</button>
      <button type="button" class="vh-part-chip" data-part="gut">06 · 위장·간 (대사 다이어트)</button>
      <button type="button" class="vh-part-chip" data-part="uterus">07 · 자궁·난임 (착상·여성질환)</button>
      <button type="button" class="vh-part-chip" data-part="prostate">08 · 전립선·배뇨 (남성활력)</button>
    </nav>

    const BODY_PARTS_DATA = [{"id":"knee","navLabel":"01 · 무릎 (소아 키성장·감기면역)","shortName":"무릎 · 소아 성장판 & 감기면역","hotspotLabel":"무릎 · 소아 성장판 & 감기면역","kicker":"01 / PEDIATRIC GROWTH PLATE & IMMUNITY","title":"무릎 성장판 & 소아 키성장 · 감기면역","subtitleEn":"Knee Epiphyseal Growth Plate & Mucosal Immunity","lead":"아이의 최종 키는 유전(23%)보다 후천적 면역·수면·영양(77%)이 좌우합니다. 감기·비염을 달고 사는 아이의 숨은 성장 방해 요인과 성장판 연골 증식 원리를 핵심만 정리했습니다.","illustImg":"illust_knee_growth_care.jpg","illustCaption":"대퇴골·경골 사이 성장판(Epiphyseal Plate) 연골세포 증식과 호흡기 면역 보호","clinicLink":"growth.html","clinicCta":"소아 성장 · 성조숙증 상세페이지 →","slides":[{"tabTitle":"① 핵심 원인","badge":"STEP 01 · 왜 키가 안 클까요?","heading":"성장을 멈추게 하는 3대 핵심 원인","summary":"잦은 감기·비염으로 인한 염증성 사이토카인과 구강호흡이 성장호르몬과 성장판 분열을 직접 차단합니다.","cards":[{"tag":"원인 01 · 잦은 감기와 비염","title":"면역 소모가 성장 에너지를 가로챕니다","desc":"감기·비염 때 분비되는 염증 물질(IL-6, TNF-α)이 간에서 만들어지는 성장인자(IGF-1) 생성을 최대 40% 억제합니다."},{"tag":"원인 02 · 야간 코막힘과 구강호흡","title":"입을 벌리고 자면 성장호르몬이 줄어듭니다","desc":"코가 막혀 깊은 서파수면(N3)에 들지 못하면 밤 10시~새벽 2시 성장호르몬 분비량이 정상 대비 절반 이하로 감소합니다."},{"tag":"원인 03 · 성조숙증과 조기 골화","title":"성장판 시계가 빨리 닫히면 최종 키가 손해입니다","desc":"소아 비만·환경호르몬으로 뼈나이가 앞서가면 성장판 연골이 일찍 딱딱한 뼈로 굳어 성장 기간이 단축됩니다."}]},{"tabTitle":"② 한의원 맞춤 치료","badge":"STEP 02 · 바른한의원 치료","heading":"성장판 연골 증식 & 호흡기 면역 동시 치료","summary":"성조숙증 호르몬 자극 없이 성장판 연골모세포(Chondrocyte) 분열을 깨우고 비염·감기 면역력을 함께 높입니다.","cards":[{"tag":"치료 01 · 비위·폐 면역 보강 한약","title":"감기·비염 이환율을 낮춰 성장 에너지 보존","desc":"호흡기 점막 면역(sIgA)과 소화 흡수력을 높여 아파서 빠지는 체중과 성장 정체기를 근본적으로 예방합니다."},{"tag":"치료 02 · IGF-1 성장판 활성화 처방","title":"성호르몬 자극 없는 안전한 연골 증식","desc":"율무·인진쑥·전칠삼·녹용 등 체질 맞춤 약재로 조기 골화를 막고 성장판 연골층 두께를 건강하게 유지합니다."},{"tag":"치료 03 · 소아 성장 추나 & 자세 교정","title":"거북목·골반 비대칭에 숨은 2~3cm 회복","desc":"휘어진 척추와 골반 정렬을 바로잡아 무릎 성장판에 가해지는 좌우 압박을 균등하게 분산시킵니다."}]},{"tabTitle":"③ 감기 아이 홈케어","badge":"STEP 03 · 부모님 실전 관리","heading":"감기·비염이 잦은 아이 가정 내 3대 수칙","summary":"항생제·해열제 남용을 줄이고 호흡기 점막 온도와 습도를 지켜주면 연간 성장 속도가 눈에 띄게 달라집니다.","cards":[{"tag":"수칙 01 · 아침 미온수 & 뒷목 보온","title":"기상 직후 찬물 금지, 따뜻한 물 한 모금","desc":"아침 찬 공기에 코 점막이 수축하지 않도록 미온수를 마시게 하고 환절기엔 스카프로 뒷목(대추혈)을 보온해 주세요."},{"tag":"수칙 02 · 침실 습도 55% & 코세척","title":"밤새 코로 숨 쉬는 깊은 수면 환경 만들기","desc":"취침 전 미온수 식염수 세척과 침실 습도 50~55% 유지로 밤새 입 대신 코로 숨 쉬며 숙면하도록 돕습니다."},{"tag":"수칙 03 · 감기 직후 14일 골든타임","title":"열이 내린 뒤 2주간 소화기·체력 집중 보충","desc":"감기 직후 떨어진 식욕과 장 면역을 부드러운 단백질·약선 죽으로 빠르게 회복시켜야 따라잡기 성장이 일어납니다."}]},{"tabTitle":"④ 추천 식단 · 루틴","badge":"STEP 04 · 식단 & 생활습관","heading":"성장에 도움이 되는 음식 vs 피해야 할 습관","summary":"뼈 기질을 만드는 양질의 단백질과 점프 운동을 늘리고, 성장호르몬을 억제하는 야간 당분을 차단하세요.","cards":[{"tag":"추천 식단 · 뼈와 면역 영양소","title":"소고기 살코기 · 잔멸치 · 표고버섯 · 배도라지","desc":"아연·아르기닌이 풍부한 살코기와 비타민 D가 많은 건표고버섯, 기관지 점막을 지키는 배·도라지가 큰 도움이 됩니다."},{"tag":"주의 식품 · 성장 방해 식품","title":"밤 8시 이후 단 음식 · 과일주스 · 튀김류 금지","desc":"취침 전 당분 섭취로 인슐린과 혈당이 오르면 밤사이 뇌하수체 성장호르몬(GH) 분비가 강력하게 억제됩니다."},{"tag":"매일 루틴 · 수면 & 점프 운동","title":"밤 10시 소등 + 하루 15분 줄넘기·농구","desc":"가벼운 수직 점프 자극은 무릎 성장판의 미세 혈류를 순환시키고 골밀도와 연골 분열을 촉진합니다."}]}],"sciPapers":[{"journal":"Pediatrics · 2019","title":"소아 재발성 호흡기 감염 및 전신 염증(IL-6)의 선형 성장 속도 억제 기전"},{"journal":"Int J Pediatr Otorhinolaryngol · 2020","title":"소아 알레르기 비염·구강호흡 환아의 서파수면 감소 및 IGF-1 저하 규명"},{"journal":"J Clin Endocrinol Metab · 2018","title":"영양·아연·단백질 결핍이 성장판 연골모세포(Chondrocyte) 증식에 미치는 영향"},{"journal":"Phytomedicine · 2021","title":"전통 한약 추출물의 조기 골화 지연 및 성장판 연골 분열 촉진 효과"},{"journal":"Sports Medicine · 2020","title":"적정 수직 점프 부하 운동의 소아 골밀도 및 성장판 미세혈류 증진 연구"}]},{"id":"cervical","navLabel":"02 · 경추·두피 (거북목·열성탈모)","shortName":"경추 · 두피열 & 탈모 모근재생","hotspotLabel":"경추 · 두피열 · 탈모 모근재생","kicker":"02 / CERVICAL SPINE & SCALP THERMOREGULATION","title":"경추(목) 정렬 & 두피열 탈모 · 모근재생","subtitleEn":"Cervical Alignment & Scalp Follicle Regeneration","lead":"거북목으로 굳어진 뒷목 근육은 머리로 올라간 열이 내려오지 못하게 막는 병목이 됩니다. 42°C 두피 사막화를 식히고 모낭 줄기세포를 깨우는 핵심 원리입니다.","illustImg":"illust_cervical_hairloss.jpg","illustCaption":"경추 C자 커브 복원을 통한 두피 열독 배출 및 모낭 모유두 세포 재생","clinicLink":"hairloss.html","clinicCta":"바른 탈모 · 모근재생 상세페이지 →","slides":[{"tabTitle":"① 핵심 원인","badge":"STEP 01 · 왜 두피가 뜨거울까요?","heading":"거북목과 상열하한(上熱下寒)이 부르는 탈모·두통","summary":"목뼈가 앞으로 빠지면 뇌혈류와 림프 순환이 막혀 머리 꼭대기에 열이 고이고 모낭 뿌리가 말라갑니다.","cards":[{"tag":"원인 01 · 42°C 두피 사막화 현상","title":"스트레스 열이 정수리에 고여 모근을 말립니다","desc":"과로와 수면 부족으로 교감신경이 항진되면 두피 표면 온도가 치솟고 모공이 충혈되어 머리카락이 가늘어집니다."},{"tag":"원인 02 · 일자목·거북목 경추 병목","title":"고개가 1cm 숙여질 때마다 목 하중 +3kg 증가","desc":"후두하근과 승모근이 단단히 굳어 두피로 가는 미세 모세혈관을 압박하고 만성 편두통·눈 피로를 유발합니다."},{"tag":"원인 03 · 모낭 성장기(Anagen) 단축","title":"영양 공급이 끊긴 모낭은 일찍 빠집니다","desc":"모유두(Dermal Papilla) 혈류가 줄어들면 3~5년 유지되어야 할 모발 성장기가 몇 개월로 짧아져 탈모가 급증합니다."}]},{"tabTitle":"② 한의원 맞춤 치료","badge":"STEP 02 · 바른한의원 치료","heading":"수승화강(水昇火降) 청열 한약 & 경추 감압 추나","summary":"머리의 열은 내리고 아랫배는 따뜻하게 데우며, 굳은 경추 마디를 열어 두피 산소 공급을 회복합니다.","cards":[{"tag":"치료 01 · 수승화강 청열·발모 한약","title":"두피 체열을 36.5°C로 낮추는 근본 내치","desc":"머리와 가슴에 뭉친 열독을 식히고 신장(腎)의 진액을 보충해 모발이 다시 굵게 자라나는 토양을 만듭니다."},{"tag":"치료 02 · 상부 경추(C1-C2) 교정 추나","title":"목·어깨 순환 수문을 여는 1:1 수기 추나","desc":"틀어진 경추 커브를 바로잡아 뇌와 두피로 연결되는 추골동맥·경동맥 혈류 흐름을 시원하게 개선합니다."},{"tag":"치료 03 · 모낭 재생 집중 케어","title":"잠든 모유두 세포를 깨우는 고농축 영양 공급","desc":"두피 미세혈류를 확장하고 모낭 줄기세포 활성 인자(Wnt/β-catenin)를 자극해 솜털을 굵은 성모로 키워냅니다."}]},{"tabTitle":"③ 두피·경추 홈케어","badge":"STEP 03 · 실전 홈케어","heading":"집에서 실천하는 두피 쿨링 & 목 이완 3원칙","summary":"올바른 샴푸·건조 습관과 족욕만으로도 머리로 몰리는 열을 효과적으로 내릴 수 있습니다.","cards":[{"tag":"수칙 01 · 저녁 샴푸 & 냉풍 완전 건조","title":"하루 노폐물은 밤에 씻고 두피는 찬 바람으로","desc":"뜨거운 드라이기 바람은 두피열을 악화시킵니다. 미온수로 감은 뒤 시원한 바람으로 두피 속까지 말려주세요."},{"tag":"수칙 02 · 취침 전 15분 반신욕·족욕","title":"발이 따뜻해지면 머리 열은 자연히 내려갑니다","desc":"40°C 물에 복사뼈 위까지 15분간 족욕하면 하체 혈관이 확장되면서 두피와 얼굴의 상열감이 빠르게 가라앉습니다."},{"tag":"수칙 03 · 모니터 눈높이 & 턱 당기기","title":"50분 업무 후 1분 견갑골 모으기 스트레칭","desc":"스마트폰을 눈높이로 올리고 턱을 가볍게 당겨 뒷목 근육이 두피 혈관을 누르지 않게 유지하세요."}]},{"tabTitle":"④ 추천 식단 · 루틴","badge":"STEP 04 · 식단 & 생활습관","heading":"모근을 살리는 블랙푸드 vs 두피열 유발 식품","summary":"모발 케라틴 원료가 되는 식물성 단백질과 항산화 식품을 챙기고 열을 올리는 야식·음주를 피하세요.","cards":[{"tag":"추천 식단 · 모발 영양 공급","title":"검은콩 · 흑임자 · 호두 · 해조류(미역·다시마)","desc":"시스테인과 비오틴, 철분·요오드가 풍부해 모발 뿌리를 단단하게 잡고 모발 굵기와 윤기를 더해줍니다."},{"tag":"주의 식품 · 피지·열독 유발","title":"매운 야식 · 치킨·튀김 · 알코올 · 액상과당","desc":"과도한 동물성 지방과 알코올은 두피 피지선을 자극해 지루성 염증과 모낭 위축을 가속화합니다."},{"tag":"매일 루틴 · 골든타임 수면","title":"밤 11시 이전 취침으로 모낭 세포 재생","desc":"모낭 줄기세포의 세포 분열은 밤 11시~새벽 2시 깊은 수면 중에 가장 활발하게 이루어집니다."}]}],"sciPapers":[{"journal":"J Dermatol Sci · 2020","title":"두피 국소 체열 상승 및 미세염증이 모유두 세포(Dermal Papilla) 사멸에 미치는 기전"},{"journal":"Spine · 2018","title":"전방두부자세(거북목) 각도 증가에 따른 경추 디스크 압력 및 두경부 혈류 감소 연구"},{"journal":"Phytotherapy Research · 2021","title":"생약 복합물의 Wnt/β-catenin 신호 활성화를 통한 모낭 성장기(Anagen) 연장 효과"},{"journal":"J Clin Med · 2019","title":"경추 수기 교정(Chuna) 치료의 만성 경추성 두통 및 자율신경 안정화 임상 연구"}]},{"id":"lumbar","navLabel":"03 · 요추·골반 (디스크·체형 추나)","shortName":"요추 · 골반 · 디스크 추나","hotspotLabel":"요추 · 골반 · 디스크 추나","kicker":"03 / LUMBAR SPINE, INTERVERTEBRAL DISC & PELVIC CHUNA","title":"요추(허리) · 골반 교정 & 디스크 신경감압 추나","subtitleEn":"Lumbar Spine, Hydrated Disc & Pelvic Symmetry","lead":"허리 통증의 뿌리는 삐뚤어진 골반(주춧돌)에 있습니다. 기울어진 골반과 좁아진 요추 디스크 간격을 정밀 추나로 넓혀 수술 없이 신경 압박을 해소합니다.","illustImg":"illust_lumbar_pelvis.jpg","illustCaption":"3D 요추(L1~L5)·추간판 디스크·골반 수평 정렬 및 신경근 감압 메커니즘","clinicLink":"chuna.html","clinicCta":"바른 추나 · 척추교정 상세페이지 →","slides":[{"tabTitle":"① 핵심 원인","badge":"STEP 01 · 왜 허리가 계속 아플까요?","heading":"무너진 골반 주춧돌과 디스크 압박의 악순환","summary":"진통제로 통증 신호만 끄면 틀어진 뼈는 그대로 남아 디스크 탈출과 좌골신경통이 재발합니다.","cards":[{"tag":"원인 01 · 골반 경사와 좌우 비대칭","title":"주춧돌인 골반이 기울면 허리뼈가 비틀립니다","desc":"다리 꼬기·짝다리 습관으로 천장관절이 틀어지면 그 위의 요추 4·5번 디스크 한쪽으로만 체중이 집중됩니다."},{"tag":"원인 02 · 추간판(디스크) 수분 소실과 압박","title":"납작해진 디스크가 신경 뿌리를 누릅니다","desc":"지속적인 압박으로 디스크 수핵의 수분이 빠져나가면 엉덩이부터 종아리까지 당기고 저린 방사통이 나타납니다."},{"tag":"원인 03 · 심부 코어 근육과 인대 약화","title":"척추를 잡아주는 근육이 굳고 약해집니다","desc":"장요근과 다열근이 긴장·약화되면 작은 기침이나 물건을 드는 동작만으로도 급성 요추 염좌가 반복됩니다."}]},{"tabTitle":"② 한의원 맞춤 치료","badge":"STEP 02 · 바른한의원 치료","heading":"1mm 골반·요추 정밀 추나 & 척추 한약 치료","summary":"틀어진 골반과 요추 마디를 손으로 직접 맞춰 디스크 공간을 넓히고 손상된 신경·인대를 재생합니다.","cards":[{"tag":"치료 01 · 요추·골반 공간 확보 추나","title":"찌그러진 디스크 간격을 넓히는 감압 교정","desc":"원장이 직접 틀어진 천장관절과 요추 아탈구를 교정하여 신경이 숨 쉴 수 있는 물리적 공간을 회복합니다."},{"tag":"치료 02 · 신경 염증 제거 & 인대 강화 한약","title":"부어오른 신경근 부종을 가라앉히고 뼈를 보강","desc":"두충·우슬·구척 등 강근골(强筋骨) 한약재로 탈출된 디스크 주변 염증을 흡수하고 느슨해진 인대를 탄탄히 조여줍니다."},{"tag":"치료 03 · 체형 밸런스 재발 방지 설계","title":"골반 수평과 양다리 길이 편차까지 정밀 교정","desc":"단순히 당장 아픈 부위만 푸는 것이 아니라 보행 자세와 골반 경사각을 바로잡아 재발률을 낮춥니다."}]},{"tabTitle":"③ 허리·골반 홈케어","badge":"STEP 03 · 실전 홈케어","heading":"디스크를 지키는 일상 속 3대 척추 보호 수칙","summary":"아침 기상 직후와 의자에 앉는 자세만 바꿔도 요추 디스크에 걸리는 압력을 절반으로 줄일 수 있습니다.","cards":[{"tag":"수칙 01 · 아침 기상 시 통나무 구르기","title":"눈 뜨자마자 윗몸일으키기처럼 일어나지 마세요","desc":"자고 일어난 직후엔 디스크 수분 압력이 높습니다. 옆으로 돌아누운 뒤 팔로 바닥을 짚고 천천히 일어나세요."},{"tag":"수칙 02 · 물건 들 때 고관절 힌지(스쿼트 자세)","title":"허리만 숙이지 말고 무릎을 굽혀 몸 가까이 드세요","desc":"아이를 안거나 무거운 짐을 들 때 배에 힘을 주고 무릎을 굽혀 들어야 요추 4·5번 디스크 손상을 막을 수 있습니다."},{"tag":"수칙 03 · 요추 전만(C자 곡선) 쿠션 지지","title":"의자 깊숙이 엉덩이를 넣고 허리 쿠션을 대주세요","desc":"다리 꼬는 습관을 멈추고 45분마다 자리에서 일어나 허리를 뒤로 가볍게 젖히는 맥켄지 신전 운동을 해주세요."}]},{"tabTitle":"④ 추천 식단 · 루틴","badge":"STEP 04 · 식단 & 생활습관","heading":"연골·인대를 튼튼하게 하는 음식 vs 피해야 할 습관","summary":"콜라겐 합성과 칼슘 흡수를 돕는 음식을 섭취하고 디스크 혈류를 막는 흡연·과음을 줄이세요.","cards":[{"tag":"추천 식단 · 척추·인대 강화","title":"도가니·사골 · 두부·콩류 · 연어 · 부추","desc":"콘드로이친과 칼슘, 비타민 D가 풍부해 척추 뼈와 디스크 섬유륜의 재생을 돕고 하체 혈액순환을 촉진합니다."},{"tag":"주의 습관 · 디스크 퇴행 가속","title":"흡연 · 과도한 카페인 · 푹 꺼진 소파 생활","desc":"담배의 니코틴은 디스크로 가는 미세 모세혈관을 수축시켜 디스크 퇴행과 수분 소실을 급격히 앞당깁니다."},{"tag":"매일 루틴 · 평지 걷기 & 브릿지","title":"하루 30분 바른 보행으로 척추 기립근 깨우기","desc":"시선을 15m 앞에 두고 팔을 자연스럽게 흔들며 걷는 평지 산책이 최고의 천연 디스크 보약입니다."}]}],"sciPapers":[{"journal":"JAMA Network Open · 2018","title":"요추 추간판 탈출증 및 만성 요통 환자에서 수기 교정(SMT/Chuna)의 통증 감소 효과"},{"journal":"Spine Journal · 2020","title":"골반 경사 및 천장관절 비대칭 교정이 요추 L4-L5 추간판 내압 감소에 미치는 영향"},{"journal":"Annals of Internal Medicine · 2017","title":"비수술적 척추 수기치료 및 통합 한의학 치료의 제1선(First-line) 권고 가이드라인"},{"journal":"J Ethnopharmacology · 2021","title":"두충·우슬 복합 추출물의 추간판 수핵 세포 보호 및 신경근 염증 억제 기전"}]},{"id":"gongjindan","navLabel":"04 · 뇌·심장 (황제공진단)","shortName":"뇌 · 심장 기혈순환 (황제공진단)","hotspotLabel":"뇌 · 심장 · 황제공진단","kicker":"04 / BRAIN-HEART CIRCULATION & EMPEROR GONGJINDAN","title":"뇌 · 심장 기혈순환 & 바른 황제공진단","subtitleEn":"Cerebro-Cardiovascular Vitality & Emperor Gongjindan","lead":"아무리 자도 풀리지 않는 만성피로와 브레인 포그, 가슴 답답함은 심장과 뇌를 잇는 기혈의 수문이 막혔기 때문입니다. 정품 사향 황제공진단이 뇌·심장 순환을 즉각 깨웁니다.","illustImg":"illust_gongjindan_heart_brain.jpg","illustCaption":"심장(Heart)과 뇌(Brain)를 연결하는 기혈 대순환 및 황제공진단 뇌신경 보호 기전","clinicLink":"gongjindan.html","clinicCta":"바른 황제공진단 상세페이지 →","slides":[{"tabTitle":"① 핵심 원인","badge":"STEP 01 · 왜 늘 방전된 것 같을까요?","heading":"뇌와 심장이 동시에 지치는 번아웃 3대 신호","summary":"과도한 스트레스와 수면 부족이 지속되면 심장 펌프력과 뇌 혈류량이 함께 떨어져 전신 활력이 고갈됩니다.","cards":[{"tag":"신호 01 · 브레인 포그 & 기억력 저하","title":"머리가 멍하고 집중력이 급격히 떨어집니다","desc":"뇌 신경세포에 산소와 포도당 공급이 지연되면서 두통, 현기증, 건망증과 극심한 정신적 피로가 누적됩니다."},{"tag":"신호 02 · 심장 두근거림 & 가슴 답답함","title":"작은 일에도 가슴이 뛰고 숨이 찹니다","desc":"심기(心氣)가 허해지면 조금만 무리해도 맥박이 불규칙해지고 밤에 깊은 잠을 이루지 못하는 불면증이 동반됩니다."},{"tag":"신호 03 · 수승화강(水昇火降) 단절","title":"얼굴·머리는 달아오르고 손발은 차가워집니다","desc":"심장의 따뜻한 기운이 아래로 내려가지 못하고 뇌로만 치솟아 만성 피로와 면역력 저하가 고착화됩니다."}]},{"tabTitle":"② 황제공진단 효능","badge":"STEP 02 · 뇌·심장 명약 황제공진단","heading":"식약처 인증 정품 사향(麝香)이 여는 뇌·심장 기혈 통로","summary":"사향·녹용·당귀·산수유를 황금 비율로 배합한 황제공진단은 막힌 뇌혈류와 심장 관상동맥 순환을 빠르게 회복시킵니다.","cards":[{"tag":"핵심 01 · L-무스콘(Muscone) 뇌혈관장벽 통과","title":"막힌 기혈의 수문을 여는 정품 사향의 힘","desc":"사향의 핵심 성분 L-무스콘은 뇌혈관장벽(BBB)을 직접 통과해 뇌신경 성장인자(BDNF)를 깨우고 머리를 맑게 합니다."},{"tag":"핵심 02 · 심장 관상동맥 혈류 & 심근 활력 강화","title":"지친 심장 펌프력을 살리고 전신 체력을 충전","desc":"러시아산 최상급 분골 녹용과 당귀가 조혈 작용과 심장 박출 효율을 높여 만성적인 무기력증을 근본부터 개선합니다."},{"tag":"핵심 03 · 원장 직접 0.001g 정밀 조제","title":"CITES 정품 인증 사향 & 100% 수제 제환","desc":"바른한의원은 식약처 정식 수입 사향만을 사용하며, 보존제 없이 대표원장이 직접 정량 계량하여 조제합니다."}]},{"tabTitle":"③ 복용법 & 홈케어","badge":"STEP 03 · 효과를 높이는 복용 가이드","heading":"황제공진단 효과를 200% 끌어올리는 복용 수칙","summary":"아침 공복에 향을 음미하며 천천히 씹어 복용하면 사향의 방향성 성분이 뇌와 심장으로 가장 빠르게 흡수됩니다.","cards":[{"tag":"복용 01 · 아침 기상 직후 공복 복용","title":"따뜻한 미온수와 함께 1~2분간 천천히 씹어 드세요","desc":"바로 삼키지 말고 입안에서 사향의 은은한 향이 코와 뇌로 퍼지도록 오래 씹은 뒤 미온수로 넘기는 것이 가장 좋습니다."},{"tag":"복용 02 · 시험·발표·과로 전 집중 케어","title":"중요한 일정 1시간 전 복용으로 집중력·안정감 향상","desc":"수험생, 경영진, 고강도 업무 전 복용하면 과도한 긴장성 심박수를 진정시키고 뇌 회전과 체력을 뒷받침합니다."},{"tag":"복용 03 · 보관 및 주의사항","title":"직사광선을 피해 서늘한 실온 또는 냉장 보관","desc":"방부제가 전혀 들어가지 않으므로 밀봉 상태를 유지하고, 냉장 보관 시 복용 10분 전에 꺼내 두셨다가 드세요."}]},{"tabTitle":"④ 추천 식단 · 루틴","badge":"STEP 04 · 뇌·심장 활력 식단","heading":"뇌·심장 혈관을 맑게 하는 식단과 회복 루틴","summary":"공진단 복용 기간에는 약효 흡수를 방해하는 녹두·과음을 피하고 항산화 식단을 유지해 주세요.","cards":[{"tag":"추천 식단 · 뇌·심장 보혈 식품","title":"등푸른생선 · 블루베리 · 호두·잣 · 연근","desc":"오메가-3와 폴리페놀이 뇌세포 산화 스트레스를 줄이고 심혈관 내피세포의 탄력을 건강하게 지켜줍니다."},{"tag":"주의 식품 · 약효 흡수 방해","title":"복용 전후 2시간 커피·녹차·숙주·녹두 제한","desc":"카페인과 탄닌, 찬 성질의 녹두는 사향과 녹용의 유효 성분 흡수를 떨어뜨릴 수 있으므로 시간 간격을 두세요."},{"tag":"매일 루틴 · 심호흡과 낮 햇볕 산책","title":"하루 15분 햇볕 산책으로 세로토닌·멜라토닌 회복","desc":"낮 동안 햇볕을 쬐며 천천히 걸으면 뇌-심장 자율신경 리듬이 맞춰져 밤사이 깊은 회복 수면이 가능해집니다."}]}],"sciPapers":[{"journal":"J Ethnopharmacology · 2019","title":"공진단(Gongjindan)의 뇌신경 영양인자(BDNF) 발현 증가 및 기억력·피로 개선 기전"},{"journal":"Front Pharmacol · 2021","title":"사향 주성분 L-무스콘(Muscone)의 뇌혈관장벽 투과 및 심근 허혈 보호 효과 규명"},{"journal":"Nutrients · 2020","title":"녹용·당귀·산수유 복합 추출물의 코르티솔 감소 및 만성피로증후군(CFS) 임상 개선"},{"journal":"Evid Based Complement Alternat Med · 2018","title":"공진단 투여 후 뇌혈류량(CBF) 증가 및 수면의 질 향상 임상 연구"}]},{"id":"syncope","navLabel":"05 · 자율신경성 실신 (혈관·신경)","shortName":"자율신경성 실신 · 전신 혈관·신경","hotspotLabel":"자율신경성 실신 · 혈관·신경","kicker":"05 / VASOVAGAL SYNCOPE & AUTONOMIC VASCULAR NETWORK","title":"자율신경성(미주신경성) 실신 & 전신 혈관 · 신경 조절","subtitleEn":"Vasovagal Syncope, Orthostatic Hypotension & Autonomic Nerves","lead":"갑자기 눈앞이 캄캄해지며 식은땀이 나고 쓰러지는 자율신경성 실신은 뇌-심장-전신 말초혈관을 조율하는 자율신경 브레이크가 오작동하기 때문입니다.","illustImg":"illust_syncope_autonomic.jpg","illustCaption":"뇌간-미주신경-심장-전신 혈관 수축 반사를 조율하는 자율신경 네트워크 복원","clinicLink":"director.html","clinicCta":"1:1 자율신경 · 체질 클리닉 상세보기 →","slides":[{"tabTitle":"① 핵심 원인","badge":"STEP 01 · 왜 갑자기 어지럽고 쓰러질까요?","heading":"전신 혈관과 미주신경이 순간적으로 멈추는 이유","summary":"오래 서 있거나 긴장·더위·피로가 겹칠 때 다리로 몰린 혈액이 뇌로 올라오지 못해 순간적인 뇌 빈혈이 발생합니다.","cards":[{"tag":"원인 01 · 미주신경 과민 반사 (Vasovagal Reflex)","title":"교감신경이 지치면 부교감(미주)신경이 급브레이크를 밟습니다","desc":"극심한 스트레스·통증·밀폐된 공간에서 갑자기 심박수와 혈압이 동시에 뚝 떨어지며 뇌로 가는 혈류가 일시 차단됩니다."},{"tag":"원인 02 · 하지 정맥 저류 & 혈관 탄력 저하","title":"다리로 내려간 피가 심장과 뇌로 못 올라옵니다","desc":"말초 혈관 수축력이 약하면 일어설 때 혈액 500~800cc가 하체에 고여 눈앞이 하얘지는 기립성 어지럼증이 나타납니다."},{"tag":"원인 03 · 전조 증상 (식은땀 · 이명 · 메스꺼움)","title":"실신 직전 몸이 보내는 긴급 경고 신호","desc":"속이 울렁거리고 귀가 멍해지며 얼굴이 창백해지고 차가운 식은땀이 흐르는 것은 뇌 혈류가 부족하다는 신호입니다."}]},{"tabTitle":"② 한의원 맞춤 치료","badge":"STEP 02 · 바른한의원 치료","heading":"자율신경 밸런스 안정화 & 심뇌혈류 보강 치료","summary":"심장의 펌프 압력을 높이고 과민해진 미주신경 흥분을 가라앉혀 어지럼증과 실신 재발을 근본적으로 예방합니다.","cards":[{"tag":"치료 01 · 자율신경 조율 체질 맞춤 한약","title":"심박수 변동성(HRV)과 혈관 수축 탄력 회복","desc":"심장과 비위(소화기)의 기혈을 보충하여 갑작스러운 환경 변화에도 혈압과 뇌혈류가 흔들리지 않도록 단단히 잡아줍니다."},{"tag":"치료 02 · 두경부·흉추 자율신경절 이완 추나","title":"미주신경이 지나는 경추·흉곽 긴장 해소","desc":"뇌간에서 심장·내장으로 내려가는 미주신경 통로(상부 경추 및 횡격막)의 압박을 풀어 신경 전달 오류를 바로잡습니다."},{"tag":"치료 03 · 말초 순환 & 체온 유지 프로토콜","title":"차가운 손발과 하체 정맥 순환을 동시에 개선","desc":"하체에서 심장으로 혈액을 밀어 올리는 정맥 환류(Venous Return) 기능을 높여 기립 시 현기증을 없애줍니다."}]},{"tabTitle":"③ 실신 예방 응급요령","badge":"STEP 03 · 실전 대처 가이드","heading":"전조 증상이 올 때 즉시 혈압을 올리는 3대 동작","summary":"눈앞이 아찔하거나 식은땀이 나기 시작할 때 바로 실천하면 의식을 잃고 넘어지는 부상을 막을 수 있습니다.","cards":[{"tag":"대처 01 · 즉시 앉거나 눕기 & 다리 올리기","title":"참지 말고 그 자리에 앉아 머리를 낮추세요","desc":"전조 증상이 느껴지면 즉시 쪼그려 앉거나 누워 다리를 심장보다 높게 올리면 10초 내로 뇌 혈류가 회복됩니다."},{"tag":"대처 02 · 다리 꼬아 조이기 (Physical Counterpressure)","title":"양다리를 교차해 허벅지·엉덩이에 강하게 힘주기","desc":"서 있어야 하는 상황이라면 양다리를 엇갈려 꼬고 종아리·허벅지·엉덩이 근육을 30초간 꽉 조여 혈압을 끌어올리세요."},{"tag":"대처 03 · 아침 기상 시 3단계 천천히 일어나기","title":"침대에서 바로 벌떡 일어나지 마세요","desc":"깨어난 후 침대 끝에 걸터앉아 발목을 10회 위아래로 까딱인 뒤 천천히 일어서면 기립성 어지럼증을 예방합니다."}]},{"tabTitle":"④ 추천 식단 · 루틴","badge":"STEP 04 · 식단 & 생활습관","heading":"혈관 볼륨을 지키는 수분·전해질 섭취와 하체 루틴","summary":"탈수와 공복은 자율신경성 실신의 가장 큰 방아쇠입니다. 충분한 수분과 종아리 근육 운동을 생활화하세요.","cards":[{"tag":"추천 식단 · 혈액량 & 철분 보충","title":"하루 미온수 1.5L · 소고기·시금치 · 대추·인삼차","desc":"혈장 볼륨을 유지하는 충분한 수분과 적혈구 생성을 돕는 철분, 심장 기운을 돕는 따뜻한 차가 큰 도움이 됩니다."},{"tag":"주의 상황 · 실신 유발 방아쇠 차단","title":"아침 식사 거르기 · 뜨거운 사우나 · 장시간 기립 주의","desc":"공복 저혈당 상태나 더운 목욕탕에서 말초 혈관이 급격히 확장되면 뇌 혈류가 빠져나가 실신 위험이 커집니다."},{"tag":"매일 루틴 · 제2의 심장 종아리 펌프 운동","title":"하루 50회 까치발 들기(Calf Raise) 운동","desc":"종아리 근육이 단단해야 하체에 고인 혈액을 심장과 뇌로 힘차게 펌프질해 올릴 수 있습니다."}]}],"sciPapers":[{"journal":"European Heart Journal · 2018","title":"ESC 실신(Syncope) 진단 및 관리 가이드라인: 미주신경성 반사 및 하지 근육 수축 요법"},{"journal":"J Am Coll Cardiol (JACC) · 2019","title":"재발성 미주신경성 실신 환자의 자율신경 심박변이도(HRV) 불균형 및 혈관 수축 기전"},{"journal":"Autonomic Neuroscience · 2020","title":"한의학 보익·안신 처방 및 침구 자극의 미주신경 톤 조절 및 기립성 저혈압 개선 연구"},{"journal":"Circulation · 2017","title":"물리적 역압박 기법(Leg Crossing & Muscle Tensing)의 즉각적 뇌혈류 보존 효과"}]},{"id":"gut","navLabel":"06 · 위장·간 (대사 다이어트)","shortName":"위장 · 간 해독 & 대사 다이어트","hotspotLabel":"위장 · 간 해독 · 대사 다이어트","kicker":"06 / DIGESTIVE METABOLISM & VISCERAL FAT DETOX","title":"위장 · 간 대사 해독 & 식욕ZERO 다이어트","subtitleEn":"Gastric-Hepatic Detoxification & Metabolic Boosting","lead":"물만 먹어도 찌는 나잇살과 반복되는 요요는 의지 부족이 아니라 차갑게 식어버린 복부 대사와 간·장 해독 기능 저하 때문입니다. 굶지 않고 대사 화로를 다시 켭니다.","illustImg":"illust_gut_metabolism.jpg","illustCaption":"위장·간·장 대사 순환 활성화 및 심부 내장지방 연소 메커니즘","clinicLink":"diet-zero.html","clinicCta":"바른 다이어트 · 식욕ZERO 상세페이지 →","slides":[{"tabTitle":"① 핵심 원인","badge":"STEP 01 · 왜 굶어도 안 빠질까요?","heading":"요요와 복부 내장지방을 부르는 3대 대사 정체","summary":"무작정 굶는 절식 다이어트는 근육만 빼앗아 기초대사량을 떨어뜨리고 배부터 다시 찌는 체질을 만듭니다.","cards":[{"tag":"원인 01 · 식적(食積)과 장내 독소 축적","title":"소화되지 못한 노폐물이 아랫배를 단단하게 채웁니다","desc":"위장 운동성이 떨어지고 장내 유해균이 늘어나면 만성 복부 팽만감, 변비와 함께 내장지방이 쉽게 쌓입니다."},{"tag":"원인 02 · 가짜 배고픔 (렙틴 저항성)","title":"스트레스 호르몬이 밤마다 폭식을 부릅니다","desc":"수면 부족과 스트레스로 코르티솔이 높아지면 포만감 호르몬(렙틴)이 작동하지 않아 야식과 단 음식을 찾게 됩니다."},{"tag":"원인 03 · 냉증과 림프 부종형 체질","title":"몸이 차가우면 지방 연소 효소가 멈춥니다","desc":"복부 체온이 낮고 혈액·림프 순환이 막히면 아침마다 얼굴·다리가 붓고 부종이 그대로 살이 되는 악순환이 반복됩니다."}]},{"tabTitle":"② 한의원 맞춤 치료","badge":"STEP 02 · 바른한의원 치료","heading":"손 떨림·불면 없는 편안한 식욕 조절 & 대사 부스팅","summary":"체질에 맞게 간 해독과 기초대사량을 높여 자연스러운 포만감을 유도하고 내장지방만 선택적으로 감량합니다.","cards":[{"tag":"치료 01 · 1:1 체질 맞춤 대사 다이어트 한약","title":"가짜 식욕은 잠재우고 기초대사 화로를 점화","desc":"무리한 교감신경 흥분 없이 자연스러운 포만감을 유지시켜 평소 식사량의 절반만 먹어도 든든하고 편안합니다."},{"tag":"치료 02 · 간(Liver) 해독 & 부종 배출 처방","title":"정체된 습담(濕痰)과 노폐물을 소변·땀으로 배출","desc":"지방 대사의 핵심 기관인 간 기능을 돕고 림프 순환을 열어 아랫배와 하체 부종부터 가볍게 정리합니다."},{"tag":"치료 03 · 근손실 ZERO · 요요 방지 설계","title":"체수분·근육이 아닌 순수 체지방 중심 감량","desc":"InBody 체성분 분석과 맥진을 통해 근육량은 지키면서 감량 후 체중 세트포인트(Set-point)가 유지되도록 돕습니다."}]},{"tabTitle":"③ 다이어트 실전 요령","badge":"STEP 03 · 실전 홈케어","heading":"인슐린 스파이크를 막는 거꾸로 식사법 3원칙","summary":"음식을 먹는 순서와 시간만 바꿔도 식후 혈당 폭발과 지방 축적을 절반 이상 줄일 수 있습니다.","cards":[{"tag":"수칙 01 · 채소 → 단백질 → 탄수화물 순서","title":"첫 입은 무조건 식이섬유(샐러드·나물)부터 드세요","desc":"채소와 단백질을 먼저 먹으면 탄수화물 흡수 속도가 완만해져 인슐린에 의한 복부 지방 저장이 크게 줄어듭니다."},{"tag":"수칙 02 · 저녁 7시 이후 12시간 공복 유지","title":"밤사이 위장을 비워야 자가포식(지방 분해)이 켜집니다","desc":"야식을 끊고 저녁 식사 후 다음 날 아침까지 12~14시간 공복을 유지하면 자는 동안 내장지방이 에너지로 연소됩니다."},{"tag":"수칙 03 · 하루 1.5L 따뜻한 물 수시로 마시기","title":"지방이 분해될 때는 반드시 수분이 필요합니다","desc":"찬물 대신 체온과 비슷한 미온수를 조금씩 자주 마시면 복부 심부 온도가 올라가고 노폐물 배출이 빨라집니다."}]},{"tabTitle":"④ 추천 식단 · 루틴","badge":"STEP 04 · 식단 & 생활습관","heading":"대사를 살리는 클린 식단 vs 살찌는 주범","summary":"정제 탄수화물과 액상과당만 끊어도 2주 만에 복부 둘레와 몸의 가벼움이 달라집니다.","cards":[{"tag":"추천 식단 · 고단백·저당지수(Low-GI)","title":"양배추·브로콜리 · 오리고기·생선 · 귀리·율무","desc":"포만감이 오래가고 위 점막을 보호하며 부종을 빼주는 율무·채소·양질의 단백질 위주로 식단을 구성하세요."},{"tag":"주의 식품 · 내장지방 직행 식품","title":"과일주스·믹스커피 · 밀가루 면·빵 · 늦은 밤 맥주","desc":"액상과당과 정제 밀가루는 간에서 즉시 중성지방으로 합성되어 내장 사이사이에 지방으로 쌓입니다."},{"tag":"매일 루틴 · 식후 15분 가벼운 산책","title":"식사 직후 눕지 말고 15분만 걸어주세요","desc":"식후 15분 산책은 혈액 속 포도당이 지방으로 바뀌기 전에 근육에서 에너지로 소모되도록 만듭니다."}]}],"sciPapers":[{"journal":"Cell Metabolism · 2019","title":"시간제한 섭식(12~14시간 공복)의 내장지방 감소 및 인슐린 감수성 개선 기전"},{"journal":"Int J Obes · 2020","title":"전통 한약 복합물의 갈색지방(BAT) 열발생 활성화 및 렙틴 저항성 개선 연구"},{"journal":"Diabetes Care · 2018","title":"식이섬유·단백질 선섭취(Food Order)가 식후 혈당 스파이크 및 인슐린 분비에 미치는 영향"},{"journal":"Gut Microbes · 2021","title":"장내 미생물 총(Microbiome) 균형 복원을 통한 대사증후군 및 비만 개선 임상 연구"}]},{"id":"uterus","navLabel":"07 · 자궁·난임 (착상·여성질환)","shortName":"자궁 · 난임착상 & 여성클리닉","hotspotLabel":"자궁 · 난임착상 · 여성질환","kicker":"07 / UTERINE WARMTH, ENDOMETRIAL IMPLANTATION & WOMEN HEALTH","title":"자궁 · 난소 해부 & 난임 착상 · 생리통 클리닉","subtitleEn":"Uterine Endometrial Receptivity & Ovarian Vitality","lead":"소중한 생명이 뿌리내리는 자궁은 따뜻하고 부드러운 토양이어야 합니다. 차갑게 굳은 하복부 어혈을 풀고 자궁내막 두께와 난소 기능을 높여 건강한 착상과 임신을 돕습니다.","illustImg":"illust_uterus_fertility.jpg","illustCaption":"3D 자궁(Uterus)·난관(Fallopian Tube)·난소(Ovary) 순환 및 36.8°C 착상 환경 조성","clinicLink":"director.html","clinicCta":"자궁 · 난임 착상 클리닉 상담 →","slides":[{"tabTitle":"① 핵심 원인","badge":"STEP 01 · 왜 착상이 어렵고 생리통이 심할까요?","heading":"자궁과 난소가 보내는 3대 냉증·어혈 신호","summary":"하복부 체온이 낮고 골반 혈류가 정체되면 자궁내막이 얇아지고 수정란이 안정적으로 착상하기 어려워집니다.","cards":[{"tag":"원인 01 · 자궁 냉증(宮寒)과 얇은 내막","title":"차갑고 얇은 토양에는 씨앗이 뿌리내리기 어렵습니다","desc":"자궁 동맥 혈류가 부족해 내막 두께가 7~8mm에 미치지 못하면 자연임신 및 시험관(IVF) 이식 후 착상률이 떨어집니다."},{"tag":"원인 02 · 골반 어혈(瘀血)과 극심한 생리통","title":"배출되지 못한 어혈이 자궁 수축과 염증을 유발","desc":"생리혈이 검고 덩어리가 지며 진통제 없이는 버티기 힘든 생리통은 자궁 내 순환이 막혀 있다는 대표적인 신호입니다."},{"tag":"원인 03 · 난소 기능 저하(AMH) & 배란 불균형","title":"스트레스와 만성 피로가 난자의 질을 떨어뜨립니다","desc":"수면 부족과 과로로 호르몬 축(H-P-O Axis)이 흔들리면 다낭성난소증후군·생리불순과 배란 장애가 나타납니다."}]},{"tabTitle":"② 한의원 맞춤 치료","badge":"STEP 02 · 바른한의원 치료","heading":"자궁 심부 온열 보궁(補宮) 한약 & 시험관 착상 병행","summary":"배란기·착상기·임신 유지기 주기에 맞춰 난자의 질을 높이고 자궁내막 수용성(LIF)을 극대화합니다.","cards":[{"tag":"치료 01 · 착상탕 & 자궁내막 보강 처방","title":"자궁내막을 도톰하고 따뜻하게 만드는 맞춤 한약","desc":"자궁 나선동맥 혈류를 확장해 내막을 8~10mm의 최적 두께로 성숙시키고 착상 유도 단백질 발현을 돕습니다."},{"tag":"치료 02 · 시험관(IVF)·인공수정 단계별 병행","title":"채취 전 난자 질 개선부터 이식 후 유산 방지까지","desc":"과배란 유도 전에는 난소 피로를 줄이고, 배아 이식 직후에는 자궁 수축을 안정시켜 착상 성공률을 높입니다."},{"tag":"치료 03 · 골반 교정 & 하복부 온열 순환","title":"자궁을 감싸는 골반 틀어짐 교정으로 혈류 확보","desc":"틀어진 천골과 골반을 바로잡아 자궁·난소로 가는 골반 신경과 혈관 압박을 부드럽게 해소합니다."}]},{"tabTitle":"③ 착상·자궁 홈케어","badge":"STEP 03 · 실전 홈케어","heading":"자궁 온도를 1°C 높이는 일상 속 3대 보궁 수칙","summary":"아랫배와 발목을 따뜻하게 보호하고 환경호르몬을 줄이는 작은 습관이 자궁 건강을 바꿉니다.","cards":[{"tag":"수칙 01 · 하복부 핫팩 & 발목(삼음교) 보온","title":"아랫배와 안쪽 복사뼈 위는 늘 따뜻하게 감싸주세요","desc":"냉방 바람에 배와 발목이 노출되지 않도록 양말과 배 덮개를 착용하고 매일 저녁 하복부 온찜질을 해주세요."},{"tag":"수칙 02 · 환경호르몬(내분비 교란물질) 차단","title":"뜨거운 음식을 플라스틱·일회용 용기에 담지 마세요","desc":"비스페놀A와 다이옥신은 여성호르몬 수용체를 교란해 생리통과 난임, 자궁근종 위험을 높입니다."},{"tag":"수칙 03 · 골반 나비 자세 스트레칭","title":"취침 전 10분 고관절·골반 순환 열기","desc":"양 발바닥을 붙이고 무릎을 좌우로 부드럽게 내려놓는 나비 자세는 골반강 내부 자궁·난소 혈류를 크게 늘려줍니다."}]},{"tabTitle":"④ 추천 식단 · 루틴","badge":"STEP 04 · 식단 & 생활습관","heading":"자궁·난소를 살리는 약선 식단 vs 피해야 할 음식","summary":"따뜻한 성질의 보혈(補血) 식품과 항산화 채소를 챙기고 자궁을 차갑게 만드는 찬 음료를 피하세요.","cards":[{"tag":"추천 식단 · 자궁 보혈 & 착상 영양","title":"쑥·당귀차 · 검은콩·두부 · 전복·소고기 · 석류","desc":"엽산과 철분, 식물성 에스트로겐과 아르기닌이 풍부해 자궁내막 혈류를 늘리고 난소 노화를 늦춰줍니다."},{"tag":"주의 식품 · 자궁 냉증 & 어혈 악화","title":"아이스 음료 · 생야채 과식 · 밀가루·정제당","desc":"얼음물과 찬 음식은 위장과 맞닿아 있는 자궁의 온도를 직접 떨어뜨려 자궁 혈관을 수축시킵니다."},{"tag":"매일 루틴 · 부부 동반 3개월 준비","title":"난자와 정자가 성숙하는 90일간의 수면·영양 관리","desc":"원시 난포가 배란되기까지 약 3개월이 걸립니다. 밤 11시 이전 숙면으로 호르몬 리듬을 일정하게 지켜주세요."}]}],"sciPapers":[{"journal":"Complement Ther Med · 2019","title":"시험관 아기(IVF) 시술 시 한약 병행 치료의 자궁내막 수용성 및 임상 임신율 향상 메타분석"},{"journal":"Fertil Steril · 2020","title":"자궁 동맥 혈류 저항 감소 및 자궁내막 두께(8mm 이상) 확보가 배아 착상률에 미치는 영향"},{"journal":"J Ethnopharmacology · 2021","title":"전통 보궁(補宮) 한약 처방의 착상 필수 인자(LIF, Integrin αvβ3) 발현 촉진 기전"},{"journal":"Human Reproduction · 2018","title":"산화 스트레스 감소 및 미토콘드리아 활성화가 난소 예비능(AMH)과 난자 질에 미치는 효과"}]},{"id":"prostate","navLabel":"08 · 전립선·배뇨 (남성활력)","shortName":"전립선 · 배뇨장애 & 남성활력","hotspotLabel":"전립선 · 배뇨 · 남성활력","kicker":"08 / PROSTATE, URINARY BLADDER & MALE VITALITY CLINIC","title":"전립선 비대 · 만성 전립선염 & 야간뇨 · 배뇨 클리닉","subtitleEn":"Prostate Decongestion, Bladder Control & Male Vitality","lead":"밤마다 화장실 때문에 깨는 야간뇨, 시원하지 않은 잔뇨감과 회음부 뻐근함은 전립선 부종과 방광 괄약근 피로 신호입니다. 전립선 울혈을 풀고 하초(下焦)의 양기를 되살립니다.","illustImg":"illust_prostate_care.jpg","illustCaption":"3D 방광(Bladder)·전립선(Prostate)·요도 괄약근 감압 및 골반저 혈류 순환 복원","clinicLink":"prostate.html","clinicCta":"전립선 · 남성활력 상세페이지 →","slides":[{"tabTitle":"① 핵심 원인","badge":"STEP 01 · 왜 소변이 자주 마렵고 불편할까요?","heading":"전립선과 방광이 보내는 3대 배뇨·통증 신호","summary":"장시간 좌식 생활과 노화·과로로 골반 바닥 혈류가 막히면 전립선이 붓고 방광 아래 요도를 좁게 압박합니다.","cards":[{"tag":"원인 01 · 전립선 울혈과 요도 압박 (전립선비대)","title":"부어오른 전립선이 소변 길을 꽉 조입니다","desc":"소변 줄기가 가늘어지고(세뇨), 한참 기다려야 나오며(지연뇨), 보고 나서도 덜 본 듯한 잔뇨감이 지속됩니다."},{"tag":"원인 02 · 방광 과민성과 야간뇨 (수면 분절)","title":"밤새 2~3번 깨어나 깊은 수면과 활력이 무너집니다","desc":"하초(신장·방광)가 차갑고 약해지면 방광이 소변을 충분히 저장하지 못해 빈뇨·급박뇨와 만성 피로가 이어집니다."},{"tag":"원인 03 · 만성 비세균성 전립선염 & 골반 통증","title":"항생제를 먹어도 낫지 않는 회음부·고환 뻐근함","desc":"전립선염의 90% 이상은 세균이 아닌 골반저 근육 긴장과 만성 울혈·면역 저하로 발생해 재발이 잦습니다."}]},{"tabTitle":"② 한의원 맞춤 치료","badge":"STEP 02 · 바른한의원 치료","heading":"전립선 부종 감압 한약 & 하초(腎·膀胱) 원기 회복","summary":"전립선 내부의 만성 염증과 부종을 빼 소변 길을 시원하게 열고, 약해진 방광 수축력과 남성 활력을 동시에 높입니다.","cards":[{"tag":"치료 01 · 전립선 청열·배농 & 울혈 해소 한약","title":"단단하게 부은 전립선 조직을 부드럽게 감압","desc":"포공영·패장근·차전자·산수유 등 맞춤 약재로 전립선 미세 염증을 가라앉히고 요도 압박을 완화해 소변 줄기를 회복합니다."},{"tag":"치료 02 · 신장·방광 온양(溫陽) 야간뇨 치료","title":"차가워진 방광을 데워 밤새 깨지 않는 숙면 유도","desc":"방광 괄약근의 탄력과 저장 능력을 복원하여 야간 배뇨 횟수를 줄이고 아침 기상 시 개운함을 되찾아 드립니다."},{"tag":"치료 03 · 골반저(Pelvic Floor) 감압 추나","title":"회음부 신경과 전립선 혈관을 누르는 골반 교정","desc":"오래 앉아 틀어진 골반과 천골 신경총의 긴장을 이완시켜 회음부 불쾌감과 사타구니 방사통을 빠르게 줄여줍니다."}]},{"tabTitle":"③ 전립선 실전 홈케어","badge":"STEP 03 · 실전 홈케어","heading":"전립선 압박을 줄이고 야간뇨를 막는 3대 생활 수칙","summary":"온수 좌욕과 저녁 수분 조절만 실천해도 밤사이 화장실 가는 횟수와 회음부 불편감이 크게 줄어듭니다.","cards":[{"tag":"수칙 01 · 매일 저녁 10분 따뜻한 온수 좌욕","title":"40°C 미온수 좌욕으로 전립선 울혈과 근육 이완","desc":"따뜻한 물에 회음부와 엉덩이를 담그면 굳어 있던 골반저 근육이 풀리고 전립선 내부 혈류 순환이 2배 이상 빨라집니다."},{"tag":"수칙 02 · 50분마다 자리에서 일어나기 & 도넛 방석","title":"딱딱한 의자나 자전거 안장의 회음부 압박 피하기","desc":"오래 앉아 있으면 체중이 전립선을 직접 짓누릅니다. 1시간마다 일어나 골반을 풀어주고 푹신한 방석을 사용하세요."},{"tag":"수칙 03 · 취침 3시간 전 수분·알코올 제한","title":"저녁 식사 후에는 국물·과일·맥주 섭취를 멈추세요","desc":"특히 과음은 전립선을 급격히 붓게 만들어 급성 요폐(소변이 막히는 현상)와 심한 야간뇨를 유발합니다."}]},{"tabTitle":"④ 추천 식단 · 루틴","badge":"STEP 04 · 식단 & 생활습관","heading":"전립선을 지키는 라이코펜 식단 vs 피해야 할 습관","summary":"전립선 항산화 영양소인 익힌 토마토와 아연을 충분히 섭취하고 감기약 복용 시에도 주의가 필요합니다.","cards":[{"tag":"추천 식단 · 전립선 보호 4대 영양","title":"익힌 토마토 · 호박씨 · 굴·마늘 · 산수유차","desc":"올리브유에 살짝 익힌 토마토의 라이코펜과 호박씨·굴의 아연(Zinc)은 전립선 세포 노화와 비대를 강력히 억제합니다."},{"tag":"주의 사항 · 배뇨 장애 악화 요인","title":"과음 · 진한 커피 · 감기약(항히스타민제) 주의","desc":"일부 코감기약 성분은 방광 출구를 조여 소변이 안 나오게 할 수 있으므로 전립선 증상을 꼭 알리고 처방받으세요."},{"tag":"매일 루틴 · 소변 참지 않기 & 괄약근 이완 호흡","title":"소변을 억지로 오래 참으면 방광 근육이 지칩니다","desc":"배뇨 신호가 오면 제때 비워주고, 평소 아랫배 복식호흡으로 긴장된 골반 바닥 근육을 편안하게 이완해 주세요."}]}],"sciPapers":[{"journal":"Urology · 2019","title":"만성 비세균성 전립선염/만성골반통증증후군(CP/CPPS)에서 한의학 치료의 통증·배뇨 개선 연구"},{"journal":"Phytomedicine · 2020","title":"천연 한약 추출물의 5α-환원효소(5α-Reductase) 억제 및 전립선 비대 조직 감압 기전"},{"journal":"J Urol · 2018","title":"골반저 근육 이완 및 온열 좌욕 요법이 하부요로증상(LUTS)과 야간뇨 감소에 미치는 임상 효과"},{"journal":"Prostate Cancer Prostatic Dis · 2021","title":"라이코펜·아연 및 항염증 약선 식단의 전립선 산화 스트레스 억제 연구"}]}];

    function createStylizedPorcelainBodyMaterial() {
      return new THREE.ShaderMaterial({
        uniforms: {
          uHighlightCol: { value: new THREE.Color('#FAF6EC') },
          uMidCol:       { value: new THREE.Color('#EFE6D5') },
          uRimCol:       { value: new THREE.Color('#D2C2A8') },
          uOutlineCol:   { value: new THREE.Color('#6E5844') }
        },
        vertexShader: [
          'varying vec3 vNormal;',
          'varying vec3 vViewDir;',
          'varying vec3 vWorldPos;',
          'void main() {',
          '  vec4 worldPos = modelMatrix * vec4(position, 1.0);',
          '  vWorldPos = worldPos.xyz;',
          '  vec4 mvPos = viewMatrix * worldPos;',
          '  vViewDir = normalize(-mvPos.xyz);',
          '  vNormal = normalize(normalMatrix * normal);',
          '  gl_Position = projectionMatrix * mvPos;',
          '}'
        ].join(' '),
        fragmentShader: [
          'uniform vec3 uHighlightCol;',
          'uniform vec3 uMidCol;',
          'uniform vec3 uRimCol;',
          'uniform vec3 uOutlineCol;',
          'varying vec3 vNormal;',
          'varying vec3 vViewDir;',
          'varying vec3 vWorldPos;',
          'void main() {',
          '  vec3 N = normalize(vNormal);',
          '  vec3 V = normalize(vViewDir);',
          '  vec3 L = normalize(vec3(0.42, 0.78, 0.68));',
          '  float faceMask = smoothstep(3.96, 4.10, vWorldPos.y) * (1.0 - smoothstep(4.40, 4.54, vWorldPos.y));',
          '  vec3 smoothFaceN = normalize(vec3(N.x * 0.92, N.y * 0.35, max(abs(N.z), 0.66)));',
          '  vec3 effN = normalize(mix(N, smoothFaceN, faceMask * 0.84));',
          '  float NdotL = dot(effN, L) * 0.5 + 0.5;',
          '  float NdotV = clamp(abs(dot(effN, V)), 0.0, 1.0);',
          '  float toonBand = smoothstep(0.38, 0.46, NdotL);',
          '  vec3 baseCol = mix(uMidCol, uHighlightCol, toonBand);',
          '  float rim = 1.0 - NdotV;',
          '  float rimBand = smoothstep(0.54, 0.74, rim);',
          '  float inkOutline = smoothstep(0.80, 0.90, rim);',
          '  vec3 col = mix(baseCol, uRimCol, rimBand * 0.60);',
          '  col = mix(col, uOutlineCol, inkOutline * 0.50);',
          '  float alpha = mix(0.22, 0.84, pow(rim, 1.55));',
          '  gl_FragColor = vec4(col, alpha);',
          '}'
        ].join(' '),
        transparent: true,
        depthWrite: false,
        side: THREE.FrontSide
      });
    }

    // 2.2 Smooth Lifelike Cel-Shaded Clay Shader for Organs & Bones (#6)
    function createToonClayMaterial(hiHex, midHex, shdHex, outHex, initialOpacity = 0.96, smoothFactor = 0.72) {
      return new THREE.ShaderMaterial({
        uniforms: {
          uHigh:    { value: new THREE.Color(hiHex) },
          uMid:     { value: new THREE.Color(midHex) },
          uShadow:  { value: new THREE.Color(shdHex) },
          uOutline: { value: new THREE.Color(outHex) },
          uOpacity: { value: initialOpacity },
          uCenter:  { value: new THREE.Vector3(0, 0, 0) },
          uSmooth:  { value: smoothFactor }
        },
        vertexShader: [
          'uniform vec3 uCenter;',
          'varying vec3 vNormal;',
          'varying vec3 vRadial;',
          'varying vec3 vViewDir;',
          'void main() {',
          '  vec4 mvPos = modelViewMatrix * vec4(position, 1.0);',
          '  vViewDir = normalize(-mvPos.xyz);',
          '  vNormal = normalize(normalMatrix * normal);',
          '  vec3 radLocal = position - uCenter;',
          '  float rLen = length(radLocal);',
          '  vRadial = rLen > 0.0001 ? normalize(normalMatrix * (radLocal / rLen)) : vNormal;',
          '  gl_Position = projectionMatrix * mvPos;',
          '}'
        ].join(' '),
        fragmentShader: [
          'uniform vec3 uHigh;',
          'uniform vec3 uMid;',
          'uniform vec3 uShadow;',
          'uniform vec3 uOutline;',
          'uniform float uOpacity;',
          'uniform float uSmooth;',
          'varying vec3 vNormal;',
          'varying vec3 vRadial;',
          'varying vec3 vViewDir;',
          'void main() {',
          '  vec3 N = normalize(mix(normalize(vNormal), normalize(vRadial), uSmooth));',
          '  vec3 V = normalize(vViewDir);',
          '  vec3 L = normalize(vec3(0.38, 0.72, 0.68));',
          '  float nl = dot(N, L) * 0.5 + 0.5;',
          '  float nv = clamp(abs(dot(N, V)), 0.0, 1.0);',
          '  float band1 = smoothstep(0.35, 0.42, nl);',
          '  float band2 = smoothstep(0.65, 0.72, nl);',
          '  vec3 col = mix(uShadow, uMid, band1);',
          '  col = mix(col, uHigh, band2);',
          '  vec3 H = normalize(L + V);',
          '  float spec = smoothstep(0.90, 0.95, max(0.0, dot(N, H)));',
          '  col = mix(col, vec3(0.99, 0.98, 0.95), spec * 0.45);',
          '  float ink = smoothstep(0.75, 0.87, 1.0 - nv);',
          '  col = mix(col, uOutline, ink * 0.70);',
          '  gl_FragColor = vec4(col, uOpacity);',
          '}'
        ].join(' '),
        transparent: true,
        depthWrite: true
      });
    }

        group.add(tubeMesh);

        // Ovary (Almond ellipsoid)
        const ovGeo = new THREE.SphereGeometry(0.022, 24, 24);
        ovGeo.scale(1.25, 0.85, 0.70);
        const ovMesh = new THREE.Mesh(ovGeo, ovaryMat);
        ovMesh.position.set(dir * 0.105, 0.008, -0.004);
        ovMesh.rotation.z = dir * 0.25;
        ovMesh.renderOrder = 6;
        group.add(ovMesh);

        // Ovarian Ligament connecting uterus to ovary
        const ligCurve = new THREE.CatmullRomCurve3([
          new THREE.Vector3(dir * 0.036, 0.032, 0.000),
          new THREE.Vector3(dir * 0.086, 0.012, -0.004)
        ]);
        const ligGeo = new THREE.TubeGeometry(ligCurve, 12, 0.0045, 10, false);
        const ligMesh = new THREE.Mesh(ligGeo, ovaryMat);
        ligMesh.renderOrder = 6;
        group.add(ligMesh);
      });

      scene.add(group);
      return { group, mats: [uterusMat, ovaryMat, glowMat] };
    }
    const uterus3D = createUterus3DGroup();

    // 2.6 Custom 3D Prostate + Urinary Bladder + Ureters Graphic (#1)
    function createProstate3DGroup() {
      const group = new THREE.Group();
      group.position.set(0.0, 2.26, 0.03);

      const bladderMat  = createToonClayMaterial('#F0B594', '#D18B66', '#9E5D3C', '#522B18', 0.98, 0.35);
      const prostateMat = createToonClayMaterial('#E0756C', '#B84B43', '#822923', '#47120E', 0.98, 0.35);
      const tractMat    = createToonClayMaterial('#FAE8C8', '#DEC296', '#B09264', '#59462A', 0.98, 0.30);

      // Urinary Bladder (Superior cushion above prostate)
      const blGeo = new THREE.SphereGeometry(0.058, 32, 32);
      blGeo.scale(1.12, 0.92, 0.85);
      const blMesh = new THREE.Mesh(blGeo, bladderMat);
      blMesh.position.set(0, 0.062, 0.004);
      blMesh.renderOrder = 6;
      group.add(blMesh);

      // Walnut/Chestnut-shaped Bilobed Prostate Gland right below bladder neck
      [-1, 1].forEach(dir => {
        const lobeGeo = new THREE.SphereGeometry(0.028, 28, 28);
        lobeGeo.scale(0.95, 1.05, 0.85);
        const lobeMesh = new THREE.Mesh(lobeGeo, prostateMat);
        lobeMesh.position.set(dir * 0.014, -0.004, 0.002);
        lobeMesh.renderOrder = 7;
        group.add(lobeMesh);
      });

      // Urethral Canal & Left/Right Ureters
      const urethraCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(0,  0.045, 0.018),
        new THREE.Vector3(0, -0.005, 0.018),
        new THREE.Vector3(0, -0.058, 0.016)
      ]);
      const urethraMesh = new THREE.Mesh(new THREE.TubeGeometry(urethraCurve, 20, 0.0055, 12, false), tractMat);
      urethraMesh.renderOrder = 8;
      group.add(urethraMesh);

      [-1, 1].forEach(dir => {
        const ureterCurve = new THREE.CatmullRomCurve3([
          new THREE.Vector3(dir * 0.046, 0.088, -0.010),
          new THREE.Vector3(dir * 0.062, 0.165, -0.020),
          new THREE.Vector3(dir * 0.072, 0.250, -0.030)
        ]);
        const ureterMesh = new THREE.Mesh(new THREE.TubeGeometry(ureterCurve, 20, 0.0048, 10, false), tractMat);
        ureterMesh.renderOrder = 6;
        group.add(ureterMesh);
      });

      scene.add(group);
      return { group, mats: [bladderMat, prostateMat, tractMat] };
    }
    const prostate3D = createProstate3DGroup();

    // 2.7 Whole-Body Blood Vessels (Vascular.glb) + Autonomic Nervous System for Vasovagal Syncope (#9)
    function createVascularMaterial(highHex, midHex, shadowHex, outlineHex, opacity) {
      return new THREE.ShaderMaterial({
        uniforms: {
          uHigh:    { value: new THREE.Color(highHex) },
          uMid:     { value: new THREE.Color(midHex) },
          uShadow:  { value: new THREE.Color(shadowHex) },
          uOutline: { value: new THREE.Color(outlineHex) },
          uOpacity: { value: opacity }
        },
        vertexShader: [
          'varying vec3 vNormal;',
          'varying vec3 vViewDir;',
          'varying vec3 vLocalPos;',
          'void main() {',
          '  vLocalPos = position;',
          '  vec4 mvPos = modelViewMatrix * vec4(position, 1.0);',
          '  vViewDir = normalize(-mvPos.xyz);',
          '  vNormal = normalize(normalMatrix * normal);',
          '  gl_Position = projectionMatrix * mvPos;',
          '}'
        ].join(' '),
        fragmentShader: [
          'uniform vec3 uHigh;',
          'uniform vec3 uMid;',
          'uniform vec3 uShadow;',
          'uniform vec3 uOutline;',
          'uniform float uOpacity;',
          'varying vec3 vNormal;',
          'varying vec3 vViewDir;',
          'varying vec3 vLocalPos;',
          'void main() {',
          '  if (vLocalPos.y > 1.92 && vLocalPos.y < 2.38 && abs(vLocalPos.x) < 0.092) discard;',
          '  vec3 N = normalize(vNormal);',
          '  vec3 V = normalize(vViewDir);',
          '  vec3 L = normalize(vec3(0.38, 0.72, 0.68));',
          '  float nl = dot(N, L) * 0.5 + 0.5;',
          '  float nv = clamp(abs(dot(N, V)), 0.0, 1.0);',
          '  vec3 col = mix(uShadow, uMid, smoothstep(0.35, 0.44, nl));',
          '  col = mix(col, uHigh, smoothstep(0.65, 0.74, nl));',
          '  col = mix(col, uOutline, smoothstep(0.74, 0.86, 1.0 - nv) * 0.65);',
          '  gl_FragColor = vec4(col, uOpacity);',
          '}'
        ].join(' '),
        transparent: true,
        depthWrite: true
      });
    }

    let vascularGroup = null;
    gltfLoader.load('https://raw.githubusercontent.com/ajwei0508-cpu/bareun-homepage/main/homepage/models/Vascular.glb', (gltf) => {
      vascularGroup = gltf.scene;
      vascularGroup.visible = false;
      const artMat = createVascularMaterial('#E8645E', '#C43B35', '#8C1F1B', '#4D0E0B', 0.88);
      const venMat = createVascularMaterial('#6BA3EB', '#3E76C2', '#224C87', '#112A4D', 0.85);
      vascularGroup.traverse(c => {
        if (c.isMesh) {
          c.material = (c.name || '').includes('Venous') ? venMat : artMat;
          c.renderOrder = 5;
        }
      });
      scene.add(vascularGroup);
      updateAnatomyHighlight();
    });

    function createAutonomicNerve3DGroup() {
      const group = new THREE.Group();
      const nerveMat = createToonClayMaterial('#FFF099', '#F2C94C', '#C49416', '#6E4F04', 0.98, 0.20);

      // Brainstem Autonomic Center & Solar/Cardiac Plexus Nodes
      [
        [0.0, 4.10, -0.02, 0.024], // Brainstem Medulla Autonomic Center
        [0.03, 3.52, 0.04, 0.020], // Cardiac Plexus
        [0.0, 3.12, 0.03, 0.022],  // Celiac / Solar Plexus
        [0.0, 2.48, 0.02, 0.018]   // Pelvic Autonomic Plexus
      ].forEach(([x, y, z, r]) => {
        const node = new THREE.Mesh(new THREE.SphereGeometry(r, 20, 20), nerveMat);
        node.position.set(x, y, z);
        node.renderOrder = 8;
        group.add(node);
      });

      // Left & Right Vagus Nerve + Sympathetic Chains + Lower Limb Autonomic Nerves
      [-1, 1].forEach(dir => {
        const vagusPath = new THREE.CatmullRomCurve3([
          new THREE.Vector3(dir * 0.022, 4.12, -0.02),
          new THREE.Vector3(dir * 0.038, 3.85,  0.00),
          new THREE.Vector3(dir * 0.042, 3.52,  0.03),
          new THREE.Vector3(dir * 0.028, 3.12,  0.03),
          new THREE.Vector3(dir * 0.035, 2.75,  0.01),
          new THREE.Vector3(dir * 0.045, 2.45,  0.00),
          new THREE.Vector3(dir * 0.115, 1.85, -0.04),
          new THREE.Vector3(dir * 0.145, 1.20, -0.08),
          new THREE.Vector3(dir * 0.155, 0.55, -0.08)
        ]);
        const vagusMesh = new THREE.Mesh(new THREE.TubeGeometry(vagusPath, 64, 0.0075, 12, false), nerveMat);
        vagusMesh.renderOrder = 8;
        group.add(vagusMesh);

        // Upper limb brachial autonomic branch
        const armPath = new THREE.CatmullRomCurve3([
          new THREE.Vector3(dir * 0.040, 3.78,  0.00),
          new THREE.Vector3(dir * 0.180, 3.62, -0.02),
          new THREE.Vector3(dir * 0.310, 3.15, -0.03),
          new THREE.Vector3(dir * 0.420, 2.55,  0.02)
        ]);
        const armMesh = new THREE.Mesh(new THREE.TubeGeometry(armPath, 32, 0.0055, 10, false), nerveMat);
        armMesh.renderOrder = 8;
        group.add(armMesh);
      });

      scene.add(group);
      return group;
    }
    const autonomicNerveGroup = createAutonomicNerve3DGroup();

    // Heart-Brain Golden Vitality Stream for Emperor Gongjindan (#8)
    function createGongjindanBridgeGroup() {
      const group = new THREE.Group();
      const goldMat = createToonClayMaterial('#FFF2A6', '#E5B842', '#AD8018', '#5E4306', 0.95, 0.20);
      [-1, 1].forEach(dir => {
        const curve = new THREE.CatmullRomCurve3([
          new THREE.Vector3(dir * 0.025, 3.52, 0.04),
          new THREE.Vector3(dir * 0.048, 3.88, 0.02),
          new THREE.Vector3(dir * 0.032, 4.26, 0.00)
        ]);
        const m = new THREE.Mesh(new THREE.TubeGeometry(curve, 32, 0.007, 12, false), goldMat);
        m.renderOrder = 7;
        group.add(m);
      });
      scene.add(group);
      return group;
    }
    const gongjindanBridgeGroup = createGongjindanBridgeGroup();

    // ========================================================================
    // 3. 8 BALANCED HOTSPOTS ON THE 3D BODY
    // ========================================================================
    const LEFT_ALIGNED_PARTS = ['cervical', 'gut', 'uterus'];
    const HOTSPOT_3D_ANCHORS = {
      syncope:    [ 0.08, 4.34,  0.04],
      cervical:   [-0.08, 3.92,  0.04],
      gongjindan: [ 0.08, 3.52,  0.08],
      gut:        [-0.08, 3.12,  0.08],
      lumbar:     [ 0.08, 2.76,  0.04],
      uterus:     [-0.10, 2.44,  0.05],
      prostate:   [ 0.10, 2.24,  0.05],
      knee:       [ 0.16, 1.20,  0.05]
    };

    const majorHotspotNodes = [];
    BODY_PARTS_DATA.forEach((part) => {
      const anchor = HOTSPOT_3D_ANCHORS[part.id] || [0, 3.0, 0];
      const isLeft = LEFT_ALIGNED_PARTS.includes(part.id);
      const dom = document.createElement('div');
      dom.className = 'body-3d-hotspot' + (isLeft ? ' align-left' : '') + (part.id === currentPartId ? ' active' : '');
      dom.innerHTML =
        '<div class="hotspot-pulse-ring">' +
          '<div class="hotspot-core-dot"></div>' +
          '<div class="hotspot-core-dot"></div>' +
          '<div class="hotspot-core-dot"></div>' +
        '</div>' +
        '<div class="hotspot-tag-pill">' + part.hotspotLabel + '</div>';
      dom.addEventListener('click', () => window.selectBodyPart(part.id, true));
      hotspotLayer.appendChild(dom);
      majorHotspotNodes.push({
        id: part.id,
        part: part,
        dom: dom,
        worldPos: new THREE.Vector3(...anchor)
      });
    });

    // ========================================================================
    // 4. CAMERA FLY-TO, RESET VIEW ("원위치"), & PART-SPECIFIC 3D GRAPHICS
    // ========================================================================
    const DEFAULT_CAM_POS = new THREE.Vector3(0.0, 2.75, 4.35);
    const DEFAULT_CAM_TARGET = new THREE.Vector3(0.0, 2.72, 0.0);
    const camGoalPos = DEFAULT_CAM_POS.clone();
    const camGoalTarget = DEFAULT_CAM_TARGET.clone();
    let isCameraFlying = false;
    let isOverviewCamera = true;

    controls.addEventListener('start', () => {
      isCameraFlying = false;
    });

    function updateAnatomyHighlight() {
      // 1) Special 3D Groups: Uterus (#2), Prostate (#1), Syncope Vessels & Nerves (#9), Gongjindan Bridge (#8)
      uterus3D.group.visible = (currentPartId === 'uterus') || (isOverviewCamera && currentPartId !== 'syncope');
      prostate3D.group.visible = (currentPartId === 'prostate');
      if (vascularGroup) vascularGroup.visible = (currentPartId === 'syncope');
      autonomicNerveGroup.visible = (currentPartId === 'syncope');
      gongjindanBridgeGroup.visible = (currentPartId === 'gongjindan');

      // 2) Spine, Pelvis, Knee & Intervertebral Discs (#3)
      const boneHighlightMap = {
        knee:       ['KneeJointBones', 'KneeGrowthPlate', 'LowerLimbs'],
        cervical:   ['CervicalSpine'],
        lumbar:     ['LumbarSpine', 'Pelvis'],
        gongjindan: ['CervicalSpine'],
        syncope:    [],
        gut:        ['LumbarSpine'],
        uterus:     ['Pelvis', 'LumbarSpine'],
        prostate:   ['Pelvis', 'LumbarSpine']
      };
      const activeBones = boneHighlightMap[currentPartId] || [];

      Object.keys(boneIllustrationMap).forEach(gName => {
        const entry = boneIllustrationMap[gName];
        if (gName.includes('KneeGrowthPlate')) {
          entry.mesh.visible = true;
          return;
        }
        const isMatched = (isOverviewCamera && currentPartId !== 'syncope') || activeBones.some(b => gName.includes(b));
        entry.mat.uniforms.uOpacity.value = isMatched ? 0.94 : 0.25;
        entry.mat.depthWrite = isMatched;
      });

      if (spinalDiscs3D && spinalDiscs3D.group) {
        const showDiscs = (isOverviewCamera && currentPartId !== 'syncope') || ['lumbar', 'cervical', 'uterus', 'prostate'].includes(currentPartId);
        spinalDiscs3D.group.visible = showDiscs;
        const discAlpha = (currentPartId === 'lumbar' || currentPartId === 'cervical') ? 0.98 : 0.85;
        spinalDiscs3D.mats.forEach(m => { m.uniforms.uOpacity.value = discAlpha; });
      }

      // 3) Natural Colored Internal Organs (#6, #8)
      const OVERVIEW_ORGANS = ['brain', 'heart', 'liver', 'stomach', 'intestine', 'kidneys'];
      Object.keys(loadedOrgans).forEach(key => {
        const entry = loadedOrgans[key];
        const isTarget = entry.cfg.parts.includes(currentPartId);
        if (isOverviewCamera && currentPartId !== 'syncope') {
          entry.scene.visible = OVERVIEW_ORGANS.includes(key);
          entry.mat.uniforms.uOpacity.value = 0.95;
          entry.mat.depthWrite = true;
        } else if (currentPartId === 'syncope') {
          entry.scene.visible = (key === 'brain' || key === 'heart');
          entry.mat.uniforms.uOpacity.value = 0.94;
          entry.mat.depthWrite = true;
        } else {
          entry.scene.visible = isTarget;
          entry.mat.uniforms.uOpacity.value = isTarget ? 0.97 : 0.0;
          entry.mat.depthWrite = isTarget;
        }
      });
    }

    window.selectBodyPart = function(partId, shouldFlyCamera = true) {
      const part = getPartById(partId);
      renderEncyclopedia(part.id, 0, 'next');

      // Automatically switch mannequin gender for Uterus (female) vs Prostate (male) if appropriate
      if (part.id === 'uterus') {
        window.setDonginGender('female');
      } else if (part.id === 'prostate') {
        window.setDonginGender('male');
      }

      const preset = PART_CAMERA_PRESETS[part.id];
      if (preset && shouldFlyCamera) {
        isOverviewCamera = (part.id === 'syncope');
        camGoalPos.set(...preset.camPos);
        camGoalTarget.set(...preset.camTarget);
        isCameraFlying = true;
      }

      majorHotspotNodes.forEach(h => {
        h.dom.classList.toggle('active', h.id === part.id);
      });

      updateAnatomyHighlight();
    };

    window.setDonginGender = function(gender) {
      currentGender = gender;
      document.getElementById('btn-gender-male')?.classList.toggle('active', gender === 'male');
      document.getElementById('btn-gender-female')?.classList.toggle('active', gender === 'female');
      if (maleBodyObj) maleBodyObj.visible = (gender === 'male');
      if (femaleBodyObj) femaleBodyObj.visible = (gender === 'female');
    };

    // Single Reset View ("원위치") Button (#5)
    window.resetDonginView = function() {
      isOverviewCamera = true;
      isCameraFlying = true;
      camGoalPos.copy(DEFAULT_CAM_POS);
      camGoalTarget.copy(DEFAULT_CAM_TARGET);
      updateAnatomyHighlight();
    };

    quickNavButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        window.selectBodyPart(btn.getAttribute('data-part'), true);
      });
    });

    function resizeRenderer() {
      if (!stageEl) return;
      const w = stageEl.clientWidth;
      const h = stageEl.clientHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / Math.max(1, h);
      camera.updateProjectionMatrix();
      camera.setFocalLength(38);
    }
    window.addEventListener('resize', resizeRenderer);
    resizeRenderer();

    // ========================================================================
    // 5. RENDER LOOP (STATIC HEART, SMOOTH CAMERA FLY-TO)
    // ========================================================================
    const projVec = new THREE.Vector3();

    function animate() {
      requestAnimationFrame(animate);

      if (isCameraFlying) {
        camera.position.lerp(camGoalPos, 0.08);
        controls.target.lerp(camGoalTarget, 0.09);
        if (camera.position.distanceTo(camGoalPos) < 0.012) {
          isCameraFlying = false;
        }
      }
      controls.update();

      const w = stageEl.clientWidth;
      const h = stageEl.clientHeight;
      majorHotspotNodes.forEach(item => {
        projVec.copy(item.worldPos).project(camera);
        if (projVec.z > 1.0) {
          item.dom.style.opacity = '0';
          return;
        }
        const sx = (projVec.x * 0.5 + 0.5) * w;
        const sy = (-projVec.y * 0.5 + 0.5) * h;
        item.dom.style.left = sx.toFixed(1) + 'px';
        item.dom.style.top = sy.toFixed(1) + 'px';
        item.dom.style.opacity = (sx > 16 && sx < w - 16 && sy > 28 && sy < h - 38) ? '1' : '0';
      });

      renderer.render(scene, camera);
    }

    const params = new URLSearchParams(window.location.search);
    const urlPart = params.get('part');
    if (urlPart) {
      window.selectBodyPart(urlPart, true);
    } else {
      window.selectBodyPart('knee', false);
      window.resetDonginView();
    }
    animate();
  </script>
</body>
