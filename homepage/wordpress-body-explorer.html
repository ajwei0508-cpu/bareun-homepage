      border: 1px solid var(--mono-border-soft);
      background: var(--mono-surface);
    }
    .hip-sec-card.sec-truth {
      background: var(--mono-white);
      border-color: var(--mono-ink);
    }
    .hip-sec-heading {
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--mono-black);
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .hip-two-lines {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .hip-line {
      margin: 0 !important;
      font-size: 0.83rem;
      font-weight: 600;
      color: #27272A;
      line-height: 1.5;
      word-break: keep-all;
    }
    .hip-check-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 8px;
      background: var(--mono-white);
      border: 1px solid var(--mono-border-soft);
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--mono-ink);
      line-height: 1.46;
      word-break: keep-all;
    }
    .hip-check-item input[type="checkbox"] {
      width: 15px;
      height: 15px;
      margin-top: 2px;
      accent-color: var(--mono-black);
      flex-shrink: 0;
      cursor: pointer;
    }

    .hip-audit-footer {
      padding: 9px 16px;
      background: var(--mono-surface-alt);
      border-top: 1px solid var(--mono-border-soft);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--mono-sub);
    }

    /* MENU 2: 무엇이든 물어보세요 (BLACK & WHITE) */
    .qna-menu-panel,
    .archive-menu-panel {
      background: var(--mono-white);
      border: 1.5px solid var(--mono-black);
      border-radius: 16px;
      padding: 18px;
      box-shadow: var(--mono-shadow);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .qna-panel-top,
    .archive-filter-bar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--mono-border-soft);
    }
    .qna-write-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 999px;
      background: var(--mono-black);
      color: var(--mono-white);
      font-size: 0.78rem;
      font-weight: 800;
      text-decoration: none;
      transition: all 0.16s ease;
    }
    .qna-write-btn:hover {
      background: #27272A;
    }
    .ptc-back-btn {
      appearance: none;
      border: 1px solid var(--mono-border);
      background: var(--mono-white);
      color: var(--mono-ink);
      font-family: 'Pretendard', sans-serif;
      font-size: 0.74rem;
      font-weight: 800;
      padding: 6px 11px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.16s ease;
    }
    .ptc-back-btn:hover {
      border-color: var(--mono-black);
      background: var(--mono-black);
      color: var(--mono-white);
    }
    .qna-item-row {
      padding: 12px 14px;
      border-radius: 11px;
      background: var(--mono-surface);
      border: 1px solid var(--mono-border-soft);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .qna-item-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--mono-muted);
    }
    .qna-status-badge {
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.68rem;
      font-weight: 800;
    }
    .qna-status-badge.answered {
      background: var(--mono-black);
      color: var(--mono-white);
    }
    .qna-status-badge.waiting {
      background: var(--mono-surface-alt);
      border: 1px solid var(--mono-border);
      color: var(--mono-ink);
    }
    .qna-item-title {
      font-size: 0.86rem;
      font-weight: 800;
      color: var(--mono-ink);
      line-height: 1.42;
    }

    /* MENU 3: 더 궁금하세요? 누적 아카이브 (BLACK & WHITE) */
    .archive-scope-pills {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }
    .archive-scope-btn {
      appearance: none;
      border: 1px solid var(--mono-border);
      background: var(--mono-surface);
      color: var(--mono-ink);
      font-family: 'Pretendard', sans-serif;
      font-size: 0.74rem;
      font-weight: 800;
      padding: 5px 11px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.16s ease;
    }
    .archive-scope-btn.active {
      background: var(--mono-black);
      border-color: var(--mono-black);
      color: var(--mono-white);
    }
    .archive-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .archive-card-btn {
      appearance: none;
      width: 100%;
      text-align: left;
      background: var(--mono-surface);
      border: 1px solid var(--mono-border-soft);
      border-radius: 11px;
      padding: 11px 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-family: 'Pretendard', sans-serif;
      transition: all 0.16s ease;
    }
    .archive-card-btn:hover {
      border-color: var(--mono-black);
      background: var(--mono-white);
      transform: translateX(-2px);
    }
    .archive-card-tags {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 4px;
      font-size: 0.69rem;
      font-weight: 800;
    }
    .archive-date-pill {
      padding: 2px 7px;
      border-radius: 5px;
      background: var(--mono-black);
      color: var(--mono-white);
    }
    .archive-part-pill {
      padding: 2px 7px;
      border-radius: 5px;
      background: var(--mono-white);
      border: 1px solid var(--mono-border);
      color: var(--mono-ink);
    }
    .archive-theme-pill {
      padding: 2px 7px;
      border-radius: 5px;
      background: var(--mono-surface-alt);
      color: var(--mono-sub);
    }
    .archive-card-title {
      font-size: 0.87rem;
      font-weight: 800;
      color: var(--mono-ink);
      line-height: 1.4;
      word-break: keep-all;
    }
    .archive-read-arrow {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--mono-black);
      white-space: nowrap;
      flex-shrink: 0;
    }
