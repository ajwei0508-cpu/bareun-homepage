<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>바른한의원 대전본점 | 3D 인체 질환 · 치료 · 홈케어 쇼룸</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Noto+Serif+KR:wght@500;600;700;800&family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
/* WORDPRESS & ASTRA THEME CONTAINER RESET */
.site-header, .site-footer, #masthead, #colophon, .entry-header, .ast-breadcrumbs-wrapper, .post-thumb, .post-thumb-img-content, .ast-single-post-order { display: none !important; }
.entry-content a, .ast-container a, .site-content a { text-decoration: none !important; }
.entry-content, .ast-container, .site-content, article.page, .ast-plain-container,
.elementor, .elementor-section-wrap, .wp-block-group {
  padding: 0 !important;
  margin: 0 !important;
  max-width: 100% !important;
  width: 100% !important;
  overflow: visible !important;
}
.ast-page-builder-template .entry-content[data-ast-blocks-layout] > .inherit-container-width > *,
.ast-page-builder-template .entry-content[data-ast-blocks-layout] > :not(.wp-block-group):where(:not(.uagb-is-root-container):not(.spectra-is-root-container)) > * {
  margin-left: 0;
  margin-right: 0;
}

    :root {
      /* 바른한의원 5대 시그니처 브랜드 컬러 팔레트 (베이지·브라운·블랙·화이트·그린) */
      --bg-beige: #F5F1E8;          /* 베이지 (신뢰감 · Trust) */
      --bg-beige-deep: #EBE4D5;     /* 딥 한지 베이지 */
      --bg-white: #FFFFFF;          /* 화이트 (투명 · Transparency) */
      --bg-white-glass: rgba(255, 255, 255, 0.88);
      --brown-deep: #4A3525;        /* 브라운 (부드러움 · Softness) */
      --brown-mid: #5E4736;         /* 소프트 에스프레소 브라운 */
      --brown-soft: #8A725E;        /* 웜 타우프 브라운 */
      --green-primary: #2D5A43;     /* 그린 (자연 · Nature) */
      --green-mid: #3D7357;         /* 보타니컬 세이지 그린 */
      --green-soft: #68A684;
      --green-tint: #E8F2EC;
      --black-ink: #171614;         /* 블랙 (진실 · Truth) */
      --black-sub: #3A3530;
      --border-warm: #DFD6C5;
      --border-strong: #C9BAA8;
      --shadow-soft: 0 12px 34px rgba(58, 42, 30, 0.06);
      --shadow-card: 0 6px 20px rgba(58, 42, 30, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg-beige);
      color: var(--black-ink);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* =========================================================================
       1. TOP HEADER BAR (8 CLINIC PARTS QUICK NAV)
       ========================================================================= */
    .vibrant-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 62px;
      z-index: 300;
      background: var(--bg-white-glass);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border-warm);
      box-shadow: 0 4px 20px rgba(58, 42, 30, 0.04);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      gap: 12px;
    }

    .vh-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--black-ink);
      flex-shrink: 0;
    }

    .vh-brand-mark {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: var(--green-primary);
      color: var(--bg-white);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Noto Serif KR', serif;
      font-weight: 800;
      font-size: 0.92rem;
    }

    .vh-brand-title {
      font-family: 'Noto Serif KR', serif;
      font-weight: 800;
      font-size: 0.98rem;
      color: var(--black-ink);
    }

    .vh-part-quicknav {
      display: flex;
      align-items: center;
      gap: 5px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 4px 0;
    }
    .vh-part-quicknav::-webkit-scrollbar { display: none; }

    .vh-part-chip {
      appearance: none;
      border: 1px solid var(--border-warm);
      background: var(--bg-white);
      color: var(--brown-mid);
      font-family: 'Pretendard', sans-serif;
      font-size: 0.74rem;
      font-weight: 700;
      padding: 6px 11px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .vh-part-chip:hover {
      border-color: var(--green-primary);
      color: var(--green-primary);
      background: var(--green-tint);
    }
    .vh-part-chip.active {
      background: var(--green-primary);
      border-color: var(--green-primary);
      color: var(--bg-white);
      box-shadow: 0 4px 12px rgba(45, 90, 67, 0.22);
    }

    .vh-right-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .vh-pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 13px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      text-decoration: none;
      border: 1px solid var(--border-warm);
      background: var(--bg-beige);
      color: var(--brown-deep);
      transition: all 0.2s ease;
    }
    .vh-pill-btn:hover {
      border-color: var(--brown-deep);
      background: var(--bg-beige-deep);
    }
    .vh-pill-btn.primary {
      background: var(--green-primary);
      border-color: var(--green-primary);
      color: var(--bg-white);
    }
    .vh-pill-btn.primary:hover {
      background: var(--brown-deep);
      border-color: var(--brown-deep);
    }

    /* =========================================================================
       2. UNIFIED 3D HUMAN BODY & MEDICAL INFORMATION WORKSPACE (LEFT 3D + RIGHT INFO)
       ========================================================================= */
    .vibrant-workspace {
      display: grid;
      grid-template-columns: 44% 56%;
      justify-items: stretch;
      align-items: stretch;
      width: 100% !important;
      max-width: 100% !important;
      min-height: 100vh;
      margin: 0 !important;
      padding-top: 62px;
      background:
        radial-gradient(circle at 30% 35%, #FAF7F0 0%, #F4EFE4 58%, #EBE3D3 100%);
    }

    .vibrant-3d-stage {
      position: sticky;
      top: 62px;
      width: 100% !important;
      min-width: 100% !important;
      max-width: 100% !important;
      margin: 0 !important;
      justify-self: stretch !important;
      height: calc(100vh - 62px);
      background: radial-gradient(circle at 50% 42%, #FAF7F0 0%, #EFE9DA 68%, #E4DCCB 100%);
      border-right: 1px solid var(--border-warm);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      user-select: none;
      z-index: 10;
    }

    #vibrant-body-canvas {
      position: absolute;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
      max-width: 100% !important;
      display: block;
      z-index: 2;
      cursor: grab;
    }
    #vibrant-body-canvas:active { cursor: grabbing; }

    .stage-top-badge {
      position: relative;
      z-index: 25;
      margin: 16px auto 0;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid var(--border-warm);
      box-shadow: var(--shadow-card);
      width: fit-content;
      pointer-events: none;
    }

    .stage-top-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green-primary);
    }

    .stage-top-text {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--brown-deep);
    }

    /* Bottom Control Bar: ONLY Gender Toggle + Reset View ("원위치") */
    .stage-bottom-bar {
      position: relative;
      z-index: 25;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid var(--border-warm);
      box-shadow: var(--shadow-soft);
    }

    .stage-ctrl-btn {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--brown-mid);
      font-family: 'Pretendard', sans-serif;
      font-size: 0.74rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .stage-ctrl-btn:hover {
      color: var(--black-ink);
      background: var(--bg-beige);
    }
    .stage-ctrl-btn.active {
      background: var(--green-primary);
      color: var(--bg-white);
    }
    .stage-ctrl-btn.reset-btn {
      background: var(--brown-deep);
      color: var(--bg-white);
    }
    .stage-ctrl-btn.reset-btn:hover {
      background: var(--green-primary);
    }

    /* 2D Overlay Layer for 8 Organ Hotspots */
    #hotspot-overlay-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 20;
      overflow: hidden;
    }

    .body-3d-hotspot {
      position: absolute;
      transform: translate(-50%, -50%);
      pointer-events: auto;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .body-3d-hotspot:hover { z-index: 40; }

    .hotspot-pulse-ring {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.96);
      border: 1.5px solid var(--brown-mid);
      box-shadow: 0 4px 10px rgba(58, 42, 30, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      flex-shrink: 0;
      transition: all 0.22s ease;
    }

    .hotspot-core-dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--brown-deep);
    }

    .body-3d-hotspot.active .hotspot-pulse-ring {
      background: var(--green-primary);
      border-color: var(--bg-white);
      box-shadow: 0 0 0 4px rgba(45, 90, 67, 0.22), 0 4px 14px rgba(45, 90, 67, 0.35);
    }
    .body-3d-hotspot.active .hotspot-core-dot {
      background: var(--bg-white);
    }

    .hotspot-tag-pill {
      display: none;
    }

    /* Loader */
    #dongin-loader-overlay {
      position: absolute;
      inset: 0;
      z-index: 60;
      background: rgba(245, 241, 232, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    #dongin-loader-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .loader-spinner {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 3px solid var(--border-warm);
      border-top-color: var(--green-primary);
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* =========================================================================
       3. RIGHT SECTION: UNIFIED 4-STEP MEDICAL INFO SLIDE DECK + SCI SIDEBAR
       ========================================================================= */
    .encyclopedia-scroll-panel {
      width: 100% !important;
      min-width: 0 !important;
      max-width: 100% !important;
      margin: 0 !important;
      justify-self: stretch !important;
      padding: 26px 32px 42px;
      background: var(--bg-beige);
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: calc(100vh - 62px);
    }

    /* Top Title Header */
    .encyc-part-header {
      padding-bottom: 16px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border-warm);
    }

    .encyc-part-kicker {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.09em;
      color: var(--green-primary);
      background: var(--green-tint);
      padding: 4px 11px;
      border-radius: 999px;
      margin-bottom: 8px;
    }

    .encyc-part-title {
      font-family: 'Noto Serif KR', serif;
      font-size: clamp(1.35rem, 1.9vw, 1.75rem);
      font-weight: 800;
      color: var(--black-ink);
      letter-spacing: -0.02em;
      line-height: 1.28;
    }

    .encyc-part-lead {
      margin-top: 6px;
      font-size: 0.86rem;
      line-height: 1.6;
      color: var(--black-sub);
      word-break: keep-all;
    }

    /* Step Selector Bar (4 Selectable Pages per Condition) */
    .slide-tabs-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .slide-tabs-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .slide-step-tab {
      appearance: none;
      border: 1px solid var(--border-warm);
      background: var(--bg-white);
      color: var(--brown-mid);
      font-family: 'Pretendard', sans-serif;
      font-size: 0.78rem;
      font-weight: 800;
      padding: 8px 15px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.22s ease;
    }
    .slide-step-tab:hover {
      border-color: var(--green-primary);
      color: var(--green-primary);
    }
    .slide-step-tab.active {
      background: var(--brown-deep);
      border-color: var(--brown-deep);
      color: var(--bg-white);
      box-shadow: 0 4px 12px rgba(58, 42, 30, 0.18);
    }

    .slide-page-counter {
      font-size: 0.76rem;
      font-weight: 800;
      color: var(--brown-soft);
      padding: 5px 12px;
      border-radius: 999px;
      background: var(--bg-beige-deep);
    }

    /* 2-Column Content Area: [Interactive Slide Card (70%)] + [Compact SCI Paper Side Rail (30%)] */
    .encyc-main-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 235px;
      gap: 18px;
      align-items: start;
      flex: 1;
    }

    /* Animated Slide Deck Container */
    .slide-stage-card {
      background: var(--bg-white);
      border: 1px solid var(--border-warm);
      border-radius: 20px;
      padding: 20px 22px;
      box-shadow: var(--shadow-soft);
      overflow: hidden;
      position: relative;
    }

    /* Page Transition Animations (#7-3) */
    @keyframes slideMotionNext {
      0% { opacity: 0; transform: translateX(34px) scale(0.985); }
      100% { opacity: 1; transform: translateX(0) scale(1); }
    }
    @keyframes slideMotionPrev {
      0% { opacity: 0; transform: translateX(-34px) scale(0.985); }
      100% { opacity: 1; transform: translateX(0) scale(1); }
    }
    .slide-anim-next {
      animation: slideMotionNext 0.42s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .slide-anim-prev {
      animation: slideMotionPrev 0.42s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* Soft Editorial Illustration Banner blended with Slide Header (#7-2) */
    .slide-visual-banner {
      display: grid;
      grid-template-columns: 185px 1fr;
      gap: 16px;
      align-items: center;
      background: var(--bg-beige);
      border: 1px solid var(--border-warm);
      border-radius: 15px;
      padding: 12px 16px;
      margin-bottom: 16px;
    }

    .slide-illust-thumb {
      width: 100%;
      height: 112px;
      object-fit: cover;
      border-radius: 11px;
      border: 1px solid var(--border-warm);
      background: #EFE9DC;
      display: block;
    }

    .slide-banner-badge {
      display: inline-block;
      font-size: 0.69rem;
      font-weight: 800;
      color: var(--green-primary);
      background: var(--green-tint);
      padding: 3px 9px;
      border-radius: 999px;
      margin-bottom: 6px;
    }

    .slide-banner-heading {
      font-family: 'Noto Serif KR', serif;
      font-size: 1.08rem;
      font-weight: 800;
      color: var(--black-ink);
      line-height: 1.35;
      margin-bottom: 5px;
      word-break: keep-all;
    }

    .slide-banner-summary {
      font-size: 0.81rem;
      line-height: 1.55;
      color: var(--black-sub);
      word-break: keep-all;
    }

    /* 3 Concise Core Cards per Slide (#7-1) */
    .slide-cards-stack {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .concise-point-card {
      background: #FAF8F3;
      border: 1px solid var(--border-warm);
      border-left: 4px solid var(--green-primary);
      border-radius: 13px;
      padding: 12px 16px;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .concise-point-card:hover {
      transform: translateX(3px);
      border-color: var(--green-primary);
    }

    .cpc-tag {
      font-size: 0.7rem;
      font-weight: 800;
      color: var(--brown-mid);
      margin-bottom: 3px;
    }

    .cpc-title {
      font-size: 0.92rem;
      font-weight: 800;
      color: var(--black-ink);
      margin-bottom: 4px;
      word-break: keep-all;
    }

    .cpc-desc {
      font-size: 0.81rem;
      line-height: 1.54;
      color: var(--black-sub);
      word-break: keep-all;
    }

    /* Slide Bottom Pagination & Clinic Link Bar */
    .slide-footer-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-top: 12px;
      border-top: 1px solid var(--border-warm);
      flex-wrap: wrap;
    }

    .slide-arrow-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .slide-nav-btn {
      appearance: none;
      border: 1px solid var(--border-warm);
      background: var(--bg-beige);
      color: var(--brown-deep);
      font-family: 'Pretendard', sans-serif;
      font-size: 0.76rem;
      font-weight: 800;
      padding: 7px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .slide-nav-btn:hover {
      background: var(--brown-deep);
      border-color: var(--brown-deep);
      color: var(--bg-white);
    }

    .slide-clinic-cta {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 15px;
      border-radius: 999px;
      background: var(--green-primary);
      color: var(--bg-white);
      font-size: 0.76rem;
      font-weight: 800;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .slide-clinic-cta:hover {
      background: var(--brown-deep);
    }

    /* Compact SCI Paper Titles Side Rail (#7) */
    .sci-side-rail {
      background: var(--bg-white);
      border: 1px solid var(--border-warm);
      border-radius: 18px;
      padding: 16px 15px;
      box-shadow: var(--shadow-card);
    }

    .sci-rail-header {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--brown-deep);
      padding-bottom: 8px;
      margin-bottom: 8px;
      border-bottom: 1px solid var(--border-warm);
    }

    .sci-rail-note {
      font-size: 0.69rem;
      line-height: 1.48;
      color: var(--brown-soft);
      margin-bottom: 10px;
      word-break: keep-all;
    }

    .sci-mini-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .sci-mini-item {
      background: var(--bg-beige);
      border: 1px solid var(--border-warm);
      border-radius: 10px;
      padding: 8px 10px;
    }

    .sci-mini-journal {
      font-size: 0.64rem;
      font-weight: 800;
      color: var(--green-primary);
      margin-bottom: 2px;
      letter-spacing: 0.02em;
    }

    .sci-mini-title {
      font-size: 0.71rem;
      font-weight: 700;
      line-height: 1.42;
      color: var(--black-ink);
      word-break: keep-all;
    }

    @media (max-width: 1120px) {
      .vibrant-header {
        position: sticky;
        top: 0;
        height: auto;
        min-height: 52px;
        padding: 8px 12px;
        flex-wrap: wrap;
        gap: 6px;
      }
      .vh-brand {
        gap: 6px;
        flex: 1;
        min-width: 0;
      }
      .vh-brand-mark {
        width: 24px;
        height: 24px;
        font-size: 0.76rem;
        border-radius: 6px;
        flex-shrink: 0;
      }
      .vh-brand-title {
        font-size: 0.78rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .vh-right-actions {
        gap: 4px;
        flex-shrink: 0;
      }
      .vh-right-actions a[href^="tel:"],
      .vh-right-actions .vh-pill-btn.primary {
        display: none;
      }
      .vh-pill-btn {
        padding: 5px 9px;
        font-size: 0.66rem;
        white-space: nowrap;
      }
      .vh-part-quicknav {
        order: 3;
        width: 100%;
        padding: 2px 0 0;
        gap: 5px;
        overflow-x: auto;
