<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>바른한의원 대전본점 | 아빠 한의사 3D 인체모형 · 질환별 자동발행 의학백과 블로그</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Noto+Serif+KR:wght@500;600;700;800&family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
/* WORDPRESS & ASTRA THEME CONTAINER RESET */
.site-header, .site-footer, #masthead, #colophon, .entry-header, .ast-breadcrumbs-wrapper, .post-thumb, .post-thumb-img-content, .ast-single-post-order { display: none !important; }
.entry-content a, .ast-container a, .site-content a { text-decoration: none !important; }
.entry-content, .ast-container, .site-content, article.page, .ast-plain-container,
.elementor, .elementor-section-wrap, .wp-block-group {
  padding: 0 !important;
  margin: 0 !important;
  max-width: 100% !important;
  width: 100% !important;
  overflow: visible !important;
}
.ast-page-builder-template .entry-content[data-ast-blocks-layout] > .inherit-container-width > *,
.ast-page-builder-template .entry-content[data-ast-blocks-layout] > :not(.wp-block-group):where(:not(.uagb-is-root-container):not(.spectra-is-root-container)) > * {
  margin-left: 0;
  margin-right: 0;
}

    :root {
      /* 바른한의원 고시인성(High-Visibility) 브랜드 컬러 팔레트 */
      --bg-beige: #F4F1EA;          /* 정갈한 한지 배경 */
      --bg-beige-deep: #E6DFD1;     /* 딥 베이지 */
      --bg-white: #FFFFFF;          /* 고대비 순백 카드 */
      --bg-white-glass: rgba(255, 255, 255, 0.96);
      --brown-deep: #362417;        /* 짙은 에스프레소 브라운 */
      --brown-mid: #4A3525;         /* 미디엄 브라운 */
      --brown-soft: #635142;        /* 선명한 서브 브라운 */
      --green-primary: #1B4332;     /* 딥 포레스트 그린 (최고 시인성) */
      --green-mid: #2D6A4F;         /* 에메랄드 세이지 그린 */
      --green-soft: #52B788;
      --green-tint: #E6F4ED;
      --black-ink: #111111;         /* 선명한 딥 블랙 (제목·핵심 본문) */
      --black-sub: #1F2421;         /* 가독성 최우선 다크 차콜 (본문) */
      --border-warm: #C8D6CE;       /* 또렷한 카드 경계선 */
      --border-strong: #94B0A0;     /* 강조 카드 경계선 */
      --shadow-soft: 0 14px 36px rgba(27, 67, 50, 0.08);
      --shadow-card: 0 8px 22px rgba(27, 67, 50, 0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg-beige);
      color: var(--black-ink);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* =========================================================================
       1. TOP HEADER BAR (9 CLINIC PARTS QUICK NAV)
       ========================================================================= */
    .vibrant-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 64px;
      z-index: 300;
      background: var(--bg-white-glass);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1.5px solid var(--border-warm);
      box-shadow: 0 4px 20px rgba(17, 17, 17, 0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      gap: 12px;
    }

    .vh-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--black-ink);
      flex-shrink: 0;
    }

    .vh-brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: var(--green-primary);
      color: var(--bg-white);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Noto Serif KR', serif;
      font-weight: 800;
      font-size: 0.96rem;
    }

    .vh-brand-title {
      font-family: 'Noto Serif KR', serif;
      font-weight: 800;
      font-size: 1.02rem;
      color: var(--black-ink);
    }

    .vh-part-quicknav {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 4px 0;
    }
    .vh-part-quicknav::-webkit-scrollbar { display: none; }

    .vh-part-chip {
      appearance: none;
      border: 1.5px solid #D0C8B8;
      background: var(--bg-white);
      color: #222222;
      font-family: 'Pretendard', sans-serif;
      font-size: 0.82rem;
      font-weight: 800;
      padding: 7px 13px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .vh-part-chip:hover {
      border-color: var(--green-primary);
      color: var(--green-primary);
      background: var(--green-tint);
    }
    .vh-part-chip.active {
      background: var(--green-primary);
      border-color: var(--green-primary);
      color: var(--bg-white);
      box-shadow: 0 4px 12px rgba(27, 67, 50, 0.25);
    }

    .vh-right-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .vh-pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 800;
      text-decoration: none;
      border: 1.5px solid #C8C0B0;
      background: var(--bg-white);
      color: var(--black-ink);
      transition: all 0.2s ease;
    }
    .vh-pill-btn:hover {
      border-color: var(--green-primary);
      background: var(--green-tint);
    }
    .vh-pill-btn.primary {
      background: var(--green-primary);
      border-color: var(--green-primary);
      color: var(--bg-white);
    }
    .vh-pill-btn.primary:hover {
      background: var(--brown-deep);
      border-color: var(--brown-deep);
    }

    /* =========================================================================
       2. UNIFIED 3D HUMAN BODY & MEDICAL INFORMATION WORKSPACE (LEFT 40% + RIGHT 60%)
       ========================================================================= */
    .vibrant-workspace {
      display: grid;
      grid-template-columns: 40% 60%;
      justify-items: stretch;
      align-items: stretch;
      width: 100% !important;
      max-width: 100% !important;
      min-height: 100vh;
      margin: 0 !important;
      padding-top: 64px;
      background: #F4F1EA;
    }

    .vibrant-3d-stage {
      position: sticky;
      top: 62px;
      width: 100% !important;
      min-width: 100% !important;
      max-width: 100% !important;
      margin: 0 !important;
      justify-self: stretch !important;
      height: calc(100vh - 62px);
      background: radial-gradient(circle at 50% 42%, #FAF7F0 0%, #EFE9DA 68%, #E4DCCB 100%);
      border-right: 1px solid var(--border-warm);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      user-select: none;
      z-index: 10;
    }

    #vibrant-body-canvas {
      position: absolute;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
      max-width: 100% !important;
      display: block;
      z-index: 2;
      cursor: grab;
    }
    #vibrant-body-canvas:active { cursor: grabbing; }

    .stage-top-badge {
      position: relative;
      z-index: 25;
      margin: 16px auto 0;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid var(--border-warm);
      box-shadow: var(--shadow-card);
      width: fit-content;
      pointer-events: none;
    }

    .stage-top-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green-primary);
    }

    .stage-top-text {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--brown-deep);
    }

    /* Bottom Control Bar: ONLY Gender Toggle + Reset View ("원위치") */
    .stage-bottom-bar {
      position: relative;
      z-index: 25;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid var(--border-warm);
      box-shadow: var(--shadow-soft);
    }

    .stage-ctrl-btn {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--brown-mid);
      font-family: 'Pretendard', sans-serif;
      font-size: 0.74rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .stage-ctrl-btn:hover {
      color: var(--black-ink);
      background: var(--bg-beige);
    }
    .stage-ctrl-btn.active {
      background: var(--green-primary);
      color: var(--bg-white);
    }
    .stage-ctrl-btn.reset-btn {
      background: var(--brown-deep);
      color: var(--bg-white);
    }
    .stage-ctrl-btn.reset-btn:hover {
      background: var(--green-primary);
    }

    /* 2D Overlay Layer for 8 Organ Hotspots */
    #hotspot-overlay-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 20;
      overflow: hidden;
    }

    .body-3d-hotspot {
      position: absolute;
      transform: translate(-50%, -50%);
      pointer-events: auto;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .body-3d-hotspot:hover { z-index: 40; }

    .hotspot-pulse-ring {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.96);
      border: 1.5px solid var(--brown-mid);
      box-shadow: 0 4px 10px rgba(58, 42, 30, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      flex-shrink: 0;
      transition: all 0.22s ease;
    }

    .hotspot-core-dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--brown-deep);
    }

    .body-3d-hotspot.active .hotspot-pulse-ring {
      background: var(--green-primary);
      border-color: var(--bg-white);
      box-shadow: 0 0 0 4px rgba(45, 90, 67, 0.22), 0 4px 14px rgba(45, 90, 67, 0.35);
    }
    .body-3d-hotspot.active .hotspot-core-dot {
      background: var(--bg-white);
    }

    .hotspot-tag-pill {
      display: none;
    }

    /* Loader */
    #dongin-loader-overlay {
      position: absolute;
      inset: 0;
      z-index: 60;
      background: rgba(245, 241, 232, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    #dongin-loader-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .loader-spinner {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 3px solid var(--border-warm);
      border-top-color: var(--green-primary);
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* =========================================================================
       3. RIGHT SECTION: HIGH-VISIBILITY MEDICAL INFO SLIDE DECK + SCI SIDEBAR
       ========================================================================= */
    .encyclopedia-scroll-panel {
      width: 100% !important;
      min-width: 0 !important;
      max-width: 100% !important;
      margin: 0 !important;
      justify-self: stretch !important;
      padding: 28px 34px 48px;
      background: var(--bg-beige);
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      min-height: calc(100vh - 68px);
    }

    /* Top Title Header */
    .encyc-part-header {
      padding-bottom: 18px;
      margin-bottom: 18px;
      border-bottom: 1.5px solid var(--border-warm);
    }

    .encyc-part-kicker {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: var(--green-primary);
      background: var(--green-tint);
      border: 1px solid #B6D7C4;
      padding: 5px 13px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    .encyc-part-title {
      font-family: 'Noto Serif KR', serif;
      font-size: clamp(1.52rem, 2.2vw, 2.02rem);
      font-weight: 800;
      color: var(--black-ink);
      letter-spacing: -0.025em;
      line-height: 1.32;
    }

    .encyc-part-lead {
      margin-top: 8px;
      font-size: 0.98rem;
      font-weight: 500;
      line-height: 1.68;
      color: var(--black-sub);
      word-break: keep-all;
    }

    /* Step Selector Bar (4 Selectable Pages + 5th Blog Page per Condition) */
    .slide-tabs-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .slide-tabs-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .slide-step-tab {
      appearance: none;
      border: 1.5px solid var(--border-strong);
      background: var(--bg-white);
      color: var(--brown-deep);
      font-family: 'Pretendard', sans-serif;
      font-size: 0.88rem;
      font-weight: 800;
      padding: 10px 18px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .slide-step-tab:hover {
      border-color: var(--green-primary);
      color: var(--green-primary);
      background: var(--green-tint);
    }
    .slide-step-tab.active {
      background: var(--brown-deep);
      border-color: var(--brown-deep);
      color: var(--bg-white);
      box-shadow: 0 5px 14px rgba(34, 24, 17, 0.22);
    }

    .slide-page-counter {
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--brown-deep);
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--bg-beige-deep);
      border: 1px solid var(--border-warm);
    }

    /* 2-Column Content Area for Medical Slides (Full-width when Blog Tab is active) */
    .encyc-main-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 265px;
      gap: 20px;
      align-items: start;
      flex: 1;
    }
    .encyc-main-grid.blog-mode-full {
      grid-template-columns: minmax(0, 1fr);
    }

    /* Animated Slide Deck Container */
    .slide-stage-card {
      background: var(--bg-white);
      border: 1.5px solid var(--border-strong);
      border-radius: 22px;
      padding: 26px 28px;
      box-shadow: var(--shadow-soft);
      overflow: hidden;
      position: relative;
    }

    /* Page Transition Animations */
    @keyframes slideMotionNext {
      0% { opacity: 0; transform: translateX(28px) scale(0.99); }
      100% { opacity: 1; transform: translateX(0) scale(1); }
    }
    @keyframes slideMotionPrev {
      0% { opacity: 0; transform: translateX(-28px) scale(0.99); }
      100% { opacity: 1; transform: translateX(0) scale(1); }
    }
    .slide-anim-next {
      animation: slideMotionNext 0.36s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .slide-anim-prev {
      animation: slideMotionPrev 0.36s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* Editorial Illustration Banner blended with Slide Header */
    .slide-visual-banner {
      display: grid;
      grid-template-columns: 215px 1fr;
      gap: 20px;
      align-items: center;
      background: #F6F2E9;
      border: 1.5px solid var(--border-warm);
      border-radius: 16px;
      padding: 16px 20px;
      margin-bottom: 20px;
    }

    .slide-illust-thumb {
      width: 100%;
      height: 132px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid var(--border-strong);
      background: #EFE9DC;
      display: block;
    }

    .slide-banner-badge {
      display: inline-block;
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--green-primary);
      background: var(--green-tint);
      border: 1px solid #B6D7C4;
      padding: 4px 11px;
      border-radius: 999px;
      margin-bottom: 8px;
    }

    .slide-banner-heading {
      font-family: 'Noto Serif KR', serif;
      font-size: 1.24rem;
      font-weight: 800;
      color: var(--black-ink);
      line-height: 1.4;
      margin-bottom: 7px;
      word-break: keep-all;
    }

    .slide-banner-summary {
      font-size: 0.94rem;
      font-weight: 500;
      line-height: 1.65;
      color: var(--black-sub);
      word-break: keep-all;
    }

    /* 3 Concise Core Cards per Slide */
    .slide-cards-stack {
      display: grid;
      grid-template-columns: 1fr;
      gap: 13px;
      margin-bottom: 20px;
    }

    .concise-point-card {
      background: #FCFBF8;
      border: 1.5px solid var(--border-warm);
      border-left: 5px solid var(--green-primary);
      border-radius: 14px;
      padding: 16px 20px;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .concise-point-card:hover {
      transform: translateX(3px);
      border-color: var(--green-primary);
      box-shadow: 0 6px 18px rgba(27, 67, 50, 0.08);
    }

    .cpc-tag {
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--green-primary);
      margin-bottom: 5px;
    }

    .cpc-title {
      font-size: 1.06rem;
      font-weight: 800;
      color: var(--black-ink);
      margin-bottom: 6px;
      line-height: 1.42;
      word-break: keep-all;
    }

    .cpc-desc {
      font-size: 0.94rem;
      font-weight: 500;
      line-height: 1.68;
      color: var(--black-sub);
      word-break: keep-all;
    }

    /* Slide Bottom Pagination & Clinic Link Bar */
    .slide-footer-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 16px;
      border-top: 1.5px solid var(--border-warm);
      flex-wrap: wrap;
    }

    .slide-arrow-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .slide-nav-btn {
      appearance: none;
      border: 1.5px solid var(--border-strong);
      background: var(--bg-beige);
      color: var(--brown-deep);
      font-family: 'Pretendard', sans-serif;
      font-size: 0.86rem;
      font-weight: 800;
      padding: 9px 17px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .slide-nav-btn:hover {
      background: var(--brown-deep);
      border-color: var(--brown-deep);
      color: var(--bg-white);
    }

    .slide-clinic-cta {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 19px;
      border-radius: 999px;
      background: var(--green-primary);
      color: var(--bg-white);
      font-size: 0.88rem;
      font-weight: 800;
      text-decoration: none;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(27, 67, 50, 0.22);
    }
    .slide-clinic-cta:hover {
      background: var(--brown-deep);
    }

    /* SCI Paper Titles Side Rail */
    .sci-side-rail {
      background: var(--bg-white);
      border: 1.5px solid var(--border-strong);
      border-radius: 18px;
      padding: 18px 17px;
      box-shadow: var(--shadow-card);
    }

    .sci-rail-header {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.86rem;
      font-weight: 800;
      color: var(--brown-deep);
      padding-bottom: 10px;
      margin-bottom: 10px;
      border-bottom: 1.5px solid var(--border-warm);
    }

    .sci-rail-note {
      font-size: 0.79rem;
      font-weight: 500;
      line-height: 1.56;
      color: var(--black-sub);
      margin-bottom: 12px;
      word-break: keep-all;
    }

    .sci-mini-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .sci-mini-item {
      background: #F7F4EC;
      border: 1px solid var(--border-warm);
      border-radius: 11px;
      padding: 10px 12px;
    }

    .sci-mini-journal {
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--green-primary);
      margin-bottom: 3px;
      letter-spacing: 0.01em;
    }

    .sci-mini-title {
      font-size: 0.8rem;
      font-weight: 700;
      line-height: 1.48;
      color: var(--black-ink);
      word-break: keep-all;
    }

    /* =========================================================================
       4. HIGH-VISIBILITY DISEASE BLOG & 5-LAYOUT EDITORIAL COLUMN SYSTEM
       ========================================================================= */
    .slide-step-tab.blog-tab-btn {
      border-color: var(--green-primary);
      background: linear-gradient(135deg, #E8F4ED 0%, #D6EBE0 100%);
      color: var(--green-primary);
      display: inline-flex;
      align-items: center;
      gap: 7px;
      position: relative;
    }
    .slide-step-tab.blog-tab-btn:hover,
